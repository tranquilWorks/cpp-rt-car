name: Documentation contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate static contract
        run: python3 tools/check_docs_contract.py
      - name: Validate portable release contract
        run: python3 tools/check_release_contract.py
      - name: Test release tooling
        run: python3 tests/test_release_tools.py
      - name: Validate generated SDK docs and negative controls
        run: |
          python3 tools/generate_sdk_docs.py --check
          python3 tools/check_sdk_docs.py
          python3 -m unittest discover -s tests/installed_docs -p 'test_*.py'
      - name: Verify archived manual and executable recipes
        run: python3 tests/installed_docs/verify_package.py --work-directory build-installed-docs
      - name: Run installed SDK first use
        run: |
          cmake -S . -B build-sdk -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=OFF -DRTFW_BUILD_EXAMPLES=OFF -DRTFW_BUILD_RUNTIME_DEMO=OFF -DRTFW_BUILD_EXPERIMENTAL=OFF
          cmake --build build-sdk --config Release --parallel 2
          cmake --install build-sdk --config Release --prefix "$PWD/rtfw-sdk"
          cmake -S rtfw-sdk/share/rtfw/examples/hello_runtime -B build-hello -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/rtfw-sdk"
          cmake --build build-hello --config Release --parallel 2
          ctest --test-dir build-hello -C Release --output-on-failure
      - name: Run embedded SDK first use
        run: |
          cmake -S samples/hello_runtime -B build-hello-embedded -DCMAKE_BUILD_TYPE=Release -DHELLO_RTFW_SOURCE="$PWD"
          cmake --build build-hello-embedded --config Release --parallel 2
          ctest --test-dir build-hello-embedded -C Release --output-on-failure
      - name: Verify relocated hello and failure diagnostics
        run: python3 tests/hello_runtime/verify_package.py --work-directory build-hello-package
      - name: Analyze public hello source
        run: clang++ --analyze -Xanalyzer -analyzer-output=text -std=c++20 -Wall -Wextra -Werror -Irt/include -Icore/include -Iinclude samples/hello_runtime/main.cpp
      - name: Verify relocated typed SDK and negative controls
        run: python3 tests/typed_runtime/verify_package.py --work-directory build-typed-package
      - name: Analyze typed SDK source
        run: clang++ --analyze -Xanalyzer -analyzer-output=text -std=c++20 -Wall -Wextra -Werror -Irt/include -Icore/include -Iinclude samples/typed_runtime/main.cpp tests/typed_runtime/test_sdk.cpp
      - name: Verify relocated backend authoring kit
        run: python3 tests/backend_authoring/verify_package.py --work-directory build-backend-package
      - name: Analyze backend authoring source
        run: clang++ --analyze -Xanalyzer -analyzer-output=text -std=c++20 -Wall -Wextra -Werror -Irt/include -Icore/include -Iinclude samples/backend_authoring/main.cpp tests/backend_authoring/test_backend.cpp
      - name: Verify relocated external CIL kit
        run: python3 tests/cil_shared_memory/verify_package.py --work-directory build-cil-package
      - name: Analyze external CIL source
        run: clang++ --analyze -Xanalyzer -analyzer-output=text -std=c++20 -Wall -Wextra -Werror -Irt/include -Icore/include -Iinclude samples/cil_shared_memory/plant.cpp samples/cil_shared_memory/controller.cpp tests/cil_shared_memory/test_cil.cpp
      - name: Verify relocated independent host kit
        run: python3 tests/host_adapter/verify_package.py --work-directory build-host-package
      - name: Analyze independent host source
        run: clang++ --analyze -Xanalyzer -analyzer-output=text -std=c++20 -Wall -Wextra -Werror -Irt/include -Icore/include -Iinclude samples/host_adapter/main.cpp tests/host_adapter/test_host.cpp
      - name: Run README contributor build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=OFF -DSIM_WERROR=OFF
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          ./build/rtfw_runtime_demo --config configs/default_safe.json --run 20ms --rt --metrics-json-interval
      - name: Validate demo CLI
        run: |
          test "$(./build/rtfw_runtime_demo --version)" = "$(cat VERSION.txt)"
          if ./build/rtfw_runtime_demo --definitely-not-an-option; then
            echo "runtime demo accepted an unknown option" >&2
            exit 1
          fi
