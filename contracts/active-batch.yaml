acceptance:
- Preserve frozen M26-01 contract and all prior Runtime/native/kit/test/benchmark sources, ABI8/70 exports/fingerprint0xd0e7a5a14bf35f97/SONAME8/deviceABI1/schema7,
  budgets, default package isolation, support and release claims. New Python audit orchestration is off
  lane; no new native implementation or runtime policy.
- Publish readable living documentation mapped to actual source and artifacts for every frozen phase,
  resource, state/buffer, rate, channel, clock, execution/ownership boundary, control, fault/recovery,
  benchmark, lever and variant. Include lifecycle and external-process failure/retention, logical versus
  host/device clocks, staged transfers, deterministic simulated replay versus unavailable native replay,
  real/native prerequisites and exact expected results. Frozen planned labels are historical requirements,
  never current implementation status.
- Generate reproducible source-linked installed documentation with exact source hashes and valid file/fragment
  anchors. The default package ships the manual; optional benchmark-enabled installation supplies one
  command building and running CPU, simulated CUDA/XDMA/combined and actual external CIL through preserved
  public kits. Verify actual CPack relocation, removal of original prefix, paths with spaces, missing
  component/source/provenance and stale/mutated documentation negatives; no private include paths or source
  checkout dependency.
- Bind an exhaustive CAP-M15 through CAP-M26 audit to a byte-identical snapshot of canonical acceptance
  requirements and exact source/test/retained-evidence references. Account for every scenario, automated
  evidence item, manual gate and claim limit exactly once. Classify implemented portable evidence, remaining
  software/integration work, manual/physical/controlled-runner gates and residual findings separately.
  Do not infer acceptance from a label, omit known gaps, promote every capability from passing M26 checks,
  or claim only hardware remains when M20 release engineering or other work is still open.
- Execute fresh installed benchmark/fault/replay validation and a bounded repeatable soak across native/host
  CPU, CUDA kernel/Graph, XDMA and combined, with actual external controllers, repeated fresh-owner lifecycle,
  recovery/fault coverage and full-state/counter/cleanup validation. Declare cycle count and logical ticks
  separately from measured wall duration; retain every run, failed prefix, provenance and executable hash.
  No physical endurance or RT/performance claim. Independently reject omitted cycles, altered states/counters,
  stale source/binaries, false safety/replay, fabricated completion and erased failures.
- Reconcile current README, architecture/product/roadmap/handoff and installed manual navigation with
  merged evidence, retaining historical checkpoints. Publish a finite remaining-action list including
  M18 physical/RT, M19 Unreal, M20 controlled-performance/security/signing/exporter/platform/release work,
  M25 unfamiliar-consumer review and known protected fixture/replay findings as actually supported by
  the audit. M26 audit delivery and portable golden journey completion do not close those capabilities
  or authorize their implementation.
- Run generated-document/source/link/requirement audit and meaningful mutation tests, actual relocated
  package full prior SDK consumers, fresh replay/fault/soak workflow, contract/quick/full and all32 exact
  final-head hosted checks with exact predecessor names/multiplicity. New Python checks join existing
  allowed docs CI; existing native sanitizer/static gates remain mandatory without gratuitous duplicate
  native implementation. Preserve every failure and retry and never weaken earlier tests/deadlines.
- Complete scoped risk review, exact clean/head/base/no-unresolved-review and fetched tested-tree guards,
  target integration and canonical closure. Mark only evidence-backed M26 portable software/audit completion;
  report any discovered substantive golden user-journey gap and repair it only through separately bounded
  authorization. No release/deployment, hardware operation or support promotion.
validation:
  local:
  - python3 tools/generate_golden_audit.py --check
  - python3 tools/check_golden_audit.py
  - python3 -m unittest discover -s tests/golden_audit -p "test_*.py"
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - python3 tests/golden_audit/verify_package.py --work-directory build/m26-06-package
  - Fresh bounded installed showcase and multi-variant soak with exact command, counts, duration, hashes
    and result retained.
  focused_tests_to_add:
  - Missing/duplicate/foreign requirement, omitted source-map entry, stale source/anchor, invalid offline
    link and unjustified qualification/completion mutations.
  - Soak/run omission, altered source/binary/state/counters, corrupt manifest, missing package/components
    and original-prefix/private-path rejection.
  required_ci:
  - All32 exact final-head check records successful with exact M26-05 names/multiplicity.
  - Existing compiler/FMA/sanitizer/package/ABI and docs jobs plus new audit/docs/package checks; protected
    ci.yml unchanged.
  manual:
  - Independent unfamiliar-consumer review remains UNPERFORMED without an actual reviewer.
  - Named physical/RT/controlled-performance/Unreal/signing/release/deployment actions remain separately
    gated.
risk:
  class: high
  hazards:
  - Audit silently omits an unmet requirement or turns simulated evidence into qualification.
  - Generated source links or installed commands depend on stale/private checkout paths.
  - Soak hides failed cycles or only checks a PASS field instead of state, identity and cleanup.
  - Documentation changes reinterpret frozen behavior or erase protected fixture findings.
  stop_conditions:
  - A protected source/test/ABI/default/deadline needs repair outside this batch.
  - A substantive unresolved golden user-journey gap requires separately scoped implementation.
  - A material product decision, privileged hardware action, signing, release or deployment is required.
rollback:
  strategy: Revert only additive audit documentation/tooling/source-kit/tests and build/validation wiring;
    preserve all prior native and sample implementations, immutable requirements and evidence.
evidence:
  output:
  - docs/evidence/M26-06-<date>.md
  - Source/requirement maps, exact generated inventory, installed workflow/soak results with raw hashes,
    all failed attempts, risk review and exact-head local/CI/merge records.
  claim_boundary: Portable installed framework composition and evidence-backed audit only. CAP-M15 through
    CAP-M26 have separate scenario/manual qualification dispositions; unresolved engineering and review
    actions remain explicit. No physical/HIL/RT/human/controlled-performance/Unreal/release/deployment
    claim.
