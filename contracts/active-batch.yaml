acceptance:
- Retain exact ThreadSanitizer reproducer from preserved feature042bb7c and add an independent actual
  Runtime active-rate submission-failure/terminal-retirement regression in command-batch tests. Old source
  must reproduce the race under TSan; all original tests and failure/publication assertions stay intact.
- Fix only private DeviceManager batch ownership metadata accessed by service timeout observation and
  host retirement. Use race-free bounded ownership/atomic synchronization, preserve slot publication ordering,
  finite deadlines, status/timeline behavior, single terminal retirement and no-early-reuse. Audit related
  accesses and exact storage accounting. No mutexes, RT heap allocation, sleeps, deadline relaxation,
  public layouts or backend changes.
- Exercise repeated active submission rejection/throwing, successful dispatch and existing timeout/quarantine/late-completion/stop
  paths. Preserve all M24 CUDA cleanup repair sources/regressions and original tests, all207 benchmarks,
  C ABI v8/70 exports/fingerprint/SONAME8 and device ABIv1.
- Run focused command/rate tests, exact preserved feature suite against repaired Runtime, TSan and ASan/UBSan
  with leak scanning, no-allocation, strict portable/full/ABI/static, relocated original/source SDK and
  all32 exact-head hosted gates. Retain failures and distinguish portable from physical evidence.
- 'Integrate repair separately, then canonically reactivate M24-03 against its merged exact source and
  finish #265. M24-04 and wider/manual gates remain separate.'
validation:
  local:
  - git status --short --branch
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - python3 tests/cuda_physics/verify_package.py --work-directory build/m24-repair-package
  - python3 tools/check_c_abi.py --library build/m24-pipeline/librtfw.so
  - git diff --check
  focused_tests_to_add:
  - Repeated actual active Runtime submission failures versus service timeout scan and terminal release,
    with exact status/no-publication/resource assertions.
  - Old-source TSan negative control and unchanged preserved M24-03 suite passing after repair.
  required_ci:
  - All prior 32 exact-head hosted checks, with additive portable sample/tests in existing compiler/FMA/MSVC,
    sanitizer, static and package jobs.
  - Optional CUDA toolkit compile/link and reproducible kernel compilation; no GPU required or physical
    evidence inferred.
  - Original ABI, release, no-allocation, package, benchmark and determinism-artifact gates remain unchanged.
  manual:
  - Independent ownership/arithmetic/graph/rate review remains unperformed unless actually obtained; agent
    self-review is labelled.
  - Physical CUDA requires an accessible named device tuple; absence remains NOT RUN and does not block
    portable software.
risk:
  class: high
  hazards:
  - Speculative service reads race with host retirement or slot reuse.
  - An atomic fix hides an ownership or deadline regression.
  - False sanitizer closure from suppressions or changing the fault schedule.
  stop_conditions:
  - Canonical planning contract is not integrated before activation, or target baseline moves without
    reconciliation.
  - Public ABI, CUDA backend, host runtime or another forbidden path needs a change; retain evidence and
    plan separately.
  - Success requires weakened tests, invented resource observations, unbounded waits, unsafe cleanup or
    absent hardware evidence.
  - New physical/controlled/signing/release/deployment authority or a substantive product decision would
    be required.
rollback:
  strategy: Revert only the isolated private DeviceManager race repair and regression; preserve all failures
    and feature draft. Do not claim old race safe.
evidence:
  output:
  - docs/evidence/M24-03R-<date>.md
  - Exact canonical/source/tree, old-order negative control, full local and exact-head hosted results
    with failures retained.
  claim_boundary: Bounded validation-model and portable injected-driver software evidence. No general
    physics engine, CAP-M24 closure, real CUDA support/RT qualification, controlled performance, Unreal,
    cybersecurity, Daybreak, signing, release or deployment claim.
