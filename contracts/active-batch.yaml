acceptance:
- Inventory already-covered platforms and migrations and add only missing supported-version/package/API
  paths with retained exact consumer inputs and observable outcomes.
- Run bounded fixed ordinary portable lifecycle/replay/expected-refusal/owner-isolation repetitions with
  complete logs, interruption/failure journals and resource conservation observations; distinguish logical
  workload from measured wall duration. No generated-input campaign, deliberate crash/memory-error fixture,
  scanner, workflow or continuous schedule.
- Produce release-readiness evidence and finite remaining gate list, without interpreting portable soak
  as physical endurance, controlled performance, RT, independent human acceptance, release approval or
  deployment.
- Preserve prior completed batches/evidence and protected ABI/default/support claims. Run complete repository
  contract/quick/full plus all32 exact final-head hosted records with exact baseline names/multiplicity;
  retain failed attempts and risk review. Guard clean/head/base/review/merge-tree equality before scoped
  integration and canonical closure.
- tests/CMakeLists.txt changes are additive new-test wiring only; preserve every existing test/assertion/deadline.
  Package migration uses the current actual SDK and documented same-major discovery/compatibility surfaces,
  never fabricated historical binaries or new supported tuples.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - Focused entry-point positive/negative tests, independently failing baseline control, applicable sanitizer/static/no-allocation/default-byte/ABI
    and actual installed package validation.
  - git diff --check
  focused_tests_to_add:
  - Inventory already-covered platforms and migrations and add only missing supported-version/package/API
    paths with retained exact consumer inputs and observable outcomes.
  - Run bounded fixed ordinary portable lifecycle/replay/expected-refusal/owner-isolation repetitions
    with complete logs, interruption/failure journals and resource conservation observations; distinguish
    logical workload from measured wall duration. No generated-input campaign, deliberate crash/memory-error
    fixture, scanner, workflow or continuous schedule.
  - Produce release-readiness evidence and finite remaining gate list, without interpreting portable soak
    as physical endurance, controlled performance, RT, independent human acceptance, release approval
    or deployment.
  required_ci:
  - All32 exact final-head target checks successful with exact M26-06 names/multiplicity. No target/local
    gate waived.
  manual:
  - No physical/HIL/RT/human/controlled-performance/Unreal/production-signing/release/deployment claim
    from portable software tests.
risk:
  class: high
  hazards:
  - Software evidence is promoted to qualification or an unresolved finding is silently closed.
  - A repair weakens compatibility, deadlines, bounds, prior tests or evidence.
  stop_conditions:
  - A new public ABI/schema/default-policy decision or forbidden source change becomes necessary.
  - Required hardware, real engine environment, production key or release/deployment authority is missing
    for the claimed outcome.
rollback:
