acceptance:
- Preserve the exact 87 Runtime cases, 51 CPU cases, framework self case, original workloads/counters/assertions
  and all merged replay/watchdog/wakeup repairs. Add one separately owned rtfw.device provider with at
  most 96 finite descriptors, at most 8 parameters and 16 independently meaningful counters per descriptor,
  within the unchanged 256-case registry bound. Discovery/describe perform no device access, allocation
  of device resources, hidden benchmark execution or hardware enumeration.
- Use only installed public Runtime, device ABI v1, HAL v2, CudaDeviceBackend and XdmaDeviceBackend surfaces.
  Injectable fake driver tables must exercise the actual existing candidates and real buffer bytes, not
  replacement toy schedulers or fabricated completion counters. Preserve native v2 and legacy v1 paths.
  Reusable benchmark fixtures are optional installed source examples, not additional default SDK targets/headers.
- 'Separate prepare, measured invoke and checked finish. State exact timing scope: submit-only excludes
  completion drain from its timer only if actually outside invoke; submit-plus-poll-plus-validation is
  labeled complete transaction. Lifecycle/fault/recovery descriptors include all reconstruction and allocation
  occurring in invoke. Warmup and measured ordinals remain legal, disjoint and independently counted.
  No unmeasured work is subtracted from wall-clock samples.'
- Cover HAL metadata/capability inspection and native/adapted registration, submission, empty/not-ready
  poll, completed poll, exact ticket/timeline retirement and configured queue depth 1 and 4. Prove actual
  full configured occupancy before reject-next and recovery, rather than labeling sequential submissions
  as depth four. Validate malformed/stale/foreign inputs without changing retained payload or ownership.
- CUDA portable cases cover H2D, D2H, D2D, memset, kernel launch and caller-instantiated Graph dispatch
  at 64-byte and 4096-byte payload points, single and multiple commands/transactions. Check exact driver
  calls, transferred bytes, independent elementwise output oracle, event/timeline identity, no premature
  host consumption, and configured queue saturation. Kernel/Graph callbacks implement the same bounded
  integer transform and must agree on output; native graph commands use stable graph IDs and retained
  declared buffer bindings.
- CUDA failure cases cover not-ready completion, submission/launch failure, timeout, lost context and
  cleanup retry under deterministic scripted fake-driver outcomes. Confirm completed/failed/rejected are
  distinct, failed work cannot count as successful copy/transform, and all possibly live resources remain
  owned until checked shutdown. Do not inject destructive failures into real hardware.
- XDMA portable cases cover H2C/C2H at 64-byte and 4096-byte payload points, channel and offset range
  checks, fixed I/O worker ownership, control write/read round trips and user-event success/timeout/cancellation.
  Use declared bounded local fake card memory and independently checked transfer/control/event payloads.
  Observe real asynchronous worker completions, not assumed acceptance counts; use bounded waits and retain
  buffers until joined cleanup.
- XDMA capacity/fault cases cover queue depths 1 and 4, reject-next with full occupancy, short transfer,
  I/O failure, device loss/reset-required, event timeout, stop cancellation and retryable shutdown. Fake
  drivers coordinate deterministically without sleep-dependent correctness, unbounded spin or deadlocking
  cleanup. Optional event/control cases require the exact v2 callbacks and declared aperture; never guess
  a physical FPGA register map.
- Host staging cases copy between disjoint CUDA-facing and XDMA-facing host spans at the two payload sizes,
  observe actual bytes/copies and enforce ordering. Add full CPU -> actual CUDA candidate -> explicit
  host staging -> actual XDMA candidate -> CPU Runtime pipelines, with exact independent end-to-end integer
  oracle, kernel and graph variants, multiple frame/repetition points, plus failure/nonpublication and
  concurrent independent owners. Preserve backend-local timeline identities and never imply direct peer
  DMA.
- Keep callbacks, submission/poll and declared steady Runtime invokes bounded and allocation-free after
  preparation. Bound fixtures to at most 4 Runtime CPU workers, 2 XDMA I/O workers per backend, one CUDA
  and one XDMA backend per pipeline, 512 MiB total declared Runtime budget, 16 MiB retained fixture storage
  and 65536 operations per invoke. Verify maximum configured occupancy separately from absolute constant/configuration
  rejection. Avoid large caller-stack fixture objects and retain the 512 KiB stack regressions from M23-03.
- Provide functional optional real-device paths through the existing CUDA Driver API and Linux XDMA adapters,
  with explicit caller-owned context/stream/module/kernel/graph and confirmed endpoint/aperture/event
  configuration. Real benchmark mode cannot silently use fake tables or fall back to another host. Real
  resources are created and destroyed on the host path outside steady timing and remain alive through
  checked drain/shutdown. Add compiled host examples for CUDA, XDMA and composed use.
- Default CLI hardware descriptors return unchanged Status::not_run before any warmup or measured samples
  when a real session is absent. Missing build adapters, device/context, confirmed memory aperture, event
  source or declared graph/kernel resources are prerequisites, not a success or empty timing measurement.
  Invalid supplied configuration and runtime/device failures are errors, not NOT RUN. No probing/opening/writing
  device nodes in list/describe or portable mode; real execution is explicitly opted in.
- Use unchanged version-1 artifact schemas and validator. Fake clocks yield structural_fixture; steady
  clocks retain portable_characterization and cannot claim controlled or physical qualification. Distinguish
  fake-protocol from real backend implementation in descriptor/configuration and actual backend/driver
  Identity fields. Never invent CPU/device counters or disclose pointers, resource handles, absolute paths,
  environment values or device serial identifiers. Retain measured raw samples and actual not-run artifacts;
  no successful summary without successful checked cleanup.
- Exercise a genuine real-session provider with injected deterministic driver tables in tests to prove
  it invokes supplied resources, validates outputs and settles ownership; label that result simulated,
  not physical. Compile real adapter examples in existing optional toolkit/node-free package CI. Actual
  bench runs, if available, require exact named host/driver/device/bitstream and retained commands/results;
  absent hardware does not block software implementation, but does block physical characterization.
- Installed-source, archive-relocated, non-default-prefix and add-subdirectory consumers use only public
  targets and the new optional source ledger. Add a device wrapper that invokes the unchanged Runtime
  wrapper, which preserves CPU and original wrappers. Keep default install target/header inventory unchanged.
  Update exact optional release digests for every installed new source without relaxing prior ledgers.
- Extend CLI discovery assertions to the exact four-provider inventory without deleting any prior cases
  or validation. Run every portable descriptor through normal CLI plus unchanged offline validator; every
  unavailable real descriptor must produce a valid zero-sample NOT RUN artifact and exit 3. Test warmup/measured
  conservation, invalid preparation, repeated runs, concurrent owner isolation, missing resources, failure
  output suppression and cleanup error handling.
- Retain all existing GCC/Clang Debug/RelWithDebInfo/FMA, MSVC, ASan/UBSan, TSan, portable static, package,
  ABI/no-allocation and deterministic exchange gates. Add all new provider TUs to optional static analysis,
  device tests to focused sanitizer filters, and one deterministic fake-driver canonical bundle to the
  existing GCC/Clang/FMA/MSVC artifact exchange. Never compare nondeterministic polling/worker scheduling
  counts for byte identity or normalize them to fabricated constants.
- Record acceptance-to-case/test coverage, source/control identities, actual local/hosted results and
  independent review status. Preserve all prior failures. M23-04 software completion requires working
  optional real-session paths, not placeholder-only NOT RUN methods. M23/CAP-M23 remain incomplete until
  M23-05; no M24/M25/M26 implementation, Unreal, cybersecurity, Daybreak, support promotion, signing,
  release, deployment or threshold policy belongs to this batch.
validation:
  local:
  - git status --short --branch
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - cmake -S . -B build/m23-device -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=OFF
    -DRTFW_BUILD_BENCHMARKS=ON -DSIM_SANITIZERS= -DSIM_WERROR=ON
  - cmake --build build/m23-device --parallel 2
  - ctest --test-dir build/m23-device --output-on-failure
  - python3 tests/benchmark_fixtures/test_device_cases.py --cli build/m23-device/bench/rtfw-bench --inventory
    bench/fixtures/device_cases.json
  - python3 tests/benchmark_fixtures/device_consumer/verify_package.py --work-directory build/m23-device-package
  - ./scripts/agent-verify.sh full
  - python3 tools/check_c_abi.py --library build/m23-device/librtfw.so
  - git diff --check
  focused_tests_to_add:
  - Actual CUDA/XDMA candidates with independent payload/event/timeline oracles, full occupancy/reject/recovery
    and bounded fault/lifetime handling.
  - Real-session supplied-driver execution and explicit missing-prerequisite NOT RUN versus invalid/runtime
    error distinction.
  - All finite CLI/artifact cases; unchanged self/CPU/Runtime cases; warmup/measured conservation; repeated
    independent instances and TSan.
  - Allocation-free declared steady invokes, 512 KiB caller-stack coverage, optional installed/embedded
    source and exact digest/package checks.
  - Backend implementation identity, canonical fake-driver artifacts, no private imports or hardware probing
    in metadata-only discovery.
  required_ci:
  - All unchanged required 32-check predecessor surface, with additive device cases in compiler/FMA/MSVC,
    ASan/UBSan, TSan and optional static gates.
  - Optional toolkit and node-free XDMA compile/link checks include real-device host examples; missing
    physical devices remain NOT RUN, not a waived functional test.
  - Seven-way GCC/Clang/FMA and installed MSVC deterministic device artifact comparison, plus retained
    prior exchanges.
  - Default/optional package isolation and relocated consumers, exact C ABI v8/70 exports/fingerprint/SONAME8
    and release ledgers.
  manual:
  - Review ownership, timing scopes, observed counters and physical claim boundaries. Agent review is
    not independent human review.
  - Physical characterization requires actual accessible named hardware; retain NOT RUN without claiming
    completion of M18 or controlled timing.
risk:
  class: high
  hazards:
  - Fake-driver results mislabeled physical throughput or accepted work mislabeled successful transfers.
  - Asynchronous resources freed before completion/drain, mutable borrowed buffers or retryable cleanup
    discarded.
  - Queue depth inferred from sequential operations; polling/scheduling nondeterminism hidden to obtain
    canonical bytes.
  - Real XDMA operation performed against an unknown bitstream/aperture or device probing during discovery.
  - Optional toolkit/backend dependencies leak into default Runtime/SDK; original gates or failed evidence
    erased.
  stop_conditions:
  - A public Runtime, backend, driver, ABI, framework/schema/validator or other forbidden-path change
    is needed; retain reproducer and open a separate repair contract.
  - Physical execution lacks explicit device ownership, known safe memory/control aperture or confirmed
    hardware/driver identity; do not execute it.
  - A required success needs weakened assertions/timeouts, fabricated observations, privileged host changes,
    unbounded waiting or unsafe teardown.
  - Target main moves without reconciliation, or canonical contract is not integrated before target activation.
rollback:
  strategy: Revert the isolated device provider, optional real-device host examples and their CLI/package/test/documentation
    integration as one batch. Preserve all prior providers, merged Runtime repairs, ABIs and schemas.
evidence:
  output:
  - docs/evidence/M23-04-<date>.md
  - Finite catalog and acceptance mapping, independently observed counters and configured/executed capacities.
  - Exact target/control baseline/head/tree/PR identities; passed/failed/blocked/unperformed commands
    and check IDs; package and canonical artifacts.
  - Verified recovery Git bundle and baseline-relative patch; actual accessible-hardware prerequisites
    and NOT RUN records.
  claim_boundary: Portable fake-driver and supplied-session software evidence only unless a named accessible
    bench actually runs. No physical/RT qualification, support promotion, thresholds, M23/CAP-M23 completion,
    cybersecurity, Daybreak, Unreal, signing, release or deployment.
