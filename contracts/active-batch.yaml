acceptance:
- Add optional public header rt/sdk.hpp using only public headers and standard C++20. Typed callback trampolines
  require noexcept and exact CallbackResult at compile time, borrow named lvalue state and support no
  hidden captures, allocation or global registry. Existing raw API remains usable unchanged.
- Provide explicit config and graph builders delegating validation and finalization to the raw Runtime
  and returning its exact statuses. Expose ordinary RuntimeConfig and handles, do not auto-start, silently
  resize, swallow failures or imply multi-operation rollback. Failed declarations and finalization remain
  inspectable and repairable according to raw semantics. Verify raw-versus-helper compiled graph and memory-plan
  parity.
- Provide checked capacity arithmetic for aligned phase/task scratch and native executor queue slots with
  overflow and invalid-input detection; make partial estimates distinct from the authoritative finalized
  MemoryPlan and explicitly reject unsupported host-adapter estimates. Preserve raw limits and statuses
  through Runtime validation.
- Provide non-owning noncopyable checked-stop guard with explicit status-returning close, retained arming
  on cleanup failure and bounded fail-closed destructor behavior. Runtime and borrowed callback/backend/provider
  state must outlive guard. Verify successful fallback, explicit close, cleanup failure/retry and destructor
  failure in an isolated process; never silently release failed ownership or loop indefinitely.
- Provide fixed caller-buffer diagnostic rendering of operation, raw status, Runtime detail and actionable
  recovery advice. Report required extent and truncation deterministically, including empty/tiny buffers
  and unknown statuses. No heap, exceptions or I/O in helpers or callbacks; diagnostics do not imply retry
  is always safe.
- Ship a complete typed graph source kit and ownership/capacity/error guide. Compile/run root and installed
  find_package consumers plus add_subdirectory embedding. Exercise relocated archive with removed original
  prefix, custom paths with spaces and exact additive SDK header/source inventory. Preserve all raw C/C++
  consumers and hello unchanged.
- Add focused real Runtime parity, invalid config/handles/cycles/conflicts/capacity, failure recovery,
  multiple-instance isolation, compile-time callback constraints and steady-state allocation tests. Run
  strict full suites, ASan/UBSan/leaks, TSan, ABI and static analysis. Additive package/docs CI coverage
  must retain all32 exact-head check records.
- Preserve all compiled production sources, ABI v8/70 exports/fingerprint, SONAME8, device ABIv1, release1.2.1
  portableRT0 and dependency boundaries. Extend exact SDK header inventory only for sdk.hpp. Revalidate
  existing CUDA source/package gates and add truthful new evidence/source bindings for the additive header/package-contract
  change; retain all prior M24 evidence, rows, criticality, thresholds, source hashes and physical NOT
  RUN states without weakening its checker.
- Record canonical revision/blob, baseline, acceptance mapping, commands/results, retained failures, self-review,
  rollback and residual gates. Integrate only M25-02 after required checks; backend/CIL/host/full docs,
  independent novice review, hardware/RT/performance/Unreal/release remain separate.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh full
  - python3 tests/typed_runtime/verify_package.py --work-directory build/m25-02-package
  - python3 tests/cuda_physics/verify_package.py --work-directory build/m25-02-cuda-package
  - python3 tools/check_c_abi.py --library build/agent-quick/librtfw.so
  - Local focused ASan/UBSan with leak detection, TSan and Clang14 static analysis.
  - python3 tools/check_cuda_capabilities.py
  - git diff --check
  focused_tests_to_add:
  - Raw/helper graph and memory-plan parity; exact status parity, compile-time noexcept constraints, overflow
    and boundary capacities.
  - Real lifecycle close/fallback, failed cleanup/retry and isolated fail-closed destructor; no steady-state
    allocations and isolated concurrent Runtime instances.
  - Fixed diagnostic rendering and truncation; installed-only archive relocation, embedding, exact inventory
    and negative controls.
  required_ci:
  - All32 existing exact-head target check records with unchanged name/multiplicity inventory, no failing
    gate or unresolved review thread.
  - Existing compiler/FMA/MSVC/ASan, static, package and docs gates gain optional helper coverage without
    removing prior checks.
  manual:
  - Independent first-use walkthrough by an unfamiliar human remains UNPERFORMED.
  - No hardware, RT1/RT2, controlled performance, Unreal, signing/release/deployment qualification.
risk:
  class: moderate
  hazards:
  - Borrowed typed state or Runtime outlives its owner; destructor hides failed cleanup.
  - Convenience defaults silently alter raw configuration, capacity, statuses or graph identity.
  - Capacity estimate masquerades as full memory accounting; header/package bindings obscure historical
    evidence.
  stop_conditions:
  - A production or forbidden path change is needed; retain reproducer and plan a separate repair.
  - A mandatory test would need weakening or canonical planning has not integrated.
rollback:
  strategy: Revert additive SDK header, sample, tests, docs and inventory additions; restore previous
    package and capability bindings without modifying protected production implementation or historical
    evidence.
evidence:
  output:
  - docs/evidence/M25-02-<date>.md
  - Exact canonical/head/tree/check identities, package and compatibility evidence, retained failures
    and negative controls.
  claim_boundary: Portable optional C++ SDK only. No M25 milestone closure, independent novice review,
    hardware/RT, controlled performance, Unreal or signing/release/deployment claim.
