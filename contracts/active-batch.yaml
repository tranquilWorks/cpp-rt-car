acceptance:
- Generate deterministic source-linked API reference from an explicit exact default installed-header inventory
  plus clearly identified optional CUDA/XDMA/benchmark headers. Include readable declaration/comment source,
  stable checked line anchors and a navigable entry-point/type index. Validate missing/ambiguous symbols,
  stale content, version/header-byte drift and broken local links/fragments. Do not alter production headers
  or claim a parser understands semantic constructs it does not support. Regeneration is a developer-only
  standard-library tool; consuming the default SDK must not acquire a documentation-generator dependency.
- Ship an offline documentation entry point and relevant README/build, lifecycle/ownership/capacity, multi-rate/sampled-I/O,
  live control, backend, CUDA, XDMA, external CIL/HIL, benchmark, checkpoint/replay, error, migration
  and claim-boundary guides. Link recipes to exact shipped source and API declarations. Reuse authoritative
  existing guides without editing earlier evidence or source kits; preserve navigable local links and
  explicitly identify repository-only or optional hardware material. Package material must not depend
  on the original checkout/prefix for ordinary reading or build.
- Ship compiling/running public-SDK recipes and exact command transcripts for raw C/C++, profile/lifecycle,
  active multi-rate and sampled-I/O, live control and trusted replay, backend/device surfaces and optional
  benchmark extension. Reuse unchanged existing public conformance/consumer sources where useful with
  complete support-source inventory; distinguish actual exercised scenarios from compile-only vendor boundaries.
  Preserve all independent state/count/status/cleanup and failed-evidence oracles. Connect earlier hello/typed/backend/CIL/host/CUDA
  installed source kits rather than duplicating or weakening them.
- Use machine-readable transcript/source inventories to bind documented commands to actual execution with
  explicit source, prefix, data and build paths. Run installed find_package and source embedding, tests-OFF
  SDK, custom include/data paths with spaces, original prefix removed and an actual CPack archive extracted
  elsewhere. Verify full public export/header inventory and complete prior consumers. Check exact documentation/generated-reference/source
  bytes and local links in the archive; reject missing docs/source, stale source links, changed expected
  results and private/original include leaks with negative controls.
- Run complete local profiles, documentation generator/link/transcript negative tests, installed/embedded
  recipe executions and prior complete SDK/CUDA consumers, compiled ABI and unchanged capability matrix
  plus all32 exact-head hosted target checks with predecessor name/multiplicity. Add docs/package coverage
  to existing gates without changing the main CI workflow or removing prior tests. Retain canonical/head/tree/check
  identities, acceptance mapping, failures/corrections, review/rollback and unperformed validation.
- Close M25-06 and all six M25 software batches only after integration. Keep the independent unfamiliar-consumer
  walkthrough explicitly UNPERFORMED, so software completion does not invent full human acceptance. M26
  golden-system composition/audit, Unreal, physical CUDA/XDMA/HIL, RT1/RT2, controlled performance and
  signing/release/deployment remain separate. Preserve ABI v8/SONAME8/device v1, production code, prior
  benchmark/CUDA/source/evidence and default target/header inventory.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh full
  - python3 tools/generate_sdk_docs.py --check
  - python3 tools/check_sdk_docs.py
  - python3 -m unittest discover -s tests/installed_docs -p "test_*.py"
  - python3 tests/installed_docs/verify_package.py --work-directory build/m25-06-package
  - python3 tests/cuda_physics/verify_package.py --work-directory build/m25-06-cuda-package
  - python3 tools/check_c_abi.py --library build/agent-quick/librtfw.so
  - python3 tools/check_cuda_capabilities.py
  - git diff --check
  focused_tests_to_add:
  - Generated reference/header/declaration/link integrity and truthful optional API inventory.
  - Executable installed and embedded recipe/transcript inventory with full prior consumers and actual
    CPack extraction.
  - Missing documentation/source, source/declaration drift, invalid links/fragments, changed expected
    results and private/original path negative controls.
  required_ci:
  - All32 existing exact-head successful target check records with predecessor names/multiplicity and
    no unresolved review thread.
  - Documentation contract adds deterministic generation, links and negative/CPack/recipe checks; existing
    package consumers gain additive recipe coverage without losing prior tests.
  manual:
  - Independent first-use walkthrough by an unfamiliar human remains UNPERFORMED.
  - No hardware, RT1/RT2, controlled performance, Unreal, signing/release/deployment qualification.
risk:
  class: moderate
  hazards:
  - Generated documentation appears authoritative while stale, incomplete, wrongly anchored or dependent
    on checkout paths.
  - Installed recipes lack support files, bypass real behavior or silently weaken cleanup/state oracles.
  - Software milestone closure is overstated as independent human, physical/RT or release acceptance.
  stop_conditions:
  - A production/forbidden-path repair or ABI/default public-inventory change is required.
  - A required gate or existing assertion would need weakening.
rollback:
  strategy: Revert only additive documentation generation, bundle/recipe sources, install and verification
    wiring. Preserve production, public SDK/ABI, all prior source kits and evidence.
evidence:
  output:
  - docs/evidence/M25-06-<date>.md
  - Exact generation/link/transcript/archive/recipe/full/hosted results, canonical/head/tree/merge identities
    and retained failures.
  claim_boundary: M25 portable software delivery only; human first-use acceptance and all physical/RT/performance/Unreal/release
    gates remain unperformed. No M26 activation.
