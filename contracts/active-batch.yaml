acceptance:
- 'Reproduce both original defects before repair: retain an unchanged-source direct loopback cancel/submit
  publication failure (including initialized TSan evidence) and an actual relocated full-SimCore consumer
  compile failure on the missing HAL header. Add deterministic scheduling controls without production
  test hooks and keep all existing tests/assertions/deadlines unchanged.'
- Repair private loopback slot ownership/publication across submit, poll and cancel. Cover accepted and
  in-progress submissions, published timeout slots, competing consumers, repeated cancellation, capacity/reuse,
  stop/shutdown/reset/restart and isolated instances. Cancellation/poll must never access unpublished
  or exclusively owned completion storage. Retain bounded nonblocking callbacks, no allocation after construction
  and checked lifecycle ownership; no broad Runtime or benchmark rewrite.
- Repair the optional full-SimCore installed header dependency using the narrow install/forward-header
  boundary. Build actual clean default and experimental CPack variants, delete original prefixes, relocate
  with spaces/custom install directories, and compile/run independent complete SimCore owners plus modern/legacy
  supported Runtime consumers. Preserve default SDK inventory, supported Runtime isolation and experimental
  support classification.
- Run baseline versus corrected controls, focused ordinary/ASan/UBSan/leaks/initialized TSan and Clang14
  analysis, no-allocation checks, complete existing relevant suites, exact-head full local and all32 original
  hosted names/multiplicity, actual installed package gates, risk review and guarded target/canonical
  integration. No functional gate waiver or instrumentation pre-main failure counted as a test pass.
- Preserve the immutable M28 ledger and historic evidence; add an evidence-bound M29 current disposition
  for the two repaired findings only after validation. Keep every other retained finding and external
  obligation explicit. M29-02/03 remain planned, not activated by01; final owner stage stays deferred.
- Before implementation bind the merged canonical revision/blob to the exact refreshed main baseline.
  For planned02/03 narrow cause-specific implementation paths at selection; planning alone activates neither.
  Preserve release1.2.1 portable RT0, stable C ABI8/70 exports/fingerprint/SONAME8, device ABI1, default
  policies, license, original tests/deadlines and all historical evidence.
- Refresh only the existing product_sources SHA256 entries for rt/src/loopback_backend.cpp and rt/include/rt/loopback_backend.hpp
  in docs/cuda_capabilities.json after the scoped repair. Preserve every source inventory identity, coverage
  row, gate, status, support tuple and qualification claim; this is a source binding refresh only.
validation:
