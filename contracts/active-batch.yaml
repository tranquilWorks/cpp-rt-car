acceptance:
- Add DeviceRateSimulationPolicy with a positive finite host_watchdog_ns bounded to60seconds, and an optional
  append-only simulation field on DeviceRatePhaseBinding and CompiledDeviceRatePhase. Absence retains
  existing semantics; present zero/excessive values are invalid. Copy and validate at bind/replace/finalize,
  expose the resolved policy, and reject opt-in for backends whose core capability deterministic_mock
  is zero. Do not change RuntimeConfig schema7, compiled C ABIv8/SONAME8/deviceABIv1 or native backend
  capabilities.
- Preserve exact existing graph/config/artifact identities when simulation policy is absent. For opted-in
  phases conditionally hash an explicit versioned marker and watchdog value in canonical phase order,
  so incompatible policy checkpoint/replay artifacts reject before mutation. Do not alter artifact wire
  schemas or reinterpret reserved fields. Account all added internal/compiled storage exactly through
  existing size-based memory ledgers; no extra ordinary allocations or threads in steady execution.
- Keep the active logical completion budget and provider command timeout unchanged, including admission
  and relative deadline clamping. Only opted-in Runtime device slots use the separately copied host watchdog
  for steady-clock liveness. On ordinary execution also enforce the Runtime logical deadline before terminal
  success/timeline or payload publication, using the borrowed injected clock; opt-in requires its now_ns
  to be bounded, monotonic and safe for concurrent lane reads. Backend timestamps remain in their declared
  domain and are never compared directly to uncorrelated Runtime time.
- Active replay retains recorded logical decisions and does not treat current wall/Runtime clock as replay
  input. The deterministic backend still receives the original bounded command timeout and must implement
  its simulator timing semantics. The independent finite host watchdog remains enforced during replay;
  stalls fail rather than being normalized to success. New policy identity is checked by existing artifact
  compatibility validation. Native CUDA cannot acquire simulation policy implicitly.
- Preserve stopped/submitted/quarantined ownership and no-early-publication behavior. Cover queued, submitting,
  submitted and early-completion slots under the opted-in watchdog; callback ownership is never reclaimed
  before terminal backend retirement. Bounded nonblocking HAL poll/cancel and checked shutdown remain
  required; the watchdog does not preempt arbitrary vendor code violating that contract. Logical deadline
  expiry or a not-ready backend with a frozen clock must fail with device_timeout and no output publication;
  accepted resources remain retained through cancel/reset/checked cleanup.
- 'Add independent controlled regressions without changing existing fixtures/assertions/deadlines: default
  path and old-code negative control time out across a controlled host delay longer than the logical budget;
  opt-in succeeds without logical advance under a finite host watchdog; logical advance expires; frozen-clock
  no-completion expires at the watchdog; late terminal completion cannot publish; queued/submission/early-completion
  ownership, reset/stop retry, independent owners, replay/foreign-policy rejection, capacity/accounting
  and zero steady allocations. Test malformed/zero/overflow policy, native rejection, replacement correction
  and frozen-state mutation rejection.'
- Provide an installed public-SDK consumer for additive API/default aggregate compatibility and configuration
  rejection/inspection. Regenerate source-linked SDK documentation and ledger rather than hand-edit generated
  copies. Preserve all existing test sources, samples, frozen golden contract and native backends. New
  tests must run via existing CommandBatch/RateDispatch/MixedRateReplay filters in full/compiler/FMA/sanitizer
  gates without modifying protected CI.
- Run focused tests and old-path negative control, contract/quick/full, ASan/UBSan/leaks, TSan, Clang
  static, relocated full SDK and ABI/default-v1 checks. All32 exact-head target checks must succeed with
  exact predecessor names/multiplicity. Perform risk review, exact-head/base/clean/no-unresolved-thread
  guards and fetched-merge-tree equality. Integrate repair separately, then amend canonical M26-03 and
  reconcile preserved draft277 before opting in its simulator. Do not close M26-03 or activate later batches
  in the repair closure.
- Refresh only product_sources hashes in docs/cuda_capabilities.json for changed current Runtime implementation
  files after all required preserved suites pass. Preserve every capability row, gate/source/evidence
  binding, denominator, native capability and historical M24 evidence byte. The retained matrix is not
  new simulator timing or physical qualification evidence. No checker or prior test modification is authorized.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - Focused CommandBatch.Simulation* and MixedRateReplay.Simulation* checks, old-path negative control,
    allocation/concurrency, ASan/UBSan/leaks and TSan.
  - Clang static analysis, generated SDK/docs/release/ABI/default artifact compatibility and relocated
    full installed SDK consumer checks.
  - git diff --check
  focused_tests_to_add:
  - Opt-in logical time versus finite wall watchdog, ordinary and replay, no early publication and retained
    ownership.
  - Default/native policy rejection and unchanged identity, malformed/replacement/frozen configuration
    and policy-bound artifacts.
  - Independent owners, exact memory/accounting, no allocations, installed public consumer and deterministic
    controlled old-path failure.
  required_ci:
  - All32 exact-head records successful with exact M26-02 check names and multiplicity; no target gate
    exceptions.
  - New focused cases included through existing mandatory compiler/sanitizer/package filters; protected
    workflows remain unchanged.
  manual:
  - No physical CUDA/XDMA/RT/human/Unreal/performance/release/signing/deployment claim.
risk:
  class: high
  hazards:
  - Opt-in simulator policy leaks into native/default deadline enforcement.
  - Cross-domain timestamp comparison or stale replay clock makes outcome nondeterministic.
  - Completion race publishes timed-out output or releases vendor-owned storage early.
  - New policy omitted from identity or changes default artifact bytes.
  - Memory ledger or installed SDK reference does not match added structures.
  stop_conditions:
  - C ABI/SONAME/device ABI versioning, default deadline weakening or artifact schema change becomes necessary.
  - Any existing assertion, timeout or mandatory target gate would need waiver.
  - New hardware/privileged/signing/release authority or unrelated product decision is required.
rollback:
  strategy: Revert only the new simulator policy, internal enforcement, tests/consumer/docs and canonical
    activation; retain feature draft277 and all failed evidence. Existing callers without opt-in remain
    on unchanged default/native semantics.
evidence:
  output:
  - docs/evidence/M26-03R-<date>.md
  - Exact positive/negative/old-path, default identity, numerical/replay/ownership/allocation/sanitizer/package/ABI
    commands and results, head/tree/check/merge identities and retained failures.
  claim_boundary: Portable deterministic simulator timing policy only. No physical CUDA determinism, timing
    qualification, M26-03 feature closure, CAP-M26 closure or later-batch activation.
