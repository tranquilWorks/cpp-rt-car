acceptance:
- Honor the 2026-10-06 owner narrowing. Generated-input discovery/corpus/seed/crash replay/minimization,
  seeded-defect demonstration, continuous campaign/scanner automation and expanded throwaway signature/provenance
  fixtures are not performed and remain explicitly unsatisfied under their original finding and requirement
  identities. Preserve unfinished draft artifacts outside the delivery. Existing baseline deterministic
  checks remain unchanged.
- Rerun final exact-source clean default/applicable optional CPack and complete relocated consumers; both
  4096-cycle modern/legacy fixed portable soaks; two actual independent unsigned package builds; supported-platform
  evidence; all original 32 hosted names/multiplicity, full local and applicable instrumentation/static/ABI/no-allocation
  gates. Retain every failure and guarded merge/closure receipt. Add no campaign gate or workflow.
- Produce the current acceptance/finding overlay, artifact/evidence index, rollback and ordered original-card
  owner handoff. Preserve all 112 requirements, 30 findings and 13 cards and immutable M28/M29-02 records.
  Explicitly retain cyber-related obligations as excluded_by_owner_unsatisfied, never passed, waived or
  moved into completed owner acceptance. software_complete and CAP-M20_complete remain false. Scoped non-cyber
  story delivery may complete independently of these unsatisfied criteria.
- Bind the amended canonical revision/blob to the exact refreshed main baseline before final validation.
  Preserve release 1.2.1 portable RT0, stable C ABI v8/70 exports/fingerprint/SONAME8, device ABI1, policies,
  license, original tests/deadlines and historical evidence. No Runtime implementation changes.
- Use only a separately validated final overlay and minimal additive test wiring. Preserve all predecessor
  tooling and tests. Actual hardware/RT/endurance, licensed Unreal, controlled performance, independent
  human review, production signing/release/deployment remain deferred under existing card identities.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - git diff --check
  focused_tests_to_add:
  - Validate preserved identities, explicit owner-excluded unsatisfied dispositions, retained claims and
    requirement mappings; reject omitted identities, false completion or silently transferred exclusions.
  required_ci:
  - All 32 original exact-head hosted names/multiplicity successful; full canonical control validation;
    no added cyber campaign gate.
  manual:
  - None in these software batches; final actual owner-stage hardware/engine/human/performance/production
    acceptance remains deferred.
risk:
  class: high
  hazards:
  - Ownership repair introduces a publication/reuse race or weakens bounded execution.
  - A retry, limitation, test identity or software pass is misrepresented as global completion/qualification.
  stop_conditions:
  - A new public ABI/schema/default decision or forbidden path is necessary; narrow/amend canonical scope
    before that change.
  - Only external hardware, licensed engine, independent human or production authority can substantiate
    a claim; retain it as final-stage acceptance.
rollback:
  strategy: Revert only this batch changes and additive wiring; preserve all previous repairs, original
    assertions, failures and exact receipts.
evidence:
  output:
  - docs/evidence/M29-03-<date>.md
  - Baseline/corrected source hashes, raw commands/results, instrumentation status, packages, risk, exact-head
    CI and guarded closure receipts.
  claim_boundary: Scoped non-cyber portable story delivery only. Cyber campaign/signature acceptance remains
    unsatisfied. software_complete and CAP-M20_complete remain false; no physical/RT/engine/human/controlled-performance/production
    authenticity/release/deployment claim.
