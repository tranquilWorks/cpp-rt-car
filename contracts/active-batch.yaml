acceptance:
- Activate only after owner approval of this exact format/privacy/compatibility decision and canonical integration.
  Record exact repair/main baselines. This proposal alone does not authorize Runtime, public-header or serializer
  edits.
- Preserve existing C ABI v8, 70 exports/fingerprint/SONAME 8, device ABI v1, extension ABI v1, existing C++
  structure layouts and format-v1 constants. Introduce a distinct additive opt-in C++ retention policy with
  frozen capacities and identity; legacy default configuration and format-v1 bytes remain unchanged.
- 'Define format v2 as a separate versioned trusted replay artifact. Retain a complete bounded admission journal:
  canonical owner/sequence/target identity, admission outcome, whether an owner counter changed, assigned
  slot identity when applicable, original record metadata/alignment and payload bytes needed by every accepted,
  replaced, rolled-back, missed or stopped record. Capture input before overwrite; never derive bytes from
  a digest.'
- Record enough admission ordering and slot ownership to reconstruct future-target admissions, simultaneous
  producer histories, slot reuse, terminal records and exact final mailbox/generation/producer counters. A
  rejected or stale handle that did not affect a mailbox must not increment one in replay. No guessed association
  or counter based on unrelated expected final hashes is permitted.
- Bound retention at finalization and account for all Runtime-owned storage in MemoryPlan. Preserve callback
  allocation/thread/blocking rules. Mark retention exhaustion or lost history explicitly replay-ineligible;
  cannot silently emit a successful incomplete v2 artifact. Multiple runtimes and concurrent producer ownership
  remain isolated.
- Keep default telemetry payload-free. Additional non-survivor payloads appear only in the explicitly opted-in
  trusted replay journal. Document this data-retention change and checked teardown, redaction/export responsibility
  and exact size ceilings.
- Parse and validate complete v2 topology, counts, offsets, arithmetic, checksums, ownership, ordered history,
  nested checkpoint binding and payload digests before restore. Retain compatible v1 reading; do not claim
  recovery of missing historical v1 information. Explicitly report unsupported incomplete histories instead
  of inventing data.
- Replay records through bounded private reconstruction and normal settlement so complete canonical state,
  generations and action identities compare exactly. Retain final state and transcript validation. Never mask
  application/backend side effects or qualify hardware from replay.
- Convert both public --replaced/--rejected reproducers to successful v2 round trips. Cover two/eight frames,
  host/compiled-rate targets, multiple mailboxes/producers, replacement with nonzero unequal payloads, invalid/full/stale/busy/missed/stopped
  outcomes where recorded, admission-before-checkpoint, admissions for future boundaries, reclamation, rollback,
  repeated/concurrent instances and malformed/foreign/truncated input nonmutation. Keep explicit tests for
  incomplete old v1 histories.
- Rerun all 78 unchanged M23-03 benchmark cases against integrated repairs, with the composition fixtures
  explicitly selecting v2 only under a separately amended M23-03 contract. Preserve all failures; no family
  may be dropped. Finish remaining benchmark acceptance before closing M23-03 or advancing dependent scopes.
- Run local focused/full/package/no-allocation and available sanitizer gates, C ABI/SONAME/header-layout/default-artifact
  compatibility and exact path review. Retain actual unperformed hosted/human/hardware results; the existing
  utilization waiver does not waive local functional failures.
- Update current state, handoff, format documentation, exact source/digest ledgers and evidence. No support
  promotion, Unreal, physical-HIL/RT claim, signing, release, deployment, secrets or settings changes.
validation:
  local:
  - git status --short --branch
  - git rev-parse HEAD
  - ./scripts/agent-verify.sh contract
  - cmake -S . -B build/m23-replay-repair -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo
    -DSIM_SANITIZERS= -DSIM_WERROR=ON
  - cmake --build build/m23-replay-repair --parallel 2
  - ctest --test-dir build/m23-replay-repair --output-on-failure
  - ./scripts/agent-verify.sh full
  - python3 tools/check_c_abi.py --library build/m23-replay-repair/librtfw.so
  - git diff --check
  focused_tests_to_add:
  - Both retained public failing histories become successful v2 round trips with independent full state/counter/payload/action
    observations.
  - Default format-v1 golden bytes and existing public structure sizes remain unchanged; compatible v1 replay
    remains supported, incomplete v1 history is never invented.
  - Malformed/v2 missing journal, slot collisions, counter attribution, concurrent producers, future-target
    ordering, retention exhaustion and payload-loss tests reject before mutation.
  - All existing regression/package/ABI gates plus v2 no-allocation and sanitizer isolation.
  required_ci:
  - Existing GCC11/Clang14 Debug/RelWithDebInfo ASan+UBSan, Windows MSVC, GCC TSan, deterministic compiler/FMA,
    package/ABI/export/SONAME and portable-assurance gates, plus the new regressions.
  - Temporarily unavailable hosted runs remain failed/unperformed under the explicit 2026-09-08 owner waiver;
    all local functional gates remain required.
  manual:
  - Owner approval of versioned trusted artifact evolution and non-survivor payload retention before activation.
  - Independent format/privacy/compatibility review status must be explicit; implementation-agent checks are
    not a human review.
risk:
  class: high
  hazards:
  - Bypassing final semantic state comparison hides a replay divergence.
  - Repairing only application state leaves admission, generation or action bookkeeping inconsistent.
  - Nested restore retires handles or frees borrowed state while a replay/backend still owns it.
  - A benchmark workaround or schema change conceals the public Runtime defect.
  stop_conditions:
  - Owner format/privacy decision or exact canonical activation is absent.
  - Default v1 bytes, stable C/device/extension ABI, existing C++ struct layouts, final-state/transcript checks
    or unrelated scope would change.
  - Faithful journal reconstruction cannot be bounded or v2 history is insufficient.
  - Hardware access, production or release/signing authorization is required for the claimed result.
rollback:
  strategy: Revert opt-in v2 as one scoped change while retaining the independently verified M23-03R selection/bounds
    repair and unchanged v1 support. Keep prior failures and no successful claim for incomplete histories.
  data_migration: None. V1 remains readable where complete; never fabricate absent payload or owner attribution.
    V2 consumers select v2 explicitly.
evidence:
  output:
  - docs/evidence/M23-03R2-<date>.md
  - Exact owner decision/canonical baseline, format specification, compatibility golden bytes/layouts, replay
    regression matrix, commands/results, privacy boundaries and remaining gates.
  claim_boundary: Portable Runtime replay correctness for explicitly retained v2 histories only; no hardware,
    RT, release or production qualification.
