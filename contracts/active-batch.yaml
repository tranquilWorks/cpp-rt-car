acceptance:
- Ship a small source-only headless/game-style host kit and installed guide using only public rtfw::runtime
  artifacts. Exercise native Runtime workers and host_adapter mode through the same graph and independent
  state oracle on Linux and Windows. Keep all production, public headers/targets, compiled ABI and earlier
  kits/evidence unchanged. No Unreal, vendor adapter, runtime repair or later batch.
- Provide an actual already-running host-owned fixed-capacity job system with copied HostExecutorJob records,
  bounded nonblocking submission and at-most-one-job cooperative help. Execute each accepted job exactly
  once; reject capacity/unavailable admission without retaining or executing rejected work. Preserve opaque
  completion identity and scratch lifetime through execute return; support nested Runtime work without
  holding a queue lock or waiting on a saturated team. Bound registry/queue scans and document worker-index/control-thread
  ownership and lifecycle. Thread creation/join remain control-plane operations; no callback allocation,
  mutex, I/O or hidden spill execution.
- Provide a fixed-storage host allocator/MemoryProvider for all three supported Runtime-owned regions
  (phase scratch, task scratch, trace). Validate category, capacity, alignment and unsupported policy
  requests before admission; report truthful usable/committed storage and capabilities. Track exact live
  tokens, reject duplicate acquisition and retain storage through any failed rollback/stop until checked
  retry succeeds. No invented NUMA/locking/pinning/guard/huge-page/independent-observation claims. Demonstrate
  explicit memory-plan and host-resource accounting boundaries rather than claiming the provider covers
  every Runtime allocation.
- Inject a host-owned monotonic clock and execute an explicit finite host frame loop with at least two
  isolated Runtime instances alive at once. Use a bounded graph with nested parallel work, independent
  per-element/frame and final-state oracles, and both native/host executor modes. Drain public trace/metrics
  into caller-owned bounded buffers outside callbacks, verify identity/count/loss behavior and report
  failures truthfully. Keep logical frame time separate from physical clock timing; no throughput or RT
  qualification claim.
- Demonstrate and test exact capacity/backpressure, copied-job ownership, accepted/completed conservation,
  helper progress/nested saturation, no-allocation steady operation, telemetry overflow/loss, clock/capacity/provider
  failures, partial startup, callback failure, checked stop retry and host detach ordering. Stop admission,
  quiesce accepted jobs and Runtime callbacks, check stop, then release provider/host owners; never drop
  accepted work, detach early or destroy unresolved borrowed ownership. Include repeated lifecycle, independent
  concurrent host instances and negative controls that detect incorrect output or ownership. Preserve
  failing evidence and require a separately approved repair if production changes are needed.
- Install an exact source/CMake/oracle inventory and self-contained guide with lifecycle, capacities,
  memory/clock/job ownership, telemetry, build/run transcripts, failure/retry rules and residual limits.
  Run standalone find_package native/host modes and source embedding from a relocated testsOFF SDK with
  original prefix removed, custom data/include paths and spaces. Add a separate additive package-consumer
  contract and preserve all prior raw/typed/backend/CIL/CUDA consumers and exact public SDK inventory.
- Run full local profiles, focused strict/sanitizer/static/allocation/concurrency/lifecycle checks, complete
  SDK and existing CUDA relocated/source consumers, compiled ABI and unchanged M24 matrix, plus all32
  exact-head hosted target records with predecessor names/multiplicity. Retain canonical/head/tree/check
  identities, acceptance mapping, failed runs/corrections, risk review, rollback and unperformed gates.
  Close only M25-05; M25-06, M26, independent human, physical/RT/performance/Unreal/release gates stay
  separate.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh full
  - python3 tests/host_adapter/verify_package.py --work-directory build/m25-05-package
  - python3 tests/cuda_physics/verify_package.py --work-directory build/m25-05-cuda-package
  - python3 tools/check_c_abi.py --library build/agent-quick/librtfw.so
  - Focused strict job/provider/clock/Runtime/telemetry/lifecycle/allocation tests; ASan/UBSan with leak
    detection, TSan and Clang14 static analysis.
  - python3 tools/check_cuda_capabilities.py
  - git diff --check
  focused_tests_to_add:
  - Fixed-capacity copied-job conservation, bounded rejection, helper/nested/concurrent execution, scratch
    identity and steady allocation checks.
  - Actual native and host-adapter Runtime graphs with independent per-frame state and trace/metrics oracles,
    multiple instances and lifecycle/rollback retry failures.
  - Relocated and embedded host kit, exact inventory/public target isolation, native/host output and missing
    artifact/false-output negative controls.
  required_ci:
  - All32 existing exact-head target check records with predecessor name/multiplicity inventory, all successful
    and no unresolved review thread.
  - Existing compiler/FMA/MSVC/ASan, static, package and docs gates gain host job/provider/clock/telemetry
    and actual native/adapter consumer coverage without removing earlier checks.
  manual:
  - Independent first-use walkthrough by an unfamiliar human remains UNPERFORMED.
  - No hardware, RT1/RT2, controlled performance, Unreal, signing/release/deployment qualification.
risk:
  class: moderate
  hazards:
  - Host queue admission/completion races, nested saturation or duplicate execution corrupt opaque Runtime
    job/scratch ownership.
  - Provider token reclamation or host detach before checked quiescence invalidates borrowed Runtime storage.
  - Host-controlled telemetry/time/allocation observations are overstated as complete memory accounting,
    performance, RT or engine qualification.
  stop_conditions:
  - A production or forbidden path change is needed; retain reproducer and plan a separate repair.
  - A mandatory test would need weakening or canonical planning has not integrated.
rollback:
  strategy: Revert only the additive host reference, tests/docs and package wiring. Preserve production
    runtime/backend/ABI, SDK inventory and all earlier capability/evidence bindings.
evidence:
  output:
  - docs/evidence/M25-05-<date>.md
  - Canonical/head/tree/check identities, native/host graph and job/provider/lifecycle/telemetry negative
    transcripts, package results and retained failures.
  claim_boundary: Portable independent headless host integration using public SDK only; no general-purpose
    engine/job scheduler, complete Runtime allocation replacement, physical/RT/performance, Unreal, independent
    novice review, M25 closure or signing/release/deployment claim.
