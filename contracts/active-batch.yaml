acceptance:
- Validate and integrate this canonical contract before implementation. Retain the original cancellation
  failure and later 50-repeat pass as distinct evidence; keep feature PR 261 draft until repaired integration
  is verified.
- For ordinary command-batch terminal completion, snapshot required metadata and claim graph release before
  publishing the slot Free, decrement outstanding work and retire ownership before notifying graph completion.
  Never access mutable slot fields after Free publication. Keep backend wake notification, exact completion/timeline
  accounting and single graph release.
- A small allocation-free template helper in existing private device_manager.hpp may expose the production
  retirement/publication ordering for deterministic regression. No installed/public API, test-only Runtime
  hook, new lane, allocation, blocking lock, polling workaround or timeout change.
- Run the deterministic test first with a behavior-equivalent extraction of original release-before-retirement
  ordering and retain its failing assertions. At the graph-publication boundary, observe no outstanding
  owned batch and permit immediate reuse; subsequent old-owner actions must neither reclaim nor mutate
  the new occupant. Cover graph already released by stop without duplicate graph completion, and preserve
  existing public repeated-lifecycle test unchanged.
- Preserve active-rate terminal/quarantine ownership, pending-work stop/cancel behavior, early completion,
  failure/timeout paths, multiple-owner isolation and admission/drain semantics. Do not suppress cancellation
  broadly or weaken any assertion.
- Preserve ABI v8/70 exports/fingerprint 0xd0e7a5a14bf35f97/SONAME 8, all public layouts and device/HAL
  ABIs, MemoryPlan accounting, default/optional SDK inventories, all 207 prior benchmark cases, schemas/validators,
  release 1.2.1 and Apache-2.0.
- Pass focused command/device/rate/replay suites, unchanged repeated public lifecycle coverage, supported
  ASan/UBSan and TSan, official full profile, compiled ABI, relocated package and every existing exact-head
  hosted gate. Retain unavailable or failing validation; no retry-until-green or functional waiver.
- After repair integration, reconcile and reactivate canonical M23-05 for feature PR 261, preserve its
  source and contracts and freshly verify combined local/hosted gates before merging.
- Record exact canonical/source/tree/CI identities, ordering proof, negative-control output, actual results
  and limitations. No physical characterization, controlled thresholds, human review, hardware/RT qualification,
  support promotion, signing, release, deployment, cybersecurity, Daybreak or Unreal scope.
validation:
  local:
  - git status --short --branch
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - Production-helper original-order negative control and repaired retirement/graph-publication regression.
  - Focused CommandBatch, DeviceRuntime, MixedRateReplay and existing device/replay tests.
  - GCC ASan/UBSan and TSan focused suites where supported.
  - ./scripts/agent-verify.sh full
  - python3 tools/check_c_abi.py --library build/agent-full/librtfw.so
  - Default relocated package consumers and release contract validation.
  - git diff --check
  focused_tests_to_add:
  - Graph publication observes retired ownership and zero outstanding completed work.
  - Immediate slot reuse at publication is not reclaimed or altered by the previous owner; captured phase/backend
    metadata stays correct.
  - Prior stop release drains once without duplicate graph completion; all existing public lifecycle,
    stop/cancel/failure and active-rate cases remain unchanged.
  required_ci:
  - Existing exact-head GCC/Clang sanitizer, Windows MSVC, GCC TSan, determinism, portable assurance,
    ABI/package and contract gates without removal or weakening.
  manual:
  - Review graph-publication ordering, slot lifetime/reuse and stop ownership. Independent human review
    remains explicit.
risk:
  class: high
  hazards:
  - Graph completion before slot retirement permits stop to cancel already-completed work.
  - Slot reads or writes after Free publication can affect a reused occupant.
  - Broadly skipping cancellation, test weakening or lucky reruns conceal the defect.
  stop_conditions:
  - Canonical contract absent or target main moved without reconciliation.
  - Repair needs public layouts, extra Runtime resources, weakened comparisons/timeouts, test-only hooks
    or forbidden paths.
  - Verification requires waived functional gates or fabricated evidence.
rollback:
  strategy: Revert the isolated retirement/helper/regression and activation together; retain the failure
    and keep PR 261 blocked pending a verified replacement.
evidence:
  output:
  - docs/evidence/M23-05R-2026-09-25.md
  - Exact old/corrected ordering tests, canonical/source/tree identities, focused/sanitizer/full/package/hosted
    results and limitations.
  claim_boundary: Portable ordinary command-batch completion ordering only; no public interface, physical
    characterization, controlled timing, RT qualification or release.
