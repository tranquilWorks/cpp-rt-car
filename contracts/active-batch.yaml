acceptance:
- Inventory M27-02 and M27-07 startup observations, including SampledSimulationUnselectedNative status
  -2 versus -18 under the original 8ms bound and the separately retained Windows 2s observation. Read
  their raw evidence before choosing a cause; do not assume all observations share one defect.
- Use only injected/simulated drivers and controlled scheduling to distinguish genuine timeout from pending
  cleanup and status precedence. Preserve safe output, no copied invalid payload, terminal visibility,
  borrowed lifetimes, zero-live accounting after successful checked stop, and failed-stop ownership for
  retry.
- Repair only an independently reproduced private lifecycle defect. Add ordered startup/timeout/late completion/repeated-stop/independent-owner
  controls and run all original sampled tests unchanged on existing supported CI tuples. Preserve 8ms,
  2s and every other existing timeout/assertion. Unreproduced or timing-environment-only observations
  remain explicitly unresolved; no retry pass closes them.
- 'Activate M28-03 from exact target main b5275b0a6094ddab1ab902632cc7cf35e9d20e59 and bind the merged
  canonical revision/blob before implementation. Initial cause-specific scope is additive public-API lifecycle
  controls and evidence only: existing M27-02 controls demonstrate valid pending ownership, not a proved
  new production defect. Production edits require an independently reproduced private defect and a bounded
  canonical amendment before editing. An investigation may complete with explicitly unresolved historical
  timing observations; no retry pass or new control is a repair claim.'
- Preserve release1.2.1, portable RT0, C ABI8/70 exports/fingerprint/SONAME8, device ABI1, public/default
  policies and supported tuples. Existing source tests/assertions/deadlines and all historical evidence
  stay unchanged; tests/CMakeLists.txt permits additive new-test wiring only.
- For each claimed repair retain a causal baseline failure and corrected outcome. Complete exact-head
  local full validation and all32 hosted checks with the original names and multiplicity, applicable sanitizer/static/no-allocation/default/ABI/actual
  installed package gates, risk review and guarded target/canonical closure. No functional gate is waived.
