acceptance:
- Preserve the exact 207-case four-provider CLI inventory and all original workloads, schemas, validator,
  core/provider implementation, default SDK and ABI v8/70 exports/SONAME8. Implement analysis as a separate
  standard-library Python host tool and third-party source template; no Runtime or runner fork.
- Define strict versioned sidecar contracts for baseline manifests, candidate run manifests, predeclared
  comparison policy, threshold review and profiler correlations. Bind exact artifact file digests, source
  and complete identity, descriptor/workload, commands represented by bounded public tokens, declared
  independent trial IDs and run ordering. Bound cases, trials, files and input size; reject missing/duplicate/unknown/malformed
  fields and retain zero-sample NOT RUN distinctly.
- Use the unchanged offline v1 validator for every input. Compare exact descriptor, counter inventory/units
  and complete host/compiler/build/backend/thread/memory identities; only source commit/tree may intentionally
  differ between baseline and candidate. Reject dirty/unknown source and missing required host facts for
  steady performance comparisons, missing required counters, altered workload, cross-host/toolchain/configuration
  or fake/steady mixing. Structural fixtures never produce performance conclusions.
- Use independent run-level medians, not within-run repeated invocations as independent statistical trials.
  Retain every raw sample without trimming. Document exact distribution-free binomial order-statistic
  confidence bounds with conservative family-wide adjustment, integer/rational arithmetic, minimum trial/sample
  counts, zero-denominator and insufficient-confidence handling. Predeclare noise and outlier rules and
  report inconclusive instead of a misleading pass when noise, outliers or sample insufficiency invalidates
  comparison.
- Generate deterministic machine-readable reports and readable Markdown with per-case status/reasons,
  retained source/identity/hash references, raw counts, p50/p95/p99/max summaries, exact counter totals,
  median differences and confidence bounds only when admissible. Missing, failed, incompatible and noisy
  cases cannot disappear or become successful deltas; multi-case aggregate reflects worst disposition.
- Portable mode performs structural validation and descriptive portable characterization only; it never
  applies release-regression thresholds or promotes an evidence class. Controlled threshold evaluation
  requires an explicit external review binding the exact baseline/policy/host declaration and predating
  every candidate trial. The tool creates proposal-only review templates, never approves thresholds, signs
  evidence, updates baselines, promotes support or changes controlled-runner settings. Threshold changes
  invalidate the old review.
- Profiler correlation sidecars bind exact run/context digest, case, named tool/version and retained trace
  digest plus explicit sample index ranges and clock-domain relationship or uncorrelated state. Do not
  infer causality, ingest private trace contents, execute profiler commands or alter the existing result
  schema. Reports preserve missing/uncorrelated facts explicitly and show an actionable profiling-to-reproduction-to-remediation
  workflow.
- Provide a complete third-party ProviderV1 template with meaningful bounded integer transform, independent
  elementwise oracle/counters, metadata-only discovery, explicit prepare/invoke/checked-finish ownership,
  repeated ordinals/runs, missing prerequisite and fault nonpublication behavior. The example uses only
  installed benchmark headers/target, supports fake and steady clocks, multiple independent owners and
  emits ordinary valid v1 bundles without editing the runner.
- Install analysis scripts/contracts/docs and template sources only with the optional benchmark component.
  Exercise installed, archive-relocated, non-default-prefix and add-subdirectory consumers; append a wrapper
  above all unchanged device/Runtime/CPU/original wrappers. Preserve existing optional source ledgers
  and exact default package inventory.
- Add deterministic golden statistical/identity/noise/malformed/NOT RUN/review chronology/profiler tests
  and end-to-end CLI success/failure/output preservation tests. Verify exact known confidence bounds and
  threshold edges independently. Test the actual template with failure recovery, repeated and concurrent
  independent owners, sanitizers and optional static analysis. No elapsed-time assertion from uncontrolled
  CI is a release threshold.
- Retain all existing required compiler/FMA/MSVC, sanitizer/TSan, seven-way artifact exchange, package/default
  SDK, ABI, no-allocation, docs and release gates. Add analysis/template coverage within those gates without
  deleting earlier assertions or weakening checks.
- Record each acceptance result and exact source/control/head/tree identities, failures and unperformed
  validation. Software completion does not claim controlled timing, actual profiler capture, hardware/RT
  qualification or independent human review. M24-M26, Unreal, cybersecurity, Daybreak, signing, release
  and deployment remain outside this batch.
validation:
  local:
  - git status --short --branch
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - cmake -S . -B build/m23-analysis -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=OFF
    -DRTFW_BUILD_BENCHMARKS=ON -DSIM_SANITIZERS= -DSIM_WERROR=ON
  - cmake --build build/m23-analysis --parallel 2
  - ctest --test-dir build/m23-analysis --output-on-failure
  - python3 tests/benchmark_fixtures/analysis/test_analysis.py
  - python3 tests/benchmark_fixtures/extension_consumer/verify_package.py --help
  - ./scripts/agent-verify.sh full
  - python3 tools/check_c_abi.py --library build/m23-analysis/librtfw.so
  - git diff --check
  focused_tests_to_add:
  - Exact confidence arithmetic, noise/outlier and threshold boundary fixtures; complete identity mismatch
    and malformed/partial artifact rejection.
  - Review-policy-baseline binding and chronology; profiler run/context/sample binding; no performance
    decisions from structural fixtures or unreviewed portable evidence.
  - End-to-end comparison/report generation, unchanged destinations, extension CLI/oracles/faults/recovery/independent
    owners and optional package consumers.
  required_ci:
  - All unchanged 32-check predecessor surface, with additive offline analysis and template tests.
  - GCC/Clang/MSVC optional installed/relocated/embedded source consumers and existing seven-way canonical
    exchanges.
  - Supported sanitizer and TSan template lifecycle/concurrency; Clang14 optional static; exact default
    SDK/ABI/release digests.
  manual:
  - Threshold approval and actual controlled measurements remain external owner actions; no software test
    supplies that review.
  - Physical measurements and actual profiler captures require accessible named hardware and retained
    source/host/tool identities.
risk:
  class: high
  hazards:
  - Pseudoreplication, outlier removal, post-selected thresholds or incomplete identity creating false
    performance conclusions.
  - Optional Python/template artifacts leaking into default SDK or changing prior provider workloads and
    release digests.
  - Mislabeling portable/synthetic/declared-review evidence as physical, controlled-runner qualification
    or authenticated approval.
  stop_conditions:
  - A forbidden core/provider/schema/validator path or ABI change is needed; retain reproducer and create
    a separate repair scope.
  - Unresolved product decision, inaccessible hardware or controlled threshold approval is needed for
    a claimed result.
  - Main moves without reconciliation, local functional gate fails, or successful integration needs weakened
    checks.
rollback:
  strategy: Revert isolated offline analysis, extension source kit and additive packaging/test/documentation
    wiring as one batch, preserving all M23-01 through M23-04 source and evidence.
evidence:
  output:
  - docs/evidence/M23-05-<date>.md
  - Acceptance-to-code/test matrix, actual commands and failed/passed/unperformed results, exact target/control
    commits/trees/CI and PR identities.
  - Versioned baseline/review/profiler fixtures labeled synthetic; no claimed hardware or controlled timing
    evidence.
  claim_boundary: M23 portable software analysis and extension implementation only. No physical characterization,
    real controlled threshold approval, support/RT qualification, independent human review, M24-M26, cybersecurity,
    Daybreak, Unreal, signing, release or deployment.
