acceptance:
- Implement each named format through documented native consumers and real decoding/collection tests on
  its supported OS; do not relabel the existing JSON exporter as native integration.
- Deliver an optional installed source kit, not a new default SDK target/header or Runtime ABI. A bounded
  host queue captures copied global schema2 snapshots only at quiescent boundaries, preserves cursors
  on disabled/full/failing capture, and exposes shutdown/backpressure/loss semantics. An explicit versioned
  intermediate spool may feed optional native encoders; it is not itself a native format. Use official
  Perfetto and OpenTelemetry protobuf modules and real Trace Processor/Collector; Windows TraceLogging
  events require ETL/TDH decoding on a real Windows runner. Preserve exact integers and timestamp/identity
  provenance; distinguish transport acceptance, partial rejection and ambiguous failures without silent
  retries.
- Test installed and relocated source-kit clients, real native consumers, malformed/truncated/oversize
  input, clock mapping bounds, separate/concurrent owners, queue overflow, failed writes, disabled export
  and drain/discard shutdown. Retain exact dependency/tool versions and hashes. Refresh only related installed
  documentation/release inventory/hash bindings and audit mappings; no predecessor evidence or broader
  qualification promotion.
- Keep collection and encoding off Runtime lanes, bounded input queues with explicit losses and exact
  clock/owner correlation. Preserve default SDK isolation and existing public ABI/schema bytes.
- Validate actual optional installed/relocated clients, malformed records, backpressure, disabled exporters,
  concurrent instances and shutdown. ETW requires a working Windows toolchain/test runner; missing collector/OS
  remains unperformed.
- Preserve prior completed batches/evidence and protected ABI/default/support claims. Run complete repository
  contract/quick/full plus all32 exact final-head hosted records with exact baseline names/multiplicity;
  retain failed attempts and risk review. Guard clean/head/base/review/merge-tree equality before scoped
  integration and canonical closure.
