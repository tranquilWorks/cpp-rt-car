  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - ctest --test-dir build/agent-quick -R host_lifecycle --output-on-failure
  - git diff --check
  focused_tests_to_add:
  - Actual Runtime and extension-bound registry tests, tick/frame arithmetic boundaries, real shared-module
    loader example and installed/relocated consumer. Preserve failure and sanitizer results.
  required_ci:
  - All32 original exact-head hosted names/multiplicity, new host-adapter tests in existing sanitizer
    profiles, full canonical local/hosted validation.
  manual:
  - Actual engine bindings/builds/world/PIE/packaged runs, CUDA/XDMA/combined/RT/performance/endurance,
    independent review, signing/release/deployment remain separate.
risk:
  class: high
  hazards:
  - Unloaded module leaves borrowed Runtime callables or service ownership alive.
  - Failed stop/detach, generation reuse or partial cleanup releases ownership falsely.
  - Portable source kit or time conversion is overstated as actual Unreal/hardware/RT acceptance.
  stop_conditions:
  - Protected Runtime/ABI/default SDK/workflow/prior tests or release policy must change.
  - 'Actual licensed engine or hardware/human/production action required: retain original gate open; finish
    independently verifiable portable integration.'
  - No failing functional gate may be weakened or waived.
rollback:
  strategy: Revert only new optional shared-data integration source kit, new tests and additive build
    wiring, current docs/governance/hash bindings; preserve all existing Runtime, prior repairs and retained
    failures.
evidence:
