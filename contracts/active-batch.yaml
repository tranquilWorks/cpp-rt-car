acceptance:
- Retain the M27-03 held-submit reproducer and historical M23 failure. Separately observe provider entry,
  backend acceptance, terminal timeout, copied output and checked cleanup before and after submit preemption.
- Correct only the demonstrated provider accounting assumption for device-timeout-nonpublication. Define
  exact valid state transitions for zero accepted submissions versus one accepted submission; never simply
  relax an equality or ignore a missing terminal/output/ownership check. Preserve the original 1ms deadline,
  case identity, schemas and historical tests.
- Add deterministic before-acceptance and after-acceptance controls, successful submission and real accounting-error
  negatives. Validate the actual benchmark CLI, existing catalog/result validators, installed provider
  and complete existing benchmark suites. A new deterministic cause does not retroactively prove the exact
  cause of the old hosted failure.
- 'Initialized TSan of the actual held-after-acceptance provider also exposes loopback cancel reading
  completion storage without submission publication. Within the same allowed device.cpp only, add a fixture-owned
  command-extension observer for the single failure/timeout invocation: publish acceptance after submit
  returns, forward cancellation only after that publication, retain nonblocking failed cancellation before
  acceptance and checked-stop ownership. Bind final observed acceptance to backend accounting. Do not
  change Runtime/backend sources, other workloads, deadline or schema. Retain the broader pre-existing
  loopback backend race as unresolved outside this provider-local correction.'
- Activate only M28-02 from exact target baseline ab22bb4580de18794fcb2bad2b72b4e8a1e104c5, bind this
  merged canonical revision/blob before implementation, and preserve all M28-01 source/tests/evidence.
  Later M28 work remains inactive.
- Preserve release1.2.1, portable RT0, C ABI8/70 exports/fingerprint/SONAME8, device ABI1, public/default
  policies and supported tuples. Existing source tests/assertions/deadlines and all historical evidence
  stay unchanged; tests/CMakeLists.txt permits additive new-test wiring only.
- For each claimed repair retain a causal baseline failure and corrected outcome. Complete exact-head
  local full validation and all32 hosted checks with the original names and multiplicity, applicable sanitizer/static/no-allocation/default/ABI/actual
  installed package gates, risk review and guarded target/canonical closure. No functional gate is waived.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - git diff --check
  focused_tests_to_add:
  - Retain the M27-03 held-submit reproducer and historical M23 failure. Separately observe provider entry,
    backend acceptance, terminal timeout, copied output and checked cleanup before and after submit preemption.
  - Correct only the demonstrated provider accounting assumption for device-timeout-nonpublication. Define
    exact valid state transitions for zero accepted submissions versus one accepted submission; never
    simply relax an equality or ignore a missing terminal/output/ownership check. Preserve the original
    1ms deadline, case identity, schemas and historical tests.
  - Add deterministic before-acceptance and after-acceptance controls, successful submission and real
    accounting-error negatives. Validate the actual benchmark CLI, existing catalog/result validators,
    installed provider and complete existing benchmark suites. A new deterministic cause does not retroactively
    prove the exact cause of the old hosted failure.
  - 'Initialized TSan of the actual held-after-acceptance provider also exposes loopback cancel reading
    completion storage without submission publication. Within the same allowed device.cpp only, add a
    fixture-owned command-extension observer for the single failure/timeout invocation: publish acceptance
    after submit returns, forward cancellation only after that publication, retain nonblocking failed
    cancellation before acceptance and checked-stop ownership. Bind final observed acceptance to backend
    accounting. Do not change Runtime/backend sources, other workloads, deadline or schema. Retain the
    broader pre-existing loopback backend race as unresolved outside this provider-local correction.'
  required_ci:
  - All32 exact final-head target checks successful, preserving original baseline names and multiplicity;
    full canonical control validation on planning and closure.
  manual:
  - None inside this software batch. Final owner stage retains all bench, engine, independent human, controlled
    performance, production signing/release/deployment acceptance.
risk:
  class: high
  hazards:
  - An unproven cause, retry pass or instrumented timing result is mistaken for a repair or qualification.
  - A change weakens an old assertion, deadline, ABI/default or prior evidence.
  stop_conditions:
  - A new public API/ABI/schema/default-policy decision or path outside the activated cause-specific scope
    is needed.
  - Credible completion requires a bench, licensed engine, live endpoint, independent human judgement,
    production key or release/deployment action; retain that item for the final owner stage.
rollback:
  strategy: Revert only this batch changes and additive wiring; preserve predecessor implementations,
    immutable evidence and every final-stage obligation.
evidence:
  output:
  - docs/evidence/M28-02-<date>.md
  - Exact source/tree, commands, raw failures/results, source hashes, risk review, final-head CI and guarded
    merge/closure receipts.
  claim_boundary: Portable software only. Investigation can classify an unresolved result without claiming
    it passed. Global qualification, independent human acceptance and production release remain separate.
