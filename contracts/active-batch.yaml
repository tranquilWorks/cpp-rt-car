acceptance:
- Preserve every existing 207-case M23 catalog, framework, artifact schema, validator, provider, public
  Runtime/backend source, ABI and all M24-01/02/03 tests and repaired lifetime invariants. Add a separately
  named optional M23 ProviderV1 source kit and CLI for the existing actual Runtime particle pipeline;
  do not change its model or dispatch.
- Use fixed finite descriptors covering kernel/Graph, frame/active dispatch, count-one/odd/maximum entity
  scaling, and worker points. Integrate named existing M23 transfer, launch, overlap, recovery and end-to-end
  cases in a machine-checked crosswalk rather than duplicate or rename their workloads. Descriptor discovery
  performs no device execution.
- Separate prepare, measured step plus exact CPU-oracle validation, and checked finish. Observe actual
  transfer bytes, kernel/Graph calls, publications, timelines and resource conservation with driver counters.
  Every successful invoke proves nine-field exact particle correctness, legal warmup/measured ordinal
  and no normal synchronization/backend allocation; failures suppress artifacts. Lifecycle/recovery measurements
  are explicitly labeled and use the preserved M23 cases.
- Add fixed-capacity per-instance profiler correlation records through existing configuring-time hooks.
  Bind case, invocation, lane and actual submitted timeline identity to checked completion; separate host
  timestamps from unavailable device timestamps. No pointers, native handles, hidden threads, callback
  allocation, filesystem I/O or unbounded storage. Prove identities, capacity rejection, repeated ownership
  and concurrent isolation. Export host records only after checked stop; portable traces cannot imply
  physical GPU overlap or profiler capture.
- Use unchanged M23 version1 artifacts and validator, retain raw timings and actual identity; fake clocks
  are structural fixtures and steady clocks portable characterization. Provide finite strict CLI help/invalid/failure
  paths and no-overwrite publication. Optional real M24 reference/pipeline entry points remain compiled
  and report NOT RUN without hardware; no fabricated real performance results.
- Ship optional benchmark sources and generated capability documentation for relocated find_package and
  add_subdirectory consumers. Preserve default SDK target/header inventory and every prior reference/pipeline/lifetime
  source entry. Add exact source digests to release ledger and consumer inventory.
- Create a versioned capability matrix spanning all milestone categories with independently meaningful
  rows, critical flags, concrete named automated gates and retained evidence/source bindings. Count all
  rows including explicit unperformed M18 physical-only gates in the overall denominator. Require at least90percent
  overall and100percent critical automated coverage, fail closed on duplicate/missing IDs, unknown gates,
  missing/stale evidence, weakened critical flags, removed categories or generated-doc drift. Physical-only
  evidence never becomes automated by declaration.
- Retain a reproducible measured optimization comparison of equal particle workloads for direct kernel
  versus pre-instantiated Graph using unchanged M23 analysis where applicable, raw samples and honest
  observed counts. Record selected configuration and reasons; allow no measured improvement and make no
  controlled latency, hardware throughput or near-optimal claim. Include baseline/candidate correctness
  parity and overhead/timing limitations.
- Add meaningful negative controls for oracle corruption, correlation/capacity, malformed matrix and failed
  evidence, CLI/output failures and zero steady allocation. Extend existing compiler/FMA/MSVC, sanitizer/static/package
  checks additively. Run focused, strict portable, full, ABI, relocated SDK/source, optional real compile/help
  and all32 exact-head hosted check records.
- Record exact canonical revision/blob, baseline/head/tree, acceptance, commands, failures, self-review,
  rollback and unperformed manual evidence. Close only portable M24/CAP-M24 software after gates and scoped
  integration; M18 physical qualification, controlled performance, independent human review, RT1/RT2,
  M25/M26, signing/release/deployment remain separate. Any production defect needs a separately scoped
  repair.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - cmake -S . -B build/m24-benchmark -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=OFF
    -DRTFW_BUILD_BENCHMARKS=ON -DSIM_SANITIZERS= -DSIM_WERROR=ON
  - cmake --build build/m24-benchmark --parallel 2
  - ctest --test-dir build/m24-benchmark --output-on-failure
  - python3 tests/cuda_physics/verify_package.py --work-directory build/m24-04-package
  - ./scripts/agent-verify.sh full
  - python3 tools/check_c_abi.py --library build/m24-benchmark/librtfw.so
  - git diff --check
  focused_tests_to_add:
  - All new descriptors through actual CLI and unchanged artifact validator; exact counters, timeline
    correlations and independent oracle negative control.
  - Fixed record capacity/ownership, zero steady allocation, concurrent provider isolation and sanitizer
    gates.
  - Matrix schema/evidence tampering and generated documentation drift; original M23 crosswalk identities.
  - Installed archive-relocated and embedded benchmark source consumers; measured equal-workload comparison.
  required_ci:
  - All32 existing exact-head check records; additive GCC/Clang/FMA/MSVC, ASan/UBSan, TSan, static and
    package coverage without removing prior gates.
  - Original SDK/ABI/release inventories and real CUDA toolkit compile/help remain required.
  manual:
  - Physical NVIDIA correctness/performance/thermal/endurance/recovery remain M18 NOT RUN absent named
    hardware.
  - Agent self-review does not imply independent human review or controlled performance acceptance.
risk:
  class: high
  hazards:
  - Coverage inflated by dropping physical rows or treating evidence paths as executed tests.
  - Incorrect timing scopes or fabricated overlap/profiler IDs misrepresent portable work.
  - Instrumentation adds races, allocation, ownership loss or benchmark dependencies to the supported
    Runtime.
  stop_conditions:
  - A forbidden production, model, provider, ABI or schema change is needed; retain reproducer and plan
    separate repair.
  - Required assertions or gates would need weakening, or canonical contract is not integrated before
    implementation.
rollback:
  strategy: Revert the separate optional benchmark/profile/matrix kit and additive build/package/docs
    wiring; preserve Runtime, M23 providers and all prior CUDA samples/repairs/evidence.
evidence:
  output:
  - docs/evidence/M24-04-<date>.md
  - Versioned capability report, generated docs, retained measured comparison and raw artifacts.
  - Exact canonical/head/tree/CI identities and passed/failed/unperformed gates.
  claim_boundary: Portable software maturity for a bounded integer validation model only. No production
    physics, physical CUDA/RT qualification, controlled performance, independent review, Unreal, signing/release/deployment.
