acceptance:
- Add only ordinary deterministic public-API regression coverage for two independent Runtime owners, lifecycle
  transitions, checkpoint round trips and refused restores, active replay inspection and typed payload
  decode/round trips. Use fixed documented cases, return normal test failures and preserve all production
  and predecessor sources/assertions/deadlines.
- Exercise the actual new CTest and an independent installed/relocated SDK consumer, with normal sanitizer/static/default-ABI
  checks. No intentional memory errors, generated-input campaign, crash minimizer, scanner or additional
  hosted workflow is included. Retain the withdrawn unpublished prototype and its setup failure without
  calling it completed validation.
- Document the owner scope change and preserve original sustained/continuous campaign, seeded-defect discovery
  and workflow obligations as unperformed/deferred. No CAP-M20 security or continuous-coverage acceptance
  is promoted. M27-06 is selected next for build/provenance verification after this bounded05 integration;07/08
  remain inactive.
- Run complete repository contract/quick/full plus all32 exact final-head baseline hosted records with
  exact names/multiplicity, risk review and clean/head/base/review/merge-tree guards before scoped integration
  and canonical closure. No target/local gate is waived.
