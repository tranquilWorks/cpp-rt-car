acceptance:
- Use existing supported native adapter interfaces, explicit host staging, named tuple/configuration requirements
  and checked startup/stop ownership; preserve frozen golden workloads and existing simulated kits.
- Compile the actual optional installed host, validate absent-device refusal before side effects and fake-driver
  protocol/lifecycle/format negatives without accessing live endpoints.
- Leave real FPGA/bitstream/driver functional behavior, safe physical outputs, thermal/saturation/device-loss/endurance
  and RT qualification unperformed until a named approved bench is available.
- Preserve prior completed batches/evidence and protected ABI/default/support claims. Run complete repository
  contract/quick/full plus all32 exact final-head hosted records with exact baseline names/multiplicity;
  retain failed attempts and risk review. Guard clean/head/base/review/merge-tree equality before scoped
  integration and canonical closure.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - Focused entry-point positive/negative tests, independently failing baseline control, applicable sanitizer/static/no-allocation/default-byte/ABI
    and actual installed package validation.
  - git diff --check
  focused_tests_to_add:
  - Use existing supported native adapter interfaces, explicit host staging, named tuple/configuration
    requirements and checked startup/stop ownership; preserve frozen golden workloads and existing simulated
    kits.
  - Compile the actual optional installed host, validate absent-device refusal before side effects and
