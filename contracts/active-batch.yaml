acceptance:
- Validate and integrate this canonical contract before implementation. Retain every earlier failure, exact 87-case draft checkpoint and incomplete CLI sweep; reconcile actual target main before activation.
- Load the wake sequence before scanning submission slots. Preserve oldest queued sequence selection, release/acquire publication, backend-local ownership, stop notification and accepted-work drain. Enqueue before, during or after scanning must either be selected or change the value used by atomic wait.
- A small internal allocation-free selection/wait helper may be extracted into existing private device_manager.hpp solely to exercise production ordering. No public API, test-only Runtime hook, new thread, polling workaround, timeout change or allocation is permitted in Runtime lanes.
- Add a deterministic regression against the production helper. First test a behavior-equivalent extraction of the old read-after-scan order; enqueue/notify after empty selection must fail its progress assertion, with a second notification used only to rescue and join the negative-control thread. Then verify read-before-scan completes, already queued work is selected, and stop returns without parking. A generous host liveness deadline may bound the regression, without a benchmark or performance-threshold claim.
- Add bounded public Runtime command-batch repeated submission and lifecycle coverage, exact provider/backend/completion counts and independent owners where practical. Preserve all timeline, device failure/timeout/cancel, replay and cleanup tests.
- Preserve C ABI v8, 70 exports, fingerprint 0xd0e7a5a14bf35f97, SONAME 8, public C++ layouts, device/HAL extension ABIs, MemoryPlan accounting, SDK inventories, watchdog/replay semantics, release 1.2.1 and Apache-2.0.
- Run focused command/device/replay tests, GCC ASan/UBSan and TSan where supported, official full profile, ABI/package/contract checks and every existing exact-head hosted gate. Retain failures and unavailable checks; no gate weakening or retry-until-green.
- After separate repair integration, reconcile PR 254 and reactivate unchanged M23-03. Freshly verify all 87 cases, original 51 CPU cases and legacy artifacts, allocation/concurrency/package and complete CLI sweep before benchmark merge. Preserve original workloads, deadlines, counter oracles and comparisons.
- Record source/canonical/tree/CI identities, old-order negative control, ordering proof and actual results. Do not claim every prior timeout shares this cause. No hardware/RT qualification, support promotion, signing, release, deployment, cybersecurity, Daybreak or Unreal scope.
validation:
  local:
  - git status --short --branch
  - ./scripts/agent-verify.sh contract
  - Production-helper old-order negative control and corrected-order regression with exact rescue and join output.
  - Focused CommandBatch, DeviceRuntime, MixedRateReplay and existing device/replay tests.
  - GCC ASan/UBSan and TSan focused suites where supported.
  - ./scripts/agent-verify.sh full
  - python3 tools/check_c_abi.py --library build/agent-full/librtfw.so
  - Default relocated package consumers and release contract validation.
  - git diff --check
  focused_tests_to_add:
  - Notification after empty selection cannot be lost by the production helper; old order fails under the same controlled interleaving.
  - Already queued work and stopping return without parking; all owners join after negative-control rescue.
  - Repeated public command-batch submissions and isolated owners preserve exact work and terminal cleanup.
  required_ci:
  - Existing exact-head GCC/Clang sanitizer, Windows MSVC, GCC TSan, determinism, portable assurance, ABI/package and contract gates without removal or weakening.
  manual:
  - Review ordering against enqueue/stop publication, lane lifetime and exact changed paths; independent human review status stays explicit.
risk:
  class: high
  hazards:
  - Reading the sequence after scanning can park with accepted work already queued.
  - Polling, changed timeouts or lucky reruns conceal a synchronization defect.
  - An unjoined negative-control worker or broad helper changes ownership or compatibility.
  stop_conditions:
  - Canonical contract is absent or target main moves without reconciliation.
  - Repair needs public layouts, extra Runtime resources, changed comparisons/timeouts, private test-only hooks or another forbidden path.
  - Verification requires weakened gates, unbounded resources, hardware or fabricated evidence.
rollback:
  strategy: Revert the isolated ordering/helper/regressions and activation as one bounded change; retain the failed CLI sweep and keep benchmark integration blocked pending a verified replacement.
evidence:
  output:
  - docs/evidence/M23-03R4-2026-09-24.md
  - Exact old/corrected ordering regression, source/canonical/tree mapping, focused/sanitizer/full/package/hosted results and limitations.
  claim_boundary: Portable device submission progress and wake ordering only; no new public interface, physical characterization, RT qualification or release.
