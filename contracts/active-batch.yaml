acceptance:
- On unchanged M26-06, independently reproduce direct Runtime foreign trusted active-replay rejection
  followed by failed valid capture. The new regression must fail the unchanged baseline and pass the repaired
  implementation; retain both commands/results and original golden probe.
- Check active replay owner compatibility before any replay-mode or action/correlation bookkeeping mutation.
  Cover trusted v1 and lossless v2, fresh/restored and already-used owners, repeat refusal, no callback
  invocation, full application state, serialized checkpoint/live-control inspection/cursor conservation,
  subsequent live admission/step/capture and originating-owner replay. Foreign active artifacts retain
  incompatible_artifact status; never rewrite their identities.
- Preserve ordinary input-log/trusted replay compatibility across compatible fresh Runtime instances.
  Do not impose active-replay ownership rules on ordinary replay, alter successful originating-owner behavior,
  error/status precedence outside the repaired path, checksums, serialized v1/v2 bytes or existing sample
  guards.
- Keep the correction private to host_runtime.cpp, with bounded allocation-free checks and unchanged ABI8/70exports/fingerprint0xd0e7a5a14bf35f97/SONAME8/deviceABI1/configschema7/default
  MemoryPlan. Native backends, all prior production/test/sample sources and every earlier assertion/deadline/evidence
  remain unchanged.
- Add an independent public installed consumer and no-allocation positive/control coverage. Run the new
  cases plus preserved ordinary/active/live-control replay suites, corrupt/malformed/foreign negatives,
  ASan/UBSan/leaks, TSan, Clang static, actual relocated full SDK consumers and byte/default/ABI checks.
  No inference that every possible replay failure is transactional.
- Update the living audit only to reflect the specific demonstrated repair; keep all other findings and
  qualification actions open. Retain source-hash/reproducible generated-document bindings and risk review.
  Full local profiles/all32 exact-head target checks and guarded target/canonical closure remain mandatory.
- Preserve prior completed batches/evidence and protected ABI/default/support claims. Run complete repository
  contract/quick/full plus all32 exact final-head hosted records with exact baseline names/multiplicity;
  retain failed attempts and risk review. Guard clean/head/base/review/merge-tree equality before scoped
  integration and canonical closure.
