acceptance:
- Reconcile the full canonical acceptance inventory and living golden audit with M27 delivery and M28-01
  through04 evidence, rather than limiting the audit to four summarized findings. Every remaining item
  needs its original requirement/evidence link, current disposition, dependency and next action.
- Distinguish demonstrated repair, retained unresolved software finding, evidence-supported instrumentation
  limitation, owner-excluded scope and final-stage external acceptance. An unresolved software defect
  prevents an unqualified software-complete claim. No new acceptance waiver or human risk acceptance is
  inferred.
- Preserve original M27-05 generated-input/continuous/scanner and M27-06 signature-fixture exclusions
  as unperformed; do not implement them or promote CAP-M20. Existing unsigned rebuild evidence is not
  authenticated provenance.
- 'Create the final-stage handoff for the owner: existing M18 physical CUDA/XDMA/combined/RT/endurance
  cards, M19-02..04 real Unreal, CAP-M23 controlled performance, M25 unfamiliar-consumer review, production
  identity/signing and release/deployment decisions. Reuse existing procedures and identities; create
  no duplicate qualification cards or inferred passes.'
- Machine-check missing/duplicate requirement IDs, broken local evidence references and invalid pass/qualification
  claims if a new ledger consumer is added. Update living summaries without rewriting historical evidence
  or changing acceptance thresholds.
- Activate only M28-05 at exact target main b37c124d6fd7c6ea7dd2b4dffcfc5531b0eb3c8e and bind merged canonical
  revision/blob before implementation. Add a source-linked reconciliation ledger, offline standard-library
  validation and additive tests; integrate the overlay with the existing golden audit and actual installed
  bundle. Preserve original canonical requirements, frozen scenario and existing tests/assertions. Update
  living summaries and mechanically generated/digest-bound documents only. No runtime repair, new qualification
  card, excluded campaign or M28-06 activation.
- Preserve release1.2.1, portable RT0, C ABI8/70 exports/fingerprint/SONAME8, device ABI1, public/default
  policies and supported tuples. Existing source tests/assertions/deadlines and all historical evidence
  stay unchanged; tests/CMakeLists.txt permits additive new-test wiring only.
- For each claimed repair retain a causal baseline failure and corrected outcome. Complete exact-head
  local full validation and all32 hosted checks with the original names and multiplicity, applicable sanitizer/static/no-allocation/default/ABI/actual
  installed package gates, risk review and guarded target/canonical closure. No functional gate is waived.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - git diff --check
  focused_tests_to_add:
  - Reconcile the full canonical acceptance inventory and living golden audit with M27 delivery and M28-01
    through04 evidence, rather than limiting the audit to four summarized findings. Every remaining item
    needs its original requirement/evidence link, current disposition, dependency and next action.
  - Distinguish demonstrated repair, retained unresolved software finding, evidence-supported instrumentation
    limitation, owner-excluded scope and final-stage external acceptance. An unresolved software defect
    prevents an unqualified software-complete claim. No new acceptance waiver or human risk acceptance
    is inferred.
  - Preserve original M27-05 generated-input/continuous/scanner and M27-06 signature-fixture exclusions
    as unperformed; do not implement them or promote CAP-M20. Existing unsigned rebuild evidence is not
    authenticated provenance.
  required_ci:
  - All32 exact final-head target checks successful, preserving original baseline names and multiplicity;
    full canonical control validation on planning and closure.
  manual:
  - None inside this software batch. Final owner stage retains all bench, engine, independent human, controlled
    performance, production signing/release/deployment acceptance.
risk:
  class: moderate
  hazards:
  - An unproven cause, retry pass or instrumented timing result is mistaken for a repair or qualification.
  - A change weakens an old assertion, deadline, ABI/default or prior evidence.
  stop_conditions:
  - A new public API/ABI/schema/default-policy decision or path outside the activated cause-specific scope
    is needed.
  - Credible completion requires a bench, licensed engine, live endpoint, independent human judgement,
    production key or release/deployment action; retain that item for the final owner stage.
rollback:
  strategy: Revert only this batch changes and additive wiring; preserve predecessor implementations,
    immutable evidence and every final-stage obligation.
evidence:
  output:
  - docs/evidence/M28-05-<date>.md
  - Exact source/tree, commands, raw failures/results, source hashes, risk review, final-head CI and guarded
    merge/closure receipts.
  claim_boundary: Portable software only. Investigation can classify an unresolved result without claiming
    it passed. Global qualification, independent human acceptance and production release remain separate.
