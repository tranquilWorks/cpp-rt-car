acceptance:
- Preserve immutable M26-01 contract/digest, integer model/state/channel/control identities and default
  workload. Preserve all prior kits, oracles, tests, provider/framework/schema/validator sources, Runtime/native
  backends, ABI8/70exports/fingerprint0xd0e7a5a14bf35f97/SONAME8/deviceABI1/RuntimeConfig schema7/default
  layouts and support claims. New source-owned adapters or provenance-bound derived copies may expose
  the already frozen experiment values without modifying prior files. Default-equivalence/full-state/count/cleanup
  comparisons remain mandatory.
- Register rtfw.golden provider version1 through the unchanged public M23 ProviderV1 API with exactly
  the fifteen frozen case IDs/subsystems. Two warmups and five measured repetitions retain every raw sample,
  at most16 parameters/counters, actual complete correctness/status/cleanup observations and canonical
  workload/configuration identity. Metadata discovery is side-effect-free. Subsystem cases exercise their
  named behavior and declare enclosing Runtime, observation, oracle, lifecycle or external-process work
  included in timing; do not relabel identical whole-loop invocations as isolated subsystem measurements
  or manufacture counters. Fake-clock structural fixtures and steady-clock portable characterization remain
  distinct; no controlled performance or optimality claim.
- Cover the actual CPU, owned simulated CUDA kernel/Graph, owned simulated XDMA, and combined host-staged
  variants, native and independent host execution, plus a real external vector CIL controller process.
  Reuse actual Runtime and native HAL backend operations, full-state C++/Python oracles, checked cleanup,
  original-owner replay and compatible paired fresh-owner recovery. Do not rewrite replay identity, substitute
  a local function for an external peer, hide setup/teardown in an isolated timing claim, or silently
  fall back to a different variant. Physical resources are never auto-probed.
- 'Publish a finite machine-readable inventory and source-linked guide for all thirteen frozen levers
  and every frozen value: workers, grain, rate_multiplier, budget_percent, queue_slots, scratch_bytes,
  device_depth, cuda_graph, transfer_batch, staging_slots, telemetry_capacity, control_burst and overload_policy.
  Exercise actual public-API/scenario behavior for the applicable experiment, retaining requested/effective
  values, complete configuration identities, admitted/rejected/failed outcomes and counters. Keep logical
  work and oracle constant for numerical comparisons. If a lever needs a separate bounded public-API experiment
  or is incompatible with a variant, label that scope/limitation explicitly and reject incompatible full-loop
  combinations before effects; do not report catalog membership as successful application, silently clamp
  values or claim an isolated probe tuned the full loop. Structural changes use fresh owners/identities;
  low-capacity failures remain visible.'
- 'Run and aggregate all eleven frozen fault campaigns with actual phase/tick injection, bounded detection,
  exact status/safety/publication/control sequence/replacement/gap/cleanup and documented continuation,
  retry or fresh-owner recovery. Implement the remaining telemetry_loss campaign at the frozen telemetry
  boundary: actual capacity pressure and exact lost-record accounting invalidate replay before side effects;
  distinguish disabled/unavailable telemetry from a measured gap, and recover using a fresh owner. Preserve
  safe8ms logical/backend and explicit simulator5s watchdog, all original fault/control oracles and failed
  outcomes. Cover control bursts1/16/17 with accepted/replaced/rejected counts, exact boundaries and sequence
  conservation.'
- Keep declared Runtime/worker/provider steady execution bounded with zero ordinary/aligned heap allocation
  and positive controls; benchmark/manifest orchestration and public M23 observation vectors remain explicitly
  off lane. Borrowed buffers/jobs/drivers outlive all accepted work and failed checked stop; finite retries
  preserve ownership and error status. Exercise multiple independent owners, lifecycle/queue/cancel/retention
  and malformed input without global registries or hidden background work.
- Produce independently validated report, faults and coverage artifacts alongside unchanged valid M23
  descriptor/raw/summary bundles and source-linked run/state/replay evidence. Bind contract/configuration,
  source commit/tree/dirty state and exact shipped file hashes, host/compiler, clock/evidence kind, variant,
  request/effective settings, raw observations and cleanup. Reject missing or foreign source/config/state/result,
  fabricated backend or phase counts, false replay eligibility, omitted failed attempts, corrupt checksums,
  checksum-repaired state/counter mutations and incompatible comparisons. Offline validation must derive
  expected behavior rather than trust a PASS field. Report capability coverage only for this showcase;
  CAP-M26 closure remains M26-06.
- Ship a complete optional benchmark-enabled public-SDK source kit and one-command build/run/validation,
  with copied sibling dependencies and exact provenance. Test actual CPack extraction after removing original
  prefix, custom include/data paths with spaces, installed target consumption and source embedding, every
  prior SDK consumer, external process operation, absent benchmark component and missing source/header/executable/provenance/state
  negatives. Keep default Runtime package isolation and existing optional benchmark exports unchanged;
  no new compiled public API is required.
- Run frozen contract/config/Python checks; meaningful provider, scenario, lever, fault/control/telemetry/replay/allocation/concurrency/process/artifact
  negatives; ASan/UBSan/leaks and TSan; Clang14 static analysis; contract/quick/full and actual relocated
  package gates. New tests join existing compiler/sanitizer/package/allowed docs CI without editing protected
  ci.yml, weakening earlier tests or changing prior timeouts. Require all32 exact final-head target records
  with M26-04 names/multiplicity, clean/head/base/no-unresolved-review guards and fetched tested-tree
  equality. Retain each failure, retry, API error and source correction with exact identities.
- Complete agent risk review, scoped target integration and canonical M26-05 closure, then report M26-06
  as remaining software audit. Preserve known M23 timing-sensitive benchmark, R4 startup cleanup-status
  fixture and Windows experimental determinism findings as separately scoped follow-ups; do not repair
  protected files in this batch. Human first-use, physical CUDA/XDMA/HIL, RT1/RT2, controlled performance,
  Unreal, signing/release and deployment remain separate and unperformed without named evidence.
validation:
  local:
  - python3 tools/check_golden_contract.py
  - python3 tools/generate_golden_config.py --check
  - python3 -m unittest discover -s tests/golden_system -p "test_*.py"
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - Benchmark-enabled build and focused new showcase CTest cases, exact commands retained in evidence.
  - python3 tests/golden_showcase/verify_package.py --work-directory build/m26-05-package
  - Explicit new showcase ASan/UBSan/leaks/TSan, allocation positive/negative, Clang14 static and manifest
    negative commands retained in evidence.
  - git diff --check
  focused_tests_to_add:
  - Exact fifteen-case provider discovery/invocation/results with full-state and lifecycle oracles.
  - All frozen lever values with actual requested/effective behavior, compatible/incompatible configurations
    and no silent fallback.
  - Eleven faults including exact telemetry loss/replay refusal; control burst/sequence/replacement, recovery
    and owner isolation.
  - Native/host/real external process, source-bound report and false-evidence rejection.
  - Optional benchmark-enabled relocated CPack complete SDK/embedding and missing component/dependency
    negatives.
  required_ci:
  - All32 exact-head records successful with exact M26-04 names/multiplicity; no target/local functional
    waiver.
  - Existing compiler/FMA/sanitizer/SDK/package jobs plus additive allowed docs checks exercise new portable
    coverage; protected ci.yml remains unchanged.
  manual:
  - M25 unfamiliar-consumer and independent human ownership review remain UNPERFORMED.
  - Physical/RT/controlled-performance/Unreal/signing/release/deployment require separate named evidence/authorization.
risk:
  class: high
  hazards:
  - Mislabeled whole-loop timing or synthetic counters masquerade as subsystem performance.
  - Requested tuning values never reach the actual public API or changed workloads are compared as identical.
  - Telemetry gaps or rejected controls are omitted and invalid replay is advertised as valid.
  - Failure/cleanup status is lost while borrowed backend or external-process resources remain live.
  - Installed kit depends on private source or benchmark component leaks into default Runtime exports.
  stop_conditions:
  - Runtime/native/public ABI/schema, frozen semantics or protected prior code requires a separate bounded
    amendment/repair.
  - A prior test/assertion/deadline or mandatory gate would need weakening.
  - A material unresolved product decision or physical/privileged/signing/release action is required.
rollback:
  strategy: Revert only the new showcase kit/tests/docs and additive build/install/validation wiring;
    preserve all integrated prior kits, repairs, providers/framework, ABI/defaults and evidence.
evidence:
  output:
  - docs/evidence/M26-05-<date>.md
  - Acceptance mapping, exact commands/results/source/canonical identities, retained raw benchmark/report
    and failed/retried evidence, agent risk review and guarded integration records.
  claim_boundary: Portable actual Runtime and owned simulated native-driver protocol/benchmark evidence;
    fake-clock structural versus steady-clock characterization explicit. No physical/HIL/RT/controlled-performance/human/Unreal/CAP-M26
    closure or release/deployment qualification.
