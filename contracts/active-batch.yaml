acceptance:
- Select the integrated M26-03R DeviceRateSimulationPolicy with an explicit finite five-second host watchdog
  only for the new sample-owned deterministic SimulatedDriver adapter. Preserve the frozen one-millisecond
  logical completion budget and backend command timeout; use the existing concurrent-safe injected session
  clock. Native/real CUDA construction must leave simulation policy absent and replay disabled. Keep Runtime/backends/default
  semantics and all repair tests/evidence unchanged. Reconcile preserved draft277 with the exact repaired
  baseline before feature verification.
- Preserve the immutable M26-01 JSON/digest, fixed SoA/initialization/integer arithmetic, eight logical
  phases, five rate domains/envelopes, five CPU channel identities, exact controls and independent C++/Python
  state oracles. Only physics becomes a real Runtime device-command-batch phase in the new variant; input
  stages bounded data and the existing stage publishes only after terminal success. Logical sample/scenario/control
  identities remain comparable; Runtime graph/config/replay identities correctly distinguish CPU and device
  variants. Cross-variant artifacts must be rejected, never rewritten.
- Use installed public Runtime/CudaDeviceBackend/HAL-v2 APIs and M24 owned stream, buffer, kernel/Graph
  and checked-stop patterns. A separate new source kit may derive copies with provenance; every existing
  M24 kit/test remains unchanged. Declare fixed host staging, caller-owned device storage, ordered H2D/kernel-or-Graph/D2H,
  explicit buffers/access/dependencies and same-backend timeline, one bounded physics in-flight slot and
  actual active device-rate binding. Preserve all rate envelopes by deriving a completion budget inside
  the plant envelope; distinguish logical simulation time, bounded driver completion and physical deadlines.
  No direct GPU/FPGA path or fake sampled HAL channel.
- Provide CPU fallback, injected-driver CUDA kernel and CUDA Graph modes in native and independent host-job
  execution, including optional actual external CIL. Verify every field/tail/count/channel selection/control
  generation each step and exact CPU/kernel/Graph parity over count1/odd/default/capacity256, bounded
  ticks through1024, worker counts and grains. Prove actual backend upload/launch/download/event/timeline
  operations and counts, no early publication, same graph under both kernel paths, bounded MemoryPlan/sample
  ownership and zero ordinary heap allocation in steady execution and supported replay.
- The native CUDA backend advertises deterministic_mock=0 and must remain unchanged. For portable replay
  only, a separately named sample-owned simulator adapter may wrap the actual native backend with a complete
  forwarding HAL table, declaring deterministic mock semantics solely for its owned deterministic injected
  driver. All accepted commands/completions still execute through the actual CUDA backend. Explicitly
  bind adapter/variant identity, prove fresh upload reconstructs device state from canonical host state
  and preserve checkpoint/timeline/control/action semantics. Test native CUDA registration rejects replay-enabled
  configuration and malformed/foreign/cross-variant artifacts reject before side effects. Never label
  physical CUDA deterministic or change public capability semantics.
- Preserve originating-owner active/trusted lossless-v2 replay and paired fresh-owner checkpoint recovery
  for the declared simulated variant. Restore canonical host state, rebuild device payload from it on
  the next admitted release, and retain exact telemetry gaps/action counts, control/admission outcomes
  and buffer/timeline identities. Retain existing CPU tests and artifacts unchanged; factoring shared
  artifact state/transcript validation is allowed only additively with all prior assertions preserved.
  Report device execution/replay metadata separately and reject false counts, fabricated backend activity,
  wrong source/configuration, mismatched state or incomplete cleanup.
- Implement the frozen M26-03 device_loss and reset_failure campaigns at tick6 with positive actual driver
  fault counters, exact device status/health, no failed completion publication, reset result and retained
  ownership. Permanent context loss rejects reset and requires checked teardown plus a fresh caller session/Runtime;
  recoverable query/launch error requires bounded reset, inject reset synchronization failure and prove
  retry/stop retains resources. Resume the successful paired checkpoint in a fresh compatible owner and
  compare the recovered result to the independent scenario oracle. Add delayed/not-ready, malformed batch/output,
  failed unregister/event cleanup retry, multiple-owner isolation and accepted-resource conservation negatives.
  Preserve earlier CPU/external fault campaigns.
- 'Expose an optional real-CUDA host using the same scenario/command graph and an actual caller-owned
  Driver API stream, device storage and compiled integer SoA kernel/Graph. Build/run remains optional:
  missing device/driver reports NOT RUN with exit3; help/compile does not access hardware. Native real
  replay is explicitly unsupported and cannot emit simulated replay PASS. Toolkit CI compiles/links the
  new host/kernel through existing enabled SDK consumers without changing protected workflow bindings;
  portable builds do not require CUDA or probe devices. Actual hardware remains NOT RUN absent a named
  accessible tuple.'
- Ship the complete new public-SDK source kit and one-command build/run/independent validation, exact
  installed inventory, source provenance and truthful per-variant artifacts. Test actual CPack extraction
  after removed original prefix, custom include/data paths with spaces, source embedding, complete prior
  SDK consumers and missing/private-path/source/artifact negatives. The prior CPU command/default installed
  SDK/header/export inventories stay compatible. Link the new guide from existing golden docs and preserve
  all historical evidence bindings.
- Run focused numerical/parity/rate/device/control/replay/fault/allocation/concurrency/process tests,
  supported ASan/UBSan/leaks and TSan, Clang static analysis, generated contract checks, explicit contract/quick/full
  and all32 exact-head hosted records with M26-02 names/multiplicity. Add coverage through existing target
  dependencies/filters and allowed docs CI, not the protected ci.yml. Retain every failure/correction
  and exact head/tree/canonical/merge evidence, agent risk review and limitations. Close only M26-03;
  XDMA/combined, benchmark showcase/final audit and all human/physical/RT/Unreal/performance/release gates
  remain separate.
validation:
  local:
  - python3 tools/check_golden_contract.py
  - python3 tools/generate_golden_config.py --check
  - python3 -m unittest discover -s tests/golden_system -p "test_*.py"
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ctest --test-dir build/agent-quick -R golden --output-on-failure
  - python3 tests/golden_cuda/verify_package.py --work-directory build/m26-03-package
  - ./scripts/agent-verify.sh full
  - Focused CUDA golden sanitizer/leak/allocation/static and optional toolkit compile/help commands recorded
    in evidence.
  - git diff --check
  focused_tests_to_add:
  - Exact CPU/kernel/Graph parity with actual active CUDA backend dispatch and immutable sample state/control
    identities.
  - Declared simulated replay, native replay rejection, checkpoint/timeline recovery and false artifact
    negatives.
  - Actual driver loss/reset failure, delayed completion, no publication and borrowed resource retention/retry;
    concurrent isolation and zero allocation.
  - Native/host/external modes, relocated CPack/full SDK/source embedding and optional actual CUDA host/kernel
    compile/help.
  required_ci:
  - All32 exact-head target records successful with exact predecessor names/multiplicity, no unresolved
    review thread and fetched merge tree equal tested tree.
  - Add portable CUDA golden coverage to existing compiler/FMA/sanitizer/package/toolkit targets without
    removing previous checks or modifying protected ci.yml.
  manual:
  - M25 unfamiliar-consumer and independent ownership review remain UNPERFORMED unless actually obtained.
  - Physical CUDA requires a named actual device tuple; absence is NOT RUN. No physical XDMA/HIL, RT1/RT2,
    controlled performance, Unreal or release/deployment qualification.
risk:
  class: high
  hazards:
  - Simulator capability declaration misrepresented as native/physical CUDA replay support.
  - CPU oracle or hidden direct submit replaces actual Runtime CUDA execution.
  - Failed device work publishes host output or caller resources die before terminal cleanup.
  - Checkpoint restoration leaves device/timeline/control state stale or hides telemetry loss.
  - Optional toolkit/install wiring alters prior evidence bindings or mandatory SDK inventory.
  stop_conditions:
  - Frozen semantics or public Runtime/backend/ABI changes require a separately bounded canonical repair/amendment.
  - A forbidden file, prior assertion, mandatory gate or timeout would need weakening.
  - Absent physical/privileged/signing authority or a new material product decision becomes required.
rollback:
  strategy: Revert only the new CUDA golden kit/tests/tools/install wiring and configuring-only sample
    extension, preserving immutable scenario, all CPU default behavior, prior tests/kits/evidence, Runtime/backends/public
    SDK/ABI and support claims.
evidence:
  output:
  - docs/evidence/M26-03-<date>.md
  - Exact numerical/backend/control/replay/fault/resource/package/sanitizer/full/hosted commands and acceptance
    mapping.
  - Canonical/control/target head/tree/check/merge identities and all failed/retried evidence.
  claim_boundary: Portable injected-driver Runtime CUDA software and optional real-host compile evidence
    only. Declared simulator adapter is not native CUDA determinism. No physical/RT qualification, XDMA/combined
    integration, benchmark showcase, CAP-M26 closure, Unreal or release/deployment claim.
