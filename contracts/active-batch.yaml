acceptance:
- 'Start from the exact clean merged target baseline recorded in sources. M23-02 provider PR #252 and
  discovery correction PR #253 must be integrated, with the correction exact-head mandatory CI passed.
  Preserve the original M23-02 failures and absent review records as historical facts. This canonical
  contract must itself pass validation and be integrated before target activation; bind the actual integrated
  canonical revision/blob without rewriting the audited planning baseline.'
- Register one instance-local ProviderV1 with ID rtfw.runtime, implementation version 1. Use only installed
  rt/runtime.hpp, rt/config.hpp, rt/loopback_backend.hpp, rt/live_control.hpp and rt/observability_export.hpp
  plus rtfw/benchmark.hpp and standard-library dependencies. Do not include Runtime private/detail headers
  or experimental rt/watchdog.hpp, core rate governors, test helpers, SimCore, vendor drivers, CUDA or
  XDMA. Small benchmark-owned helpers may reproduce public-surface fixture setup with independent oracles;
  do not turn the existing conformance test into the measured implementation.
- Discovery is a finite sorted catalog in bench/fixtures/runtime_cases.json, maximum 96 cases, 16 parameters
  and 16 counters per descriptor, two warm-ups and five measured repetitions. Every row declares family,
  geometry, configured limits, operation units, independent oracle, included work, clock semantics, counter
  aggregation and evidence boundary. CLI lists exactly self plus CPU plus the new catalog; update both
  legacy artifact and CPU inventory assertions to this exact union without disabling any previous test.
  list/describe are metadata-only; validate all arguments and destination before preparing only the selected
  provider.
- Preserve ProviderV1, runner implementation, all benchmark schemas and the artifact validator. rtfw::benchmark
  stays independent of Runtime. The new provider is compiled internally for the optional CLI but shipped
  only as source examples, with no compiled public target or ABI. Default benchmark-OFF SDK inventory,
  existing self/CPU/external providers, immutable CPU cases and their artifacts remain unchanged.
- Timing is the unchanged runner duration around the complete invoke callback. Prepare steady fixtures,
  fixed storage and explicit workers before Runner::run and finish checked cleanup before publishing a
  success bundle. Subsystem-call cases may time an actual public inspector, staging, checkpoint, replay
  or export call plus declared verification; disclose any reset/restore/drain included inside invoke.
  Complete-frame cases include Runtime::step or run_periodic and declared observation collection. Lifecycle/capacity-finalization
  cases include construct/configure/finalize/inspect/teardown. Never claim isolated boundary publication,
  compiler, device hardware or watchdog service latency from a whole invocation, subtract hidden overhead,
  or introduce a second measurement clock.
- Use deterministic injected RuntimeClock values for logical releases, deadlines, shedding and watchdog
  triggers. Clock state shared with Runtime-owned lanes is atomic and bounded. This is a simulation control input, separate from the runner measurement clock; declare it
  in every affected descriptor. Benchmark fake clocks label structural_fixture; runner steady clocks label
  portable_characterization of that declared synthetic workload. No sleeps, physical timing assumption
  or elapsed pass/fail threshold is permitted.
- CPU release cases cover reference inspection and actual active dispatch at 8 and 64 releases per declared
  complete host-frame window, one and four domains, and substep factors 1 and 4 where admitted. Enumerate
  immutable release identities and compare with an independent integer half-open-window oracle including
  first/repeating supercycles. Actual callbacks must reconcile attempted/completed/rejected releases,
  phase counts, exact ordinal advancement and an independent integer state digest; a reference-only plan
  is never reported as executed dispatch.
- Device release cases use the installed deterministic SampledIoLoopbackBackend through actual Runtime
  HAL-v2 command-batch rate binding, submission/service lanes and exact terminal completion, at 2 and
  8 releases with configured in-flight points 1 and 4. Include CPU-to-loopback-device-to-CPU dependencies,
  bounded host-visible registered buffers, exact backend-local generation/timeline ownership and command/provider/completion
  counts. Logical windows and completion budgets are chosen conservatively for admitted portable simulated
  work. Failure must retain ownership until checked stop. Results are simulated Runtime device dispatch,
  not physical device throughput; general backend/copy pipelines remain M23-04.
- Cross-rate cases cover immutable selection inspection and complete-frame publish/copy for fast-to-slow
  and slow-to-fast CPU channels and both CPU/device directions. Use 8-byte and 256-byte canonical synthetic
  payloads, representative channel counts 1 and 8, and exact initial/fresh/held/stale outcomes. Independently
  calculate producer release/substep, generation, timestamp domain, payload digest and consumer selection
  over a complete supercycle and its repetition. Failed or late device completion cannot publish a successful
  new sample. Never substitute a declared transfer count for observed successful copies.
- Optional-shedding cases drive deterministic late/on-time streaks with RuntimeClock and supported RateExecutionPolicy
  at two hysteresis points 1 and 3, with mandatory work and at least two differently ranked optional domains.
  Check the exact shed/recovery order, threshold transitions, optional callback absence/presence, mandatory
  completion, bounded catch-up/skip results and public rate counters/actions. Include a complete-frame
  sequence and a separate action/counter read scope. Do not benchmark an experimental standalone governor.
- Live-control cases cover host-frame and exact compiled-rate targets; one and multiple mailboxes/producers;
  8-byte and 256-byte canonical synthetic values; accepted publication, same-kind replacement, full reject-new,
  invalid payload/target, stale generation and post-stop admission outcomes. Use actual stage_live_control_update,
  copied payload ownership, callback-local whole generation reads and status/counter inspection. Measure
  admission/drain transaction and complete-frame publication scopes honestly. Check immutable old-or-new
  payloads, exact accepted/rejected/committed/replaced counts, ordinal isolation across warm-ups, and
  callback failure restoring the previous Runtime-owned generation. No application/backend/physical side-effect
  rollback claim.
- Checkpoint cases use registered canonical synthetic state at 64 and 4096 bytes, preallocated exact/short
  output buffers, write/inspect/restore and unchanged bytes on rejected input. Replay covers ordinary
  input-log replay, mixed-rate active replay with deterministic loopback, and live-control replay with
  explicitly retained synthetic payloads, at 2 and 8 frame records. Compare final registered state, replay
  result counts, exact input/application observations and logical action identities independently. Include
  corrupted/truncated/identity-mismatched input rejection before restore and unchanged preexisting state.
  Replay/reset inside invoke is included in the descriptor timing scope; artifacts are host-owned in-memory
  inputs and never parsed on a callback lane.
- Runtime watchdog/degradation cases cover disabled, below-budget and deterministic expiry at configured
  degradation limits 1 and 3, using RuntimeConfig and the public frame/periodic API with an injected logical
  clock. Verify one watchdog event per expired frame, degradation publication on the frame owner after
  callbacks, observed prior-level callback values and saturation at the declared cap. Timings include
  complete frames and existing declared Runtime watchdog resources, not a new benchmark watchdog thread
  or the experimental Watchdog helper.
- Telemetry cases cover emission through actual Runtime frames with trace capacities 0, 16 and 1024, plus
  public cumulative/interval snapshots, bounded trace reads and non-RT write_observability_json to caller-owned
  bounded sink storage. Check exact event/metric schema IDs, operation/frame counts, interval cursor advancement,
  overwrite/drop/gap accounting and foreign cursor rejection. Exercise short/failing export sinks without
  committing either cursor, then successful recovery. Rate, mixed-rate and live-control action reads remain
  distinct public streams; do not add them to the unchanged global schema-2 exporter or emit payloads,
  pointers, host paths, handles or private identifiers.
- Full configured-capacity cases are mandatory and independently labeled from absolute-limit validation.
  Exercise an admitted CPU dispatch window with its configured release budget fully used and the next
  window rejected or bounded by the public policy; a configured device in-flight limit 4 with exact outstanding/completion
  recovery; 256 channels with bounded 8-byte payloads; control queues filled to all 65536 records across
  64 mailboxes and 256 producer declarations using minimal canonical payloads, plus reject-next and full
  publication/reclamation; and a separate 65536-byte payload case. Representative checkpoint/replay capacities
  of 64 state records/4096 payload bytes and 64 input records, and trace/action rings at configured 1024
  records, must be fully populated/read and overflow tested. Do not combine these maxima into one uncontrolled
  Cartesian workload.
- Absolute-bound configuration cases explicitly cover 64 rate domains, 64 substeps, inclusive 65536 reference
  releases and rejection at 65537, channel limit 256, and the control mailbox/producer/record/payload
  constants above. Reference capacity is compile/inspect evidence unless dispatched; action/selection
  capacity constants and 1 GiB artifact/storage caps are validated with checked arithmetic and reject-before-allocation
  boundary tests where physical commitment is unnecessary. Report configured maximum, absolute boundary
  checked, and executed occupancy separately. A 1 GiB format limit is not evidence of a 1 GiB benchmark
  or a universal maximum-capacity certification. Bound each fixture to at most four CPU workers, one loopback
  backend, 512 MiB declared Runtime memory budget, 16 MiB retained artifact storage and 65536 actual releases
  or admissions per invocation.
- 'Add at least two complete-frame composition cases: a nominal CPU producer/loopback sensor/CPU consumer
  graph with cross-rate holds, live-control update and telemetry; and the same logical workload with scripted
  optional shedding/control rejection/watchdog degradation followed by checkpoint and deterministic replay
  closure. Use small representative and full configured workload points. Counter columns distinguish phases/releases/frames/admissions/copies/bytes
  and never add different operation units. Compare independent synthetic state, observed counts, fault
  outcomes and settled cleanup; no golden production vehicle model is introduced.'
- Warm-up and measured totals remain disjoint; stateful providers advance exact legal frame/release/producer
  ordinals or declare full reset work, and each run starts with independent storage/cursors. MemoryPlan
  values are logical gauges, not RSS, residency or peak measurements. Record public counters and actual
  output digests only; no fixed-counter replacement of scheduler-dependent, pointer-derived or platform-size
  observations for byte equality. Canonical cross-toolchain fixtures select a deterministic host/CPU-only
  case with fixed identity and only portable counters; separately verify simulated device and watchdog
  structure without equating nondeterministic wall durations.
- All Runtime workload callbacks remain bounded, allocation-free and nonblocking. Preallocate callback
  payloads, state, handles and action buffers before start; runner observation vectors, encoding, replay
  artifact preparation and JSON stream export are explicit host operations outside guarded Runtime lanes.
  Check no allocation on affected Runtime steps/callbacks using a focused consumer. Independently owned
  providers and Runtime instances pass bounded concurrent isolation under TSan; joined owners retain borrowed
  clocks/backend/buffers until all accepted work terminates and checked stop succeeds. A cleanup failure
  is an error and cannot publish a successful artifact or free live borrowed state.
- Installed-source, add-subdirectory, non-default-prefix and archive-relocated consumers compile the new
  provider using only public benchmark/runtime targets. A new runtime_consumer wrapper first invokes the
  unchanged CPU wrapper, which invokes the unchanged original M23-01 wrapper; append the new package and
  artifact checks without replacing any previous coverage. Normalize paths portably for MSVC. Expand the
  optional source-example exact ledger and release hashes for every new installed file, with no extra
  default target/header or Runtime dependency on the standalone runner.
- Retain all existing Linux GCC11/Clang14 Debug/RelWithDebInfo ASan+UBSan, Windows MSVC, GCC TSan, Clang14
  portable assurance, deterministic compiler/FMA artifact exchange, package isolation, C ABI/export/SONAME,
  no-allocation, documentation and scaling/autotune gates. Add every new case and installed-source fixture
  to hosted verification. Local focused and official full profile, exact changed-path review and evidence
  mapping are mandatory. Initial failures remain evidence; do not weaken thresholds/assertions, remove
  tests, fabricate gates or repeatedly rerun an unexplained failure until green.
- Preserve Runtime/public/private implementation, stable C ABI v8 exact 70 exports/fingerprint 0xd0e7a5a14bf35f97,
  SONAME 8, device ABI v1, extension ABI v1, HAL tables, Runtime statuses and MemoryPlan equations, all
  profile/checkpoint/replay/action/control/observability schemas, benchmark framework and validator, release
  1.2.1, Apache-2.0, support matrices and prior evidence. A public Runtime defect or missing observation
  that prevents acceptance requires a separate repair contract and reproducer. No private instrumentation,
  fabricated work or silent family omission is permitted.
- Update target governance/current state/handoff/docs/roadmap, static source and release digest ledgers,
  exact executed commands/status, accepted inventory, package artifacts and CI/review identifiers. M23/CAP-M23
  remain incomplete pending M23-04 and M23-05. Thresholds/comparison/noise policy, real devices, physical/RT/HIL,
  Unreal, M24-M26 implementation, signing, release and deployment are outside this batch.
validation:
  local:
  - git status --short --branch
  - git rev-parse HEAD
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - cmake -S . -B build/m23-runtime -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=OFF
    -DRTFW_BUILD_BENCHMARKS=ON -DSIM_SANITIZERS= -DSIM_WERROR=ON
  - cmake --build build/m23-runtime --parallel 2
  - ctest --test-dir build/m23-runtime --output-on-failure
  - ./build/m23-runtime/tests/simcore_tests --gtest_filter=BenchmarkRuntime.*:BenchmarkCpu.*:BenchmarkContract.*:BenchmarkRunner.*:BenchmarkArtifacts.*
  - python3 tests/benchmark_fixtures/test_runtime_cases.py --cli build/m23-runtime/bench/rtfw-bench --inventory
    bench/fixtures/runtime_cases.json
  - python3 tests/benchmark_fixtures/runtime_consumer/verify_package.py --work-directory build/m23-runtime-package
    --artifact-output build/m23-runtime-package-external-artifact --cpu-artifact-output build/m23-runtime-package-cpu-artifact
    --runtime-artifact-output build/m23-runtime-package-runtime-artifact
  - ./scripts/agent-verify.sh full
  - python3 tools/check_c_abi.py --library build/m23-runtime/librtfw.so
  - readelf -d build/m23-runtime/librtfw.so | rg 'SONAME.*librtfw.so.8'
  - ./scripts/verify-portable-assurance.sh --build-dir build/portable-assurance --source-commit "$(git
    rev-parse HEAD)" all
  - git diff --check
  focused_tests_to_add:
  - Exact three-provider finite discovery, descriptor bounds, source catalog equality and metadata-only
    preparation; preserve all legacy privacy/malformed/destination/self/CPU checks.
  - Independent complete-supercycle CPU/device release oracle, cross-rate initial/fresh/held/stale payload
    identities and late/failing completion nonpublication.
  - Hysteretic optional shed/recovery ordering; host/rate control publication/replacement/full/invalid/stale/stopped
    admission, rollback and reclamation.
  - Checkpoint/input/active/live-control replay round trips, corruption rejection before restore, exact
    state/input/action counts, short output and explicit trust boundary.
  - Runtime logical watchdog/degradation transitions and cap, trace/action loss/gaps, interval cursors
    and transactional failing JSON sink.
  - Representative and full configured occupancy, declared absolute bounds and rejection, truthful compile-only/checked-arithmetic
    versus executed maximum distinctions.
  - Complete-frame nominal/fault composition, no-allocation callbacks, checked teardown before publication,
    legal ordinal reuse, multiple Runtime/provider isolation and TSan.
  - Unchanged prior artifact bytes and CPU schema, fixed-identity new CPU-only artifact exchange, optional/default
    package/relocation/embedding and exact source ledger.
  required_ci:
  - Existing Linux GCC11/Clang14 Debug/RelWithDebInfo ASan+UBSan matrices and Windows MSVC matrices, plus
    optional CPU provider build and every deterministic case.
  - Existing GCC ThreadSanitizer job including CPU provider isolation, host adapter queue, nested work,
    independent Runtime ownership and prior executor/memory/control tests.
  - GCC/Clang FMA determinism exchange plus MSVC deterministic fixed-identity host-adapter fixture; native
    scheduler observations and platform resource sizes excluded from byte equality without falsifying
    counters.
  - Default and optional installed/add-subdirectory/archive-relocated/non-default-prefix package checks,
    unchanged C ABI export/fingerprint/SONAME and release digests.
  - Documentation contract, Clang14 portable static/fuzz/artifact assurance, dependency review, scaling/autotune
    and all prior no-allocation and compatibility gates.
  - Run every rtfw.runtime case with unchanged offline artifact validation; new fixed-identity fixture
    is exchanged across GCC, Clang, FMA modes and the MSVC installed-source consumer.
  - Add BenchmarkRuntime cases to the existing sanitizer and no-allocation coverage without changing existing
    gates or experimental test policy.
  manual:
  - Review public-API-only fixture ownership, observed operation/counter oracles, honest call/frame/lifecycle
    timing, logical clocks, maximum-capacity claim distinctions, replay trust/privacy, non-RT export,
    checked teardown and package/ABI compatibility. Record actual review status; standing authorization
    does not manufacture a human review.
  - Controlled-host thresholds, physical/RT qualification and signing/release are separate future gates;
    no such evidence is inferred from this portable provider.
risk:
  class: high
  hazards:
  - Reference plans, declared capacity or constants are reported as completed Runtime work; substituted
    observations conceal a missing family.
  - Whole-invocation setup/reset/inspection costs or synthetic logical clocks are mislabeled isolated
    subsystem or physical timing.
  - Control/replay warm-up contaminates ordinals, cursors, registered state or measured totals; replay
    accepts partial corrupt state.
  - Benchmark callbacks allocate, export or parse; borrowed backend/payload/clock storage dies before
    accepted work or checked cleanup.
  - Absolute 1 GiB limits create unnecessary resource exhaustion or are mislabeled executed maximum occupancy.
  - The new CLI inventory breaks existing self/CPU tests or the optional source ledger silently drops
    package checks.
  - Telemetry, replay inputs or diagnostics expose payloads, addresses, paths or identities; portable
    observations promote support or thresholds.
  stop_conditions:
  - The predecessor correction is not merged with exact-head mandatory CI success, target main moves without
    baseline reconciliation, or this canonical contract is not integrated.
  - A required case needs Runtime, ABI, schema, runner/validator, prior-provider or another forbidden-path
    change; retain a reproducer and plan a separate repair.
  - A public API cannot truthfully expose the required operation or timing scope; do not instrument privately,
    fabricate counters, substitute a toy loop or silently omit the family.
  - Verification requires gate weakening, an unbounded loop/wait, privileged host mutation, unsafe teardown,
    real hardware or fabricated review/qualification.
rollback:
  strategy: Revert the rtfw.runtime provider/source examples, CLI registration, new tests and optional
    package/CI/docs/digest/governance changes as one bounded batch. Restore exact prior self/CPU discovery
    assertions; merged M23-01/M23-02 and Runtime remain usable.
  data_migration: none
  release_action: No signing, release, deployment, support promotion, controlled threshold approval or
    repository-setting change.
evidence:
  output:
  - docs/evidence/M23-03-<date>.md
  - Canonical revision/blob, target baseline/head/tree, acceptance-to-case/test map, exact commands and
    passed/failed/blocked/unperformed results.
  - Finite catalog with configured/absolute/executed capacities, honest timing scopes, independent release/payload/state
    oracles, observed counter formulas and warm-up isolation.
  - Validated fake/steady artifacts, fixed-identity cross-toolchain bundle, no-allocation/sanitizer/isolation
    and fail-closed cleanup records.
  - Default/optional SDK source ledger, installed/relocated/add-subdirectory artifacts, ABI/SONAME and
    unchanged Runtime/framework/schema/prior-evidence hashes.
  - Actual hosted CI run/job IDs and actual review state, retained historical failures and unperformed
    physical/control-host/RT/release gates.
  - Verified recovery Git bundle, exact published source/PR identifiers and baseline-relative patch before
    session exit.
  claim_boundary: Only executed portable RT0 structural/characterization for declared public Runtime rate/control/replay/watchdog/telemetry
    workloads. Simulated loopback and logical-clock behavior remain explicit. No physical or isolated
    hardware timing, uncontrolled latency threshold, maximum-capacity certification beyond named exercised
    dimensions, M23/CAP-M23 completion, Unreal, signing, release or deployment.
