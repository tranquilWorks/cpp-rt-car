acceptance:
- 'Inventory every retained non-external finding after01: historical benchmark predicate; mock/native8ms
  startup -2 versus -18; Windows2024ms startup; Windows negative GPU overlap; native-frame TSan500us limitation;
  partial-runtime instrumentation; offline diagnostic warning; broader replay transactionality; experimental
  global FMA policy; application model boundary. Preserve original raw failures, workload, deadlines,
  assertions and source identities.'
- For actionable behavior reproduce the cause using bounded source-linked controls and actual supported
  OS/compiler evidence, then repair and validate it within cause-specific paths narrowed at selection.
  Investigate the original fixture scheduling and Windows observations; an unchanged retry never counts
  as a repair. Examine broader replay failure conservation and global-policy concurrency against the declared
  contracts. A provable product boundary must be made explicit and tested where applicable; a missing
  historical trace is not invented.
- 'Give each item a concrete disposition: demonstrated repair; superseded partial-instrumentation result
  with full instrumentation; characterized instrumentation/platform limitation with supported behavior
  boundaries; or explicit existing product non-goal. Historical exact causes may remain unknowable, with
  provenance limits retained, but actionable software defects cannot be relabeled final-stage work. If
  evidence cannot discharge a software obligation, report the blocker and do not claim only final-stage
  work remains.'
- Audit software prerequisites for owner procedures, including the retained non-synthetic combined-proposal
  restriction; repair any independently established stale software gate without manufacturing physical
  evidence, editing qualification matrices or weakening independent review. Application-owned physics/calibration/safety
  remain actual owner/application scope, not fictional delivered models.
- Complete focused baseline/corrected and applicable sanitizer/static/no-allocation/package/platform checks,
  exact-head full/all32 and guarded integration. Reconcile all112 requirements, all retained finding IDs
  and existing cards in the M29 overlay; preserve frozen M28 ledger/evidence. M29-03 remains separately
  selected; no bench/Unreal/human/production signing activity.
- Before implementation bind the merged canonical revision/blob to the exact refreshed main baseline.
  For planned02/03 narrow cause-specific implementation paths at selection; planning alone activates neither.
  Preserve release1.2.1 portable RT0, stable C ABI8/70 exports/fingerprint/SONAME8, device ABI1, default
  policies, license, original tests/deadlines and all historical evidence.
- 'Initial investigation isolates an unprotected process-global bool in rt/include/rt/numerics.hpp on
  FMA-enabled builds. Reproduce with complete standalone forced-FMA instrumentation, then synchronize
  existing setter/reader accesses without changing defaults or the raw bool-reference source signature.
  Preserve process-global semantics: policy changes are host-quiescent; no per-owner policy isolation
  claim. Test same-policy concurrency and observable mixed-policy limitation. No unrelated numerics change.'
- Add source-linked bounded original-fixture scheduling and GPU overlap controls, exercised on Linux and
  actual hosted Windows inside existing check names. Preserve all original 8ms/2s/500us/overlap assertions
  and test files. Controls distinguish pending cleanup and host scheduling from guaranteed physical timing;
  unknown historical causes remain unknown.
- 'Audit M17-06 capability repair and original M17-05 gate. If confirmed stale, remove only the unconditional
  non-synthetic-combined rejection in tools/qualification.py. Explicit narrow exception to old-assertion
  preservation: replace only its obsolete M17-05-message assertion and the two associated permanent substring
  checks with cause-specific invalid-evidence and proposal-only checks. Preserve the existing forged-fixture
  refusal, all digest/reviewer/artifact/threshold checks, schemas, matrices, independent human promotion
  and original historical evidence. Add valid rebinding, tamper, rejected-review and CLI nonmutation controls;
  fixture qualification_campaign labels are parser tests, never real qualification.'
- Additional replay pre-effect malformed refusal and post-effect callback-failure controls must identify
  exact conservation/nontransactional boundaries. Any newly reproduced Runtime defect requires a separate
  cause-specific canonical amendment before production editing. Do not silently classify an actionable
  defect as a product non-goal.
- Refresh only the existing rt/include/rt/numerics.hpp SHA256 product_sources binding in docs/cuda_capabilities.json
  after the scoped FMA repair. Preserve all inventory, coverage rows, statuses and qualification claims.
