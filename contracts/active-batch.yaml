acceptance:
- 'Freeze one versioned machine-readable scenario contract and readable source-linked guide: fixed-capacity
  sample-owned SoA layout, field types/ranges/units/ownership, deterministic initialization/update/correctness
  rules, explicit numerical overflow bounds, bounded nested work partition and native/independent-host
  execution identities. Use M24 integer CPU/CUDA oracle semantics for the declared physics stage, including
  piecewise control changes; do not implement Runtime callbacks, driver variants or new SDK APIs in this
  batch.'
- Freeze the phase/resource DAG, integer base clock and CPU/device rate table with exact baseline release
  counts; timestamped sampled channel payload/selection/age/safe-output rules; explicit host staging and
  backend-local timelines. Bind live-control schemas, bounds, capacities, exact boundary ordering/generation/reset
  and trusted checkpoint/replay identity. Resolve reference defaults using existing public contracts and
  identify consumer-owned lifecycle versus Runtime guarantees.
- Freeze a fault matrix with deterministic injection points, observable outcomes, bounded detection/recovery/checked-stop
  rules and owning future batch. Cover overload, stale input, underflow/overrun, device loss, rejected/replaced
  controls and reset/recovery. Freeze telemetry and M23 subsystem/end-loop case identities, bounded tuning
  levers, expected artifact fields/status and variant boundaries. All future execution remains explicitly
  planned; no scenario performance or completion result is fabricated.
- Provide a standard-library offline validator and meaningful negative tests rejecting missing/unknown
  fields, dangling/cyclic graph references, invalid rates/counts, unsafe arithmetic/channel/control bounds,
  duplicate identity, missing subsystem/fault coverage, artifact/variant overclaims and source-link drift.
  Check reproducible contract identity, independently derived arithmetic/rate/partition feasibility, and
  require explicit version/hash review when frozen content changes. Integrate these checks into existing
  local contract and hosted documentation gates without replacing any gate.
- Run full local profiles and focused contract tests; preserve ABI v8/SONAME8/device v1, default package/header
  inventory, production code, prior samples/tests/evidence and all32 exact-head target checks with predecessor
  names/multiplicity. Retain canonical/head/tree/check identities, acceptance mapping, failures/corrections,
  review/rollback and unperformed validation. No package install behavior changes in this specification-only
  batch.
- Close only M26-01 after integration and leave five later M26 batches unactivated. Preserve M25 human
  acceptance as UNPERFORMED. Physical CUDA/XDMA/HIL, RT1/RT2, controlled performance, Unreal and signing/release/deployment
  remain separate gates.
validation:
  local:
  - python3 tools/check_golden_contract.py
  - python3 -m unittest discover -s tests/golden_system -p "test_*.py"
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - git diff --check
  focused_tests_to_add:
  - Schema/identity/DAG/rate/numerical/channel/control/fault/artifact/claim mutation negatives.
  - Independent rate counts, numerical closed-form bounds and fixed-capacity partition feasibility.
  required_ci:
  - All32 existing exact-head target records successful with predecessor exact names/multiplicity and
    no unresolved review thread.
  - Existing documentation gate runs golden contract validator and negatives; no new required check name
    or removed coverage.
  manual:
  - M25 unfamiliar-consumer walkthrough remains UNPERFORMED.
  - No physical/RT/performance/Unreal/release qualification; golden scenario execution is deferred to
    M26-02 onward.
risk:
  class: moderate
  hazards:
  - A superficially complete specification contradicts existing SDK timing/ownership semantics.
  - Unchecked cross-references or arithmetic make later variants incomparable or unsafe.
  - Planned scenario or future benchmark artifacts are misrepresented as execution evidence.
  stop_conditions:
  - Production/forbidden-path changes or ABI/package changes are required.
  - Existing validation would need weakening or unresolved product requirements prevent a coherent bounded
    reference.
rollback:
  strategy: Revert additive golden specification, validator/tests and their gate wiring only; preserve
    all runtime, SDK, source kits and earlier evidence.
evidence:
  output:
  - docs/evidence/M26-01-<date>.md
  - Exact contract/full/negative/hosted results and canonical/head/tree/merge identities.
  claim_boundary: M26-01 checked design contract only, not implemented golden scenario or M26 software
    completion. M25 human acceptance and all physical/RT/Unreal/performance/release gates remain open.
