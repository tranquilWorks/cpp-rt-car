acceptance:
- Retain original Linux/Windows experimental 2/4/8-thread FMA-off failures and the M23 benchmark submission
  finding. Reproduce unchanged 1500-frame/5000-element work with exact compiler, seed, FMA and thread
  policy; distinguish fresh local reproduction, controlled causal evidence and hosted platform coverage.
  Report unreproduced or environmental causes as unresolved.
- Keep supported Runtime and experimental SimCore ownership separate. Require a deterministic baseline
  negative for each claimed repair; compare exact output/determinism and progress rather than increasing
  timeout thresholds or removing workload.
- At activation narrow implementation paths to the reproduced cause and preserve all historical tests/evidence.
  If only environmental behavior is established, retain the finding as unresolved rather than claiming
  a repair.
- Require worker initialization to finish before frame-arena reset and a dispatch to become quiescent
  before shared range metadata, chunk counters or temporary reduction storage are reused. Preserve experimental
  settings, existing tests and workload bounds. No production test hooks, Runtime changes, benchmark assertion
  weakening or fabricated attribution of every historical timeout.
- Conserve asynchronous watchdog trips through the existing atomic pending channel. Apply frame-metadata
  logging and the unchanged degradation ladder on the coordinator at a quiescent boundary, including the
  final frame; join the watchdog before dependent state is destroyed. Establish a causal baseline negative,
  preserve thresholds and existing tests, and retain unrelated process-global clock/construction limitations.
- Repair the independently reproduced experimental watchdog destructor lost wake by serializing stop-predicate
  publication with condition-variable wait through its existing mutex. Retain an actual baseline negative,
  current positive and unchanged workload repeats. This is not a supported Runtime watchdog change, a
  new phase mutex, or a claim that every historical timeout has one cause.
- Validate experimental TSC samples before exposing them to scheduling or the monotonic floor, rejecting
  backward, nonfinite, out-of-range or over-threshold values and falling back to steady time. Retain the
  existing one-millisecond drift threshold and TSC calibration/default selection. Require independently
  failing actual baseline controls for drift/poisoning and monotonic publication, plus fresh unchanged
  workload repeats; no timeout, workload or original-test weakening and no physical timing claim.
- Preserve prior completed batches/evidence and protected ABI/default/support claims. Run complete repository
  contract/quick/full plus all32 exact final-head hosted records with exact baseline names/multiplicity;
  retain failed attempts and risk review. Guard clean/head/base/review/merge-tree equality before scoped
  integration and canonical closure.
- Refresh only the existing docs/cuda_capabilities.json product_sources digest for rt/include/rt/watchdog.hpp
  after this approved experimental repair. Preserve all inventories, coverage statuses, evidence, support
  claims and every other binding. Mandatory release/source contract validation must pass.
