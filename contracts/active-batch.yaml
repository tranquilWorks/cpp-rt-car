acceptance:
- Honor existing public SampledIoChannelRegistration.ring_capacity=4 as explicit opt-in in addition to
  existing accepted2. Do not add or change public layouts, RuntimeConfig schema7, C ABIv8/70exports/fingerprint0xd0e7a5a14bf35f97,
  SONAME8, deviceABIv1, default cross_rate_snapshot_slot_count2, native capabilities or artifact wire
  schemas. Ordinary channels and all existing two-slot callers retain exact default behavior and identities.
  Public header changes are comments only.
- Validate supported bounded requests2/4, channel identity/owner/duplicates and shape before allocating
  four-slot snapshot storage. Reject0/1/3/5 and excessive requests, preserve retry/replacement and frozen
  configuration rules. Route validated per-channel counts to actual SnapshotStore allocation and use the
  same count for aggregate capacity checks, compiled descriptors, snapshot accounting and MemoryPlan.
  Existing global byte caps remain enforced. No sample-only padding, fake fourth slot, steady-state allocation,
  hidden threads or unbounded capacities.
- Preserve exact existing two-slot/default graph/config/checkpoint/replay bytes and timing/timeout/safe-ACK
  semantics. Existing sampled ring capacity participates in topology identity; prove four-versus-two checkpoint/replay
  incompatibility rejects before effects. Do not rewrite identities, histories or artifact bytes. Originating-owner
  trusted replay and compatible paired checkpoint recovery must retain genuine four-slot payload/sequence/generation
  and sampled behavior over repeated wraparound.
- Add independent regressions and installed public SDK consumer using actual Runtime sampled device endpoints
  and preserved public loopback or injected HAL. Verify two/four/mixed ordinary and sampled stores, exact
  allocated/storage/control memory deltas, complete payload/selection correctness, wraparound, delayed/stale/underflow/overrun
  behavior, safe transitions, failed-stop retention and retry, isolation and no steady/replay allocations.
  Keep all earlier fixtures/assertions/deadlines unchanged. Old-order control must fail the new four-slot
  successful-finalization assertion against unchanged baseline, without assertion edits.
- Provide malformed/replacement/foreign/frozen configuration and aggregate-byte-budget negatives, no premature
  provider ownership or publication, complete start/stop cleanup and conservation. Run focused new and
  prior sampled/cross-rate/mixed-replay/device tests, default-v1 golden and ABI gates, ASan/UBSan/leaks,
  TSan, Clang static, relocated full SDK and installed consumer. Integrate new cases through existing
  mandatory compiler/FMA/sanitizer/package filters without editing protected CI or prior tests.
- Update source-linked generated SDK docs and reviewed current release/source ledgers as needed. docs/cuda_capabilities.json
  may refresh only product_sources hashes for changed current Runtime files; preserve all capability rows,
  denominators, historical source/gate/evidence bindings and support claims. No claimed new physical qualification
  or reuse of historical evidence as proof of this repair.
- Run contract/quick/full and all32 exact-head hosted checks with exact predecessor names/multiplicity.
  Retain every failed attempt and diagnostic, risk review, clean/head/base/no-unresolved-thread and fetched-tested-tree
  merge guards. Merge repair separately, then canonically reactivate/reconcile draft279 and complete every
  M26-04 acceptance criterion with fresh gates. Repair closure is not feature or CAP-M26 closure; M26-05/M26-06
  stay inactive.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - Focused SampledIoStorage/RateDispatch/MixedRateReplay and preserved sampled/cross-rate/device suites,
    old-order negative control, default identity bytes and no-allocation/ownership/recovery.
  - ASan/UBSan/leaks, TSan, Clang static, installed/relocated full SDK consumer, ABI/default-v1 and source-linked
    docs.
  - git diff --check
  focused_tests_to_add:
  - Actual four-slot default-preserving allocation/MemoryPlan, mixed channels and repeated payload/selection
    wraparound.
  - Invalid capacity/channel/replacement/frozen/budget rejection, ownership/isolation and safe transitions.
  - Originating-owner replay, paired recovery, incompatible two/four artifacts before effects, zero allocation
    and old-order failure.
  required_ci:
  - All32 exact-head records successful with exact M26-03 names/multiplicity; no target exceptions.
  - New cases join existing compiler/FMA/sanitizer/package filters; workflows and earlier tests remain
    unchanged.
  manual:
  - No physical CUDA/XDMA/HIL/RT/human/Unreal/controlled-performance/release/signing/deployment claim.
risk:
  class: high
  hazards:
  - Four-slot selection metadata disagrees with actual allocated snapshot storage or aggregate memory
    caps.
  - Default two-slot identities/artifact bytes or ordinary CPU behavior change.
  - Malformed ring requests allocate uncontrolled storage or corrupt store indexing.
  - Replay/checkpoint accepts foreign capacity or loses generation/wrap state.
  - Failed stop or rejection frees borrowed storage before terminal ownership.
  stop_conditions:
  - Public ABI/layout/schema versioning, default capacity/timeout weakening or native backend changes
    become necessary.
  - Earlier tests/assertions/deadlines or mandatory gates would require weakening.
  - Unrelated product, physical/privileged/signing/release authority is needed.
rollback:
  strategy: Revert only opt-in storage plumbing/validation, new tests/consumer/docs and activation; preserve
    original default2 behavior, all prior evidence and feature draft279.
evidence:
  output:
  - docs/evidence/M26-04R-<date>.md
  - Exact retained positive/negative/baseline, memory/identity/replay/ownership/allocation/sanitizer/package/ABI
    commands and source/head/tree/check/merge records.
  claim_boundary: Portable bounded sampled-I/O storage only. No M26-04 execution/feature closure or hardware/HIL/RT/CAP-M26/later-batch/release
    promotion.
