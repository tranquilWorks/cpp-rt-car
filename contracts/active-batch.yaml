acceptance:
- Change only private host_runtime.cpp behavior. Preserve C ABI8/70exports/fingerprint0xd0e7a5a14bf35f97,
  SONAME8/deviceABI1, public layouts/RuntimeConfig schema7, native backends, all defaults/identities,
  exact serialized checkpoint/active/trusted bytes and MemoryPlan. No new public policy or format, native
  queue growth, deadline change or fabricated physical safety.
- After all sampled stop-time safe batches actually acknowledge, retain private completion bookkeeping
  across partial device/extension/executor/provider teardown failures. Subsequent checked stop continues
  teardown without resubmitting to already stopped workers. A failed/missing safe acknowledgement must
  remain unknown, retain the complete owner, and be retried through actual device execution. Never use
  startup/ordinary active acknowledgements as stop evidence. Block execution/reset/replay while teardown
  is pending; clear private bookkeeping on valid fresh lifecycle boundaries. Cover running/finalized/startup-failure
  and multiple backend/owner cases.
- Restore exact successful producer provenance only for produced sampled device-to-CPU frames using their
  existing fully validated sampled header, compiled endpoint/domain and saved source logical release.
  Validate frame checksum/shape/identity/status/sequence/generation/timestamp domain and checked arithmetic
  before effects. Reconstruct producer release sequence/substep, successful completion and actual saved
  device timestamp without host-clock guesses, replay identity rewriting or new device execution. Cover
  prior-cycle/held selections, fresh/same owner intermediate checkpoints and actual header clock domains.
  Preserve initial-frame and ordinary untyped channel behavior; do not infer unavailable provenance. If
  exact reconstruction cannot be proved from existing bytes, stop for a separate explicit format/design
  decision.
- New independent regressions and installed public consumer must fail unchanged baseline for both defects.
  Cover native partial shutdown/unregistration and multi-backend retry, missing-safe-ACK negative, no
  resubmission after successful stop ACK, repeated idempotent stop, actual retained resources through
  failures, unchanged clocks/budgets, isolation and ordinary allocation instrumentation with positive
  control. Preserve every previous test/assertion and repair evidence.
- Checkpoint tests cover exact full state/channel/control metadata, originating-owner replay, compatible
  paired fresh-owner continuation through the next cross-rate reads and subsequent device work, underflow/safe
  payload, held/prior-cycle data, malformed/foreign/cross-policy rejection before effects, zero allocations,
  resource conservation and exact default MemoryPlan/artifact-byte negative controls. No artifact edits
  may disguise compatibility or ownership.
- Run contract/quick/full, focused all preserved device/rate/sampled/control/replay suites, ASan/UBSan/leaks,
  TSan, Clang static, actual CPack relocated full SDK/custom paths/spaces/removed original prefix/embedding/negative
  consumers, ABI/default bytes and all32 exact-final-head target checks with exact M26-03 names/multiplicity.
  Retain all failures and risk review. Control-only completed zero-step infrastructure exception never
  waives target/local functional gates.
- Refresh only required source-linked documentation and reviewed ledgers; cuda_capabilities.json changes
  are product_sources hashes only. Separate guarded repair merge requires clean/head/base/no-unresolved-thread
  and fetched-tested-tree equality. Then canonically reactivate/reconcile feature279 and finish every
  original M26-04 acceptance with fresh feature gates. Repair is not feature or CAP-M26 closure; M26-05/M26-06
  and physical/human/RT/Unreal/performance/release work remain separate.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - Focused SampledIoRecovery/CommandBatch/RateDispatch/MixedRateReplay and preserved suites, both unchanged-baseline
    negatives, exact default bytes/MemoryPlan, actual native shutdown/fresh-owner recovery and allocation
    controls.
  - ASan/UBSan/leaks, TSan, Clang static, installed/relocated full SDK consumer, ABI/default-v1 and source-linked
    docs.
  - git diff --check
  focused_tests_to_add:
  - 'Actual sampled safe ACK followed by native partial teardown: retained ownership and no resubmission
    on retry; missing ACK genuinely retries.'
  - Produced sampled checkpoint provenance restored exactly for first/prior-cycle/held/underflow data
    and same/fresh owner continuation.
  - Malformed/foreign/default-byte/no-allocation/multi-backend/isolation and public relocated SDK controls.
  required_ci:
  - All32 exact-head records successful with exact M26-03 names/multiplicity; no target exceptions.
  - New cases join existing compiler/FMA/sanitizer/package filters; workflows and earlier tests remain
    unchanged.
  manual:
  - No physical CUDA/XDMA/HIL/RT/human/Unreal/controlled-performance/release/signing/deployment claim.
risk:
  class: high
  hazards:
  - Stop bookkeeping falsely claims acknowledgement or permits work after partial teardown.
  - Checkpoint reconstructs missing or forged producer provenance or confuses device and Runtime clocks.
  - Private state changes default allocation/accounting or versioned artifact bytes.
  - Malformed checkpoint mutates an owner before validation.
  - Earlier repairs/tests/evidence or mandatory checks are weakened.
  stop_conditions:
  - Public ABI/layout/schema versioning, default capacity/timeout weakening or native backend changes
    become necessary.
  - Earlier tests/assertions/deadlines or mandatory gates would require weakening.
  - Unrelated product, physical/privileged/signing/release authority is needed.
rollback:
  strategy: Revert only this private Runtime correction and new regressions/docs/activation; preserve
    capacity/storage repairs and feature279 with all diagnostics.
evidence:
  output:
  - docs/evidence/M26-04R3-<date>.md
  - Exact retained positive/negative/baseline, memory/identity/replay/ownership/allocation/sanitizer/package/ABI
    commands and source/head/tree/check/merge records.
  claim_boundary: Portable sampled-I/O lifecycle/checkpoint correctness only; no physical/HIL/RT/human
    or M26-04/CAP-M26/release closure.
