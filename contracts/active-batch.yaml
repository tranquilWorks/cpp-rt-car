acceptance:
  - Reuse draft238 adapters and original ten automation cases on current Runtime, not a competing scheduler/allocator design. Preserve the original exact engine tuple as the first validation target; make no fresh engine result claim.
  - Compose the existing host lifecycle Registry with fixed world-owned bindings. Keep scheduler storage, callback context and module leases alive through checked Runtime cleanup AND asynchronous engine-node retirement. Close admission, refuse stale/foreign/reentrant operations, clean independent worlds and support retries.
  - Supply actual Unreal world-init/tick/cleanup/end-frame/pre-exit delegate wiring, checked selected-extension library close/reopen and module unload guards. Do not label arbitrary Live Coding patching safe.
  - Supply a shared integer sample and opt-in engine game module, fifteen commandlet automation cases and actual two-instance/two-cycle PIE automation source. Supply strict staging, exact-tuple build/test, Development cook/package/run and Shipping compilation entry points.
  - Run real Runtime, memory, module load/unload and allocation checks here plus staging/report-negative tests and installed kit checks. Preserve existing C ABI8/70 exports/SONAME8, default SDK header/target inventory, prior tests/deadlines/workflows and runtime sources.
  - Mark current engine compilation, automation, PIE, packaging and physical/RT tests NOT RUN until actually executed. Prior draft evidence is historical and is not evidence for the reconciled source.
validation:
  local:
    - ./scripts/agent-verify.sh full
    - ctest --test-dir build/unreal-source -R 'unreal_worlds|unreal_source' --output-on-failure
    - python3 tests/unreal_source/test_prepare.py
    - git diff --check
  focused_tests_to_add:
    - Real Runtime isolated-world execution, deferred retirement, failed setup, callback failure, stale/foreign/reentry, allocation-free frames and actual library reload/unload refusal.
    - Source preparation, retained adapter inventory, complete report validation and missing-environment refusal. Actual engine automation source remains unexecuted.
  required_ci:
    - All existing standard hosted checks remain mandatory; no failing gate is waived.
    - Actual exact-tuple Unreal build/automation/PIE/package gates remain deferred and prevent engine acceptance or qualification.
risk:
  class: high
  hazards:
    - Uncompiled engine bindings may require API, lifecycle or toolchain corrections on the actual engine.
    - Runtime completion is earlier than engine scheduler task-node retirement; premature destruction or module unload would invalidate callbacks.
    - Synthetic staging reports, portable tests or old draft results could be mistaken for current Unreal evidence.
  stop_conditions:
    - A protected runtime, ABI, old test/deadline, workflow, qualification or release policy change would be required.
    - Real engine or physical qualification must be claimed without actual evidence.
rollback:
  strategy: Revert only M32 optional Unreal source/test/install wiring and current docs/hash bindings. Keep original draft238, M31 Registry, all existing Runtime and all historical evidence untouched.
evidence:
  output:
    - docs/evidence/M32-01-2026-11-03.md
  claim_boundary: Source implementation candidate and actual portable verification only. Current Unreal build/automation/PIE/package and physical qualification NOT RUN; original M19 and global software_complete/CAP-M20 acceptance remain open. Cyber remains excluded_by_owner_unsatisfied.
