acceptance:
- Ship a source-only optional shared-memory CIL kit and guide using public Runtime artifacts. Keep it
  off the mandatory runtime/library dependency graph and SDK header/export inventory. Support and test
  declared little-endian64-bit Linux GCC/Clang and Windows MSVC mappings/atomic primitives; fail clearly
  for unsupported standalone targets and keep unrelated supported Runtime builds independent. No production
  runtime/backend repair or ABI/support promotion.
- Define an exact versioned fixed-size byte protocol with explicit offsets, endianness, lengths, known
  kinds/flags/reserved fields, nonzero session generation, sequence, correlation, host timestamp domain
  and finite expiry. Provide an independently encoded golden fixture and reject malformed, truncated,
  oversized, duplicate, skipped, stale-generation, stale/future/expired and overflow records without applying
  plant input. Explain trusted same-host peer assumptions and absence of authentication/network/safety
  claims.
- Use fixed-capacity bounded SPSC channels with explicit backpressure and release/acquire publication/retirement;
  never overwrite unread or partially written payload. Steady transport and Runtime callbacks perform
  no allocation, mapping/open/close/process operations, locks, I/O, hidden thread creation or unbounded
  retries. Initialization, process orchestration and finite waits remain outside RT callbacks. Test capacity
  and no-allocation, concurrent payload conservation, sequence exhaustion and exact ordering.
- Provide checked OS mapping ownership for exclusive creation, bounded names, attachment/header validation,
  initialization-not-ready, wrong schema/extent, duplicate controller rejection, close/unlink and partial
  failure cleanup. Reconnect creates a fresh exclusive mapping and generation, never resets shared slots
  in place under a stale peer. An old live or dead peer cannot corrupt the new session; stale name/generation
  and crash-mid-publication cases must remain explicit. Detach callback endpoints before unmapping; retain
  any unresolved local cleanup resource for explicit retry.
- Ship separate actual plant and external controller executables. A public Runtime graph consumes validated
  timestamped controller inputs, advances a bounded integer plant and publishes outputs; the separate
  process computes feedback from observed plant output. Independently verify every command/state/sequence
  and deterministic final result, including concurrent isolated sessions. Separate host-issued protocol
  timestamps/expiry from finite orchestration deadlines; timeout/stale/disconnect select an explicit reference
  hold/no-apply behavior, never silently replay old input.
- Exercise real two-process shared-memory exchange on Linux and Windows through finite process supervision
  with captured diagnostics and checked exit/cleanup. Cover normal exchange, startup/attachment errors,
  full slots, malformed schema/records, delayed or missing controller, stale/expired/replayed commands,
  peer death or partial publication, reconnect with a fresh generation, orderly stop acknowledgement and
  missing acknowledgement/forced local detach. Include deterministic clock-controlled unit negatives so
  scheduler timing does not substitute for protocol assertions. TSan covers same-process shared-channel
  races; separate process tests do not claim TSan detects cross-process races.
- Install the exact source/CMake/oracle/process-runner inventory and self-contained guide with protocol
  table, ownership/lifecycle/failure rules, build/run transcripts, mapping/platform assumptions and residual
  limits. Build/run standalone find_package and source embedding from a relocated testsOFF SDK archive
  with original prefix removed, custom include/data paths and spaces. Add a separate additive package-consumer
  contract and preserve all earlier raw/typed/backend/CUDA consumers and exact public SDK inventory.
- Run full local profiles, focused strict/sanitizer/static/allocation and multiprocess checks, complete
  SDK and existing CUDA relocated/source consumers, compiled ABI, unchanged M24 capability validator,
  and all32 exact-head hosted target check records with predecessor names/multiplicity. Retain exact canonical/head/tree
  identities, acceptance/evidence mapping, failures/corrections, risk review, rollback and unperformed
  gates. Close only M25-04; M25-05 and later, human/hardware/RT/performance/release gates remain separate.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh full
  - python3 tests/cil_shared_memory/verify_package.py --work-directory build/m25-04-package
  - python3 tests/cuda_physics/verify_package.py --work-directory build/m25-04-cuda-package
  - python3 tools/check_c_abi.py --library build/agent-quick/librtfw.so
  - Focused strict wire/channel/mapping/Runtime/multiprocess/allocation tests; ASan/UBSan with leak detection,
    TSan and Clang14 static analysis.
  - python3 tools/check_cuda_capabilities.py
  - git diff --check
  focused_tests_to_add:
  - Independent wire golden/invalid/freshness/correlation/generation tests, bounded SPSC concurrency/backpressure
    and allocation instrumentation.
  - Actual separately launched controller/Runtime plant, mapping ownership, missing/dead/stale peer, generation
    reconnect, stop/detach and concurrent session isolation on declared Linux/Windows targets.
  - Relocated installed and embedded shared-memory kit, exact inventory/output/public target isolation,
    missing artifact and process/output negative controls.
  required_ci:
  - All32 existing exact-head target check records with predecessor name/multiplicity inventory, all successful
    and no unresolved review thread.
  - Existing compiler/FMA/MSVC/ASan, static, package and docs gates gain wire/channel and actual two-process
    source-kit coverage without removing prior checks.
  manual:
  - Independent first-use walkthrough by an unfamiliar human remains UNPERFORMED.
  - No hardware, RT1/RT2, controlled performance, Unreal, signing/release/deployment qualification.
risk:
  class: moderate
  hazards:
  - Shared-memory publication/reset races let a stale or dying peer corrupt live input or borrowed storage.
  - Wire layout, arithmetic, sequence or timestamp assumptions vary across processes/platforms or accept
    malformed/stale commands.
  - A fixed local reference is mistaken for authenticated networking, CAN, certified safety behavior,
    RT timing or physical HIL qualification.
  stop_conditions:
  - A production or forbidden path change is needed; retain reproducer and plan a separate repair.
  - A mandatory test would need weakening or canonical planning has not integrated.
rollback:
  strategy: Revert only additive shared-memory kit, tests/docs and package wiring. Preserve runtime/backend/ABI
    sources, SDK headers/exports and all earlier evidence and capability bindings.
evidence:
  output:
  - docs/evidence/M25-04-<date>.md
  - Canonical/head/tree/check identities, wire/concurrency/multiprocess and negative-control transcripts,
    package checks and retained failures.
  claim_boundary: Portable local trusted-peer external CIL reference on declared Linux/Windows targets
    only; no universal protocol, network/CAN/security/safety, hardware/HIL/RT/performance, independent
    novice review, M25 closure, Unreal or signing/release/deployment claim.
