acceptance:
- Discover exactly selected Xilinx 10ee:8038 PCI tuple and bounded expected XDMA node names. Validate each character-device
  major/minor and sysfs PCI binding before an explicitly requested O_NONBLOCK/O_CLOEXEC open, fstat identity recheck
  and checked close. Missing fields/driver/identity/permissions/close failures remain failed or unverified. Never
  read/write/map/ioctl an endpoint, reset/rebind or load hardware. Provide injected filesystem/operation tests and
  actual authorized local observations.
- Measure only bounded host-buffer copy/check observations with size/iterations/source hashes and wall duration.
  Device DMA/bitstream/protocol/RT1/RT2/endurance remain NOT RUN without their actual prerequisite contracts. No
  option can convert a manifest/assertion into a DMA permission.
- A100 inventory requires an explicit configured SSH destination, batch-mode authenticated access and a finite command
  timeout; request only fixed read-only NVIDIA/active-process/compiler inventory commands. Preserve command/error
  status, parse exact named-device records and never launch/stop workloads, wake by an invented route, alter known
  hosts, install software or change service/host configuration. Missing routes/access/occupied GPUs are truthful
  NOT RUN for profiling.
- Exercise CLI entrypoints including no-clobber output, absent devices, mismatched binding, open/fstat/close failures,
  bounded host-copy integrity and fake remote responses/timeouts. Test fixtures never count as real-device evidence.
  Native operations are opt-in and never run in hosted/default tests.
- Reconcile remaining original M18/M19/M20 and independent review cards against actual source-bound evidence, including
  M27-04 native telemetry and M29 final platform verification. Distinguish software delivered from pending qualification/manual/release
  acceptance. Preserve all original ledger identities/112 requirements/30 findings/13 cards and owner-excluded cyber
  status. Do not reopen delivered stories or add a replacement owner acceptance card.
- Preserve release1.2.1 portableRT0, C ABI8/70 exports/fingerprint/SONAME8, device ABI1, default SDK, original tests/deadlines/workflows/compiled
  production sources. Full local and all32 original exact-head hosted gates, scope/risk/source review and guarded
  target/canonical integration required. No functional gate waived.
validation:
  local:
  - python3 tests/host_profiles/test_profile.py
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - git diff --check
  focused_tests_to_add:
  - Temporary fake sysfs/device records and injected descriptor operations establish exact endpoint ownership/identity
    and error preservation; fake runner tests establish fixed remote command/timeout/parser/NOT RUN behavior. CLI
    and host-copy bounds/integrity/no-clobber outputs use real entrypoints without actual devices.
  required_ci:
  - All32 original exact-head hosted names/multiplicity, full canonical local/hosted validation; no new workflow.
  manual:
  - Actual XDMA metadata/open-close is authorized; DMA/physical qualification, A100 workloads, Unreal and final
    independent/performance/production acceptance remain separate.
risk:
  class: high
  hazards:
  - A node or observation is bound to the wrong PCI function or failed cleanup is hidden.
  - Host-copy/inventory/fixtures are overstated as physical transfer/RT/engine/release evidence.
  stop_conditions:
  - Any endpoint traffic, register operation, hardware/configuration mutation, live workload disruption or missing
    authorization is required.
  - An unavailable engine/remote environment or independent human gate is required for credible completion; record
    unsatisfied and advance available observations.
rollback:
  strategy: Revert only this optional profile tool/tests/wiring/current documentation and additive hash bindings;
    preserve original software/ledger/evidence.
evidence:
  output:
  - docs/evidence/M30-01-<date>.md
  - Exact-source CLI reports/commands/errors, local/full/hosted checks, source/scope/risk and guarded merge receipts.
  claim_boundary: Only optional host-side discovery software and actual bounded authorized metadata/open-close/host-copy
    observations. Cyber remains excluded_by_owner_unsatisfied; global software_complete/CAP-M20 false. No device
    transfer, hardware/RT/endurance/Unreal/human/controlled-performance/production authenticity/release/deployment
    qualification.
