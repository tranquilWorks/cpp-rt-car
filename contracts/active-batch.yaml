acceptance:
- Ship a small source-only HAL-v2 core backend template under samples/backend_authoring, independent of
  private Runtime headers and vendor libraries. Implement all ten required table operations, complete
  size/version/reserved validation and truthful capabilities using fixed caller-owned/backend-owned storage,
  explicit negotiated capacities, nonzero stale-safe buffer tokens and one bounded copy command. Unsupported
  extensions remain absent; no production HAL/runtime repair or public header/export change.
- Handle concurrent submit/poll with bounded nonblocking atomic ownership and no spin wait, heap allocation,
  hidden threads, locks or I/O. Bound copies and queue/registry scans; reject saturation before ownership
  transfer. Match accepted submission IDs exactly once; never write payload after failure/cancel/retirement.
  Report health/generation/counters and retain borrowed buffers until work is quiescent. Explain single-slot
  throughput limits and control-thread-only lifecycle operations.
- Provide explicit deterministic fault hooks for partial initialization, registration, completion error/timeout/loss
  and cleanup failures as portable test fixtures. Successful reset and reinitialization must retire stale
  work consistently. Failed unregister/shutdown must preserve ownership and permit bounded explicit retry;
  report invalid_state after failed initialization only when no resource remains. Fault injection is not
  hardware failure qualification.
- Ship reusable framework-free conformance code accepting the public HAL table plus explicit command-profile/fault/ownership
  hooks and caller-owned test storage. Exercise discovery, malformed input, negotiated queue/buffer saturation,
  token/range/access validity, accepted completion content/count/identity, cancel, health/reset, failed-start
  rollback, stop and cleanup retry. Keep a finite call budget and explicit result records, and keep caller
  storage alive if cleanup remains unresolved. Do not present a copy-profile fixture as universal HAL
  or vendor qualification.
- Run the same reference backend through actual public Runtime register/finalize/start/device-phase/dependent-CPU/step/checked-stop
  entry points. Independently verify copied bytes, sequencing, status propagation, resource conservation,
  failure recovery and multiple-instance isolation. Demonstrate existing device-ABI-v1 compatibility with
  public mock registration alongside native v2 and document their source/binary and optional native-driver
  boundaries.
- Add independent harness negative controls that detect deliberately defective capability/capacity, token/ownership,
  completion identity/count/content, failure/reset and cleanup reporting. Exercise direct concurrent submit/poll,
  repeated generations, malformed boundaries, zero steady-state allocation, strict compiler builds, ASan/UBSan/leaks
  and TSan. Preserve earlier tests and evidence rather than deriving expectations from the backend implementation.
- Install exact source/CMake/oracle/harness inventory and a self-contained authoring guide with capability
  checklist, fixed-storage publication/retirement pattern, lifecycle/ownership table, failure matrix,
  v1 translation guidance and extension/native-driver limits. Compile/run standalone installed find_package
  and source embedding from a relocated archive with removed original prefix, custom paths/spaces and
  public target only. Add package coverage through a separate additive consumer contract; preserve the
  exact public SDK header/target inventory and all earlier raw/typed/CUDA consumers.
- Run full local profiles, focused sanitizer/static/allocation gates, complete SDK and existing CUDA relocated/source
  consumers, ABI and all32 exact-head target check records with unchanged name/multiplicity. Preserve
  the complete M24 capability matrix/source/evidence bindings unchanged. Record canonical revision/blob,
  acceptance mapping, retained failures, commands/results, self-review, rollback and residual/unperformed
  gates. Close only M25-03; M25-04 and later remain separate.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh full
  - python3 tests/backend_authoring/verify_package.py --work-directory build/m25-03-package
  - python3 tests/cuda_physics/verify_package.py --work-directory build/m25-03-cuda-package
  - python3 tools/check_c_abi.py --library build/agent-quick/librtfw.so
  - Focused strict backend/conformance/runtime/allocation tests; ASan/UBSan with leak detection, TSan
    and Clang14 static analysis.
  - python3 tools/check_cuda_capabilities.py
  - git diff --check
  focused_tests_to_add:
  - Reusable public-table conformance with explicit caller storage and deterministic finite fault injection;
    independent defective-backend negative controls.
  - Actual Runtime native-v2 and adapted-v1 integration, failure/cleanup retry, generation and concurrent
    instance isolation, zero allocations and direct submit/poll concurrency.
  - Relocated installed source kit and embedded consumers; exact inventory/output/header isolation, missing
    package/source and oracle negative controls.
  required_ci:
  - All32 existing exact-head target check records with predecessor name/multiplicity inventory, all successful
    and no unresolved review thread.
  - Existing compiler/FMA/MSVC/ASan, static, package and docs gates gain backend source kit coverage without
    removing prior checks.
  manual:
  - Independent first-use walkthrough by an unfamiliar human remains UNPERFORMED.
  - No hardware, RT1/RT2, controlled performance, Unreal, signing/release/deployment qualification.
risk:
  class: moderate
  hazards:
  - Backend example teaches unsafe publication, buffer retirement or cleanup-success assumptions.
  - Conformance harness relies on implementation internals or reports success for malformed/unfinished
    ownership.
  - A minimal mock source kit is mistaken for a production driver, all HAL extensions or hardware/RT qualification.
  stop_conditions:
  - A production or forbidden path change is needed; retain reproducer and plan a separate repair.
  - A mandatory test would need weakening or canonical planning has not integrated.
rollback:
  strategy: Revert only the additive backend source kit, conformance tests, documentation and package
    wiring; preserve compiled production, SDK headers/exports, M23/M24/M25 predecessor implementation
    and evidence.
evidence:
  output:
  - docs/evidence/M25-03-<date>.md
  - Exact canonical/head/tree/check identities, conformance and negative-control results, package transcripts
    and retained failures.
  claim_boundary: Portable HAL-v2 core copy-profile authoring and integration only. No universal conformance,
    physical hardware/RT/performance, independent novice review, M25 milestone closure, Unreal or signing/release/deployment
    claim.
