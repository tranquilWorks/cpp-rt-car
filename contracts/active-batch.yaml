acceptance:
- Add an explicitly limited three-dimensional constant-acceleration particle model, not a general physics
  engine. Each axis stores signed 32-bit position, velocity and acceleration. One step is v := v + a followed
  by x := x + v. The logical step is 1/256 second; position units are 1/65536 metre, velocity units are
  position units per step, and acceleration units are position units per step squared. Initial positions
  are within [-1024,1024], velocities [-64,64], accelerations [-4,4]. Define the exact deterministic uint32
  seed-to-state mapping, including intentional unsigned wrapping. Reject zero/out-of-range counts and
  step limits before execution. Bound each instance to 4096 particles and 1024 steps; demonstrate with
  checked int64 arithmetic that every intermediate and final int32 state is representable. No floating-point
  tolerance, overflow-dependent signed arithmetic, collisions, constraints, variable timestep or application
  physics claim belongs to this batch.
- Implement the workload with installed public rt::Runtime, CudaDeviceBackend and HAL v2 APIs. The normal
  graph uses CPU preparation, a Runtime device command-batch phase containing ordered H2D, kernel and
  D2H, then CPU validation/publication. Declare phase/resource dependencies, fixed buffer references,
  copied kernel arguments and same-backend timeline signals. Use the actual backend and its existing submission/service
  lanes; never invoke backend submit/poll directly as a replacement for Runtime graph execution. Keep
  the experimental particle sample, SimCore helpers and previous benchmark/sample implementations unchanged.
- Device state evolves across successful frames; do not replace each frame with unrelated initial data
  or a CPU-generated final result. The host oracle independently computes v(n) = v0 + n*a and x(n) = x0
  + n*v0 + a*n*(n+1)/2 in int64 from the original seed. The portable injected kernel performs the iterative
  update over actual device-mirror bytes and must not call the oracle. Compare every field and particle
  after each completed step, not merely a checksum. Retain fixed known-answer seed/state vectors independent
  of both implementations; corrupt one output field to prove the end-to-end oracle fails.
- Reuse one shared graph/configuration implementation for portable injected-driver mode and an optional
  real CUDA session. The fake driver must implement and observe actual host/device copies, kernel argument
  decoding, event readiness, context/stream identity and checked ownership through CudaDeviceBackend.
  Assert exact H2D/kernel/D2H/validation counts and byte counts. Show host validation cannot precede successful
  D2H completion; a deterministic not-ready event must hold publication until explicitly released without
  sleep-dependent or unbounded waiting. Failures must never increment successful-frame or publish counters.
- Bound fixture storage to 32 MiB, Runtime declared memory to 128 MiB, CPU workers to two, backend queue
  depth to one and one context/stream/backend per instance. Allocate instance storage before start and
  avoid large automatic stack objects. Keep callbacks and every declared steady step allocation-free,
  without hidden threads, file I/O or executor-side driver calls. Preserve borrowed state, stream/module/kernel
  handles and registered buffers through checked Runtime stop, including unsuccessful shutdown and explicit
  cleanup retry. Do not assume Runtime instances can restart after terminal stop; repeat lifecycle with
  fresh instances.
- Provide a portable sample_cuda_physics CLI with finite count/steps/seed inputs, checked numeric parsing,
  help and deterministic summary fields including model version, seed, sizes, completed steps, validation
  status and simulated evidence label. Invalid or trailing/overflowing arguments exit 2, execution/oracle/
  cleanup failures exit 1 and successful checked execution exits 0. Report success only after checked
  stop. Capture timing only as optional host characterization; no speedup, throughput qualification or
  RT claim.
- Provide a separately opt-in sample_cuda_physics_real executable under existing RTFW_ENABLE_CUDA, using
  rtfw::cuda_driver and caller-owned CUDA context, stream, module and function. Ship the bounded kernel
  source and its reproducible build/load instructions; a checked-in PTX may be used only with documented
  source, target/toolchain identity and regeneration verification in optional toolkit CI. Real mode must
  execute the same Runtime graph and independent oracle, never silently substitute fake mode. No toolkit
  dependency leaks into the portable build. Missing hardware reports NOT RUN and exit 3; malformed configuration
  or CUDA, oracle and cleanup errors remain failures. Portable CI must not probe a device or require a
  GPU. A supplied deterministic driver/session test verifies shared graph wiring but is labelled simulated,
  not physical.
- Cover counts 1, 17, 256, 1024 and 4096; steps 1, 7, 64 and the 1024 maximum; seeds 0, 1 and UINT32_MAX;
  and one/two CPU-worker configurations with a finite documented coverage matrix. Include at least one
  simultaneous maximum-count/maximum-step run; the full cross product is not required. Test deterministic
  known answers, repeat identical runs, concurrent independent instances with different seeds, input boundary
  rejection, corrupted output and no-allocation steady execution. Preserve the existing 512 KiB caller-stack
  regression approach for this sample's entry point and keep maximum storage on owned preallocated memory.
- Add injected launch/copy failure, delayed completion, checked stop and retryable cleanup tests sufficient
  to establish sample lifetime safety. Use deterministic bounded coordination, retain all possibly live
  resources after cleanup failure and prove no validation/publication of partial output. Do not broaden
  into M24-03's complete pressure/cancellation/device-loss matrix or repair Runtime/backend code here;
  a discovered production defect needs a separately scoped reproducer and repair contract before this
  batch can depend on it.
- Ship the source example and its model documentation as data under the existing package data root, with
  an exact new source ledger, no new default exported SDK targets/headers and no benchmark component dependency.
  Compile/run a genuinely separate find_package consumer from a non-default prefix after archive relocation
  and source-tree isolation, and an add_subdirectory consumer. Include an optional real-driver compile/link
  consumer under toolkit CI. Keep all existing package/header/target/license assertions and original benchmark
  wrappers unchanged. The sample must build from installed sources and public targets alone.
- Wire portable sample and meaningful tests into existing GCC/Clang/FMA, MSVC, ASan/UBSan, TSan, no-allocation
  and optional static-analysis coverage. Preserve existing 32-check hosted surface and every previous
  oracle, timeout, test and benchmark inventory. Verify stable C ABI v8, 70 exports, fingerprint, SONAME
  8, device ABI v1, release 1.2.1 and unchanged default SDK surface. New data-source digests and documentation
  hashes may be added/refreshed only with their exact path inventory; do not relax any release validator
  or earlier ledger.
- 'Document model arithmetic and units, ownership/teardown, real prerequisites, exact CLI/build commands,
  capacity/coverage and acceptance-to-test mapping. Reconcile M23''s merged software completion using
  PR #261''s final exact-head evidence while retaining earlier failures and manual gates. M24-02 stream/Graph/pipeline/
  active-rate expansion, M24-03 full failure/determinism campaign, M24-04 benchmark/maturity closure and
  M25/M26 remain separate. This batch neither closes CAP-M24 nor lowers its eventual 90-percent overall
  and 100-percent critical-row automated denominator. Physical CUDA, controlled timing and independent
  human review remain explicitly unperformed unless actual named evidence is obtained.'
validation:
  local:
  - git status --short --branch
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - cmake -S . -B build/m24-physics -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=OFF
    -DRTFW_BUILD_BENCHMARKS=OFF -DSIM_SANITIZERS= -DSIM_WERROR=ON
  - cmake --build build/m24-physics --parallel 2
  - ctest --test-dir build/m24-physics --output-on-failure
  - build/m24-physics/samples/sample_cuda_physics --count 4096 --steps 1024 --seed 4294967295
  - python3 tests/cuda_physics/verify_package.py --work-directory build/m24-physics-package
  - ./scripts/agent-verify.sh full
  - python3 tools/check_c_abi.py --library build/m24-physics/librtfw.so
  - git diff --check
  focused_tests_to_add:
  - Independent closed-form and fixed known-answer oracles, complete byte transfers, exact frame/callback
    counts and corruption negative control.
  - Maximum count/steps, numeric rejection, delayed terminal completion, failed work suppression, cleanup
    retry and concurrent instance isolation.
  - Steady no-allocation, bounded caller stack, ASan/UBSan and TSan sample lifecycle tests with actual
    instrumentation.
  - Actual CLI exit/status tests and source-isolated installed/archive-relocated/embedded consumers; optional
    CUDA-driver compile/link and kernel build verification.
  required_ci:
  - All prior 32 exact-head hosted checks, with additive portable sample/tests in existing compiler/FMA/MSVC,
    sanitizer, static and package jobs.
  - Optional CUDA toolkit compile/link and reproducible kernel compilation; no GPU required or physical
    evidence inferred.
  - Original ABI, release, no-allocation, package, benchmark and determinism-artifact gates remain unchanged.
  manual:
  - Review independent oracle arithmetic, Runtime ownership and graph path, checked cleanup and installed
    consumer. Agent self-review is not independent human review.
  - Actual real-CUDA execution requires an accessible named owned device/context/driver tuple; otherwise
    retain NOT RUN without blocking portable implementation.
risk:
  class: high
  hazards:
  - A fake kernel calls the CPU oracle, bypasses Runtime or validates fabricated output, hiding transfer
    or scheduling errors.
  - Signed overflow, wrong units or a shared erroneous recurrence creates a false correctness result.
  - Async CUDA work outlives borrowed storage, or failed cleanup destroys retained context/module/buffers.
  - Portable injected-driver execution is mislabeled physical or a small model is presented as a general
    physics engine.
  - Toolkit dependencies, source paths or experimental helpers leak into the default package/example.
  stop_conditions:
  - Canonical planning contract is not integrated before activation, or target baseline moves without
    reconciliation.
  - Runtime/backend/public ABI/schema or another forbidden path needs a change; retain a reproducer and
    plan a separate repair.
  - Success requires weakened tests, invented resource observations, unbounded waits, unsafe cleanup or
    absent hardware evidence.
  - New physical/controlled/signing/release/deployment authority or a substantive product decision would
    be required.
rollback:
  strategy: Revert the isolated CUDA particle source example, tests, source-data packaging and documentation/CI
    integration as one batch. Preserve Runtime, all existing backends/providers/samples, ABIs, release
    and support claims; no state migration is introduced.
evidence:
  output:
  - docs/evidence/M24-01-<date>.md
  - Exact target/control source and tree identities, scoped diff, commands, exit codes, local/hosted pass/fail/NOT
    RUN results and retained failures.
  - Acceptance-to-test matrix, known-answer vectors, maximum arithmetic/coverage, no-allocation/sanitizer
    and installed-consumer evidence.
  - Real CUDA prerequisites and named results only if actually executed; otherwise explicit NOT RUN.
  claim_boundary: Bounded validation-model and portable injected-driver software evidence. No general
    physics engine, CAP-M24 closure, real CUDA support/RT qualification, controlled performance, Unreal,
    cybersecurity, Daybreak, signing, release or deployment claim.
