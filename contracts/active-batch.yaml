schema_version: 1
batch:
  id: M23-03R3
  title: Correct saturated watchdog transitions in active replay
  goal: Record the actual prior watchdog degradation level at saturation so unchanged public active and nested live-control replay consume the exact transcript and restore full state.
sources:
  product: products/cpp-rt-car/product.yaml
  requirements:
  - products/cpp-rt-car/acceptance.yaml#CAP-M23
  milestone: products/cpp-rt-car/milestones/M23.md#M23-03--multi-rate-controls-replay-and-observability-benchmarks
  baseline_commit: 52fbdd3b029f1531f8d5d40af85e3f8e11603571
  control_plane_repository: tranquilWorks/portfolio-control
  control_plane_path: products/cpp-rt-car/batches/M23-03R3.yaml
  control_plane_revision: 85c062604e5dba94d97fd95d07b65a0949fc1d2a
  owner_direction: Continue planned cpp-rt-car development, integration and polish under standing bounded software publication/merge authorization; finish PR 254 without cybersecurity, Daybreak or Unreal scope.
  prerequisite: Queue PR 257 and replay PR 256 are merged; preserve their source and evidence.
  retained_failure: PR 254 checkpoint 0a8bbe9d8b4c82e44b310773e5d83c1d2f6b938e; original 78-case continuation is 77/78, composition-fault-8 fails at frame 5, live-control settlement action 27. GCC and MSVC hosted run 36016148112 reproduce the failure.
  reproducer: tests/benchmark_fixtures/runtime_consumer/watchdog_replay_regression.cpp in the retained PR 254 continuation uses only public Runtime APIs, an atomic logical clock and one CPU callback. Caps 1 and 3 both record cap-1 to cap after saturation, while replay requires the actual cap to cap transition.
  diagnosis: Runtime step emits degradation_before as after minus one for every watchdog event, even when degradation is already at its maximum. Replay cannot consume that transition, then diverges on a later action. Restoring the borrowed fixture clock does not repair it.
  canonical_revision: 19eaf9eb45434584c3b5aecb1976a97d4e626dd8
  canonical_blob_sha: 8d63ada5ed44e457440c6736bf65c7cd40d718fb
  reconciled_target_main: 52fbdd3b029f1531f8d5d40af85e3f8e11603571
  integration_order: Integrate this validated canonical contract, activate an isolated repair from reconciled target main, verify and merge the repair, then reconcile PR 254 and reactivate its unchanged M23-03 scope. Do not mix benchmark feature edits into the repair.
