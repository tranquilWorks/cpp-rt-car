    writes rate_owned at device_manager.cpp:1697 while service_loop reads it at2139 during active CUDA
    launch failure. Two lifetime gates report this race; the512KiB CLI additionally exits-11 without a
    diagnostic. Original six M24 gates pass.'
  owner_scope: Continue the existing dependency-ordered portable software scope in automation.json. No
    cybersecurity, Daybreak, Unreal, physical qualification, signing, release or deployment. Integrate
