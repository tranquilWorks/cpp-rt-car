acceptance:
- 'Change only private host_runtime.cpp and device_manager.cpp behavior: bounded completion collection
  during checked stop, and forwarding the already compiled explicit DeviceRateSimulationPolicy to real
  sampled safe submissions. Preserve ABI8/70exports/fingerprint0xd0e7a5a14bf35f97, SONAME8/deviceABI1,
  public layouts, RuntimeConfig schema7, native sources, defaults, existing MemoryPlan and artifact bytes;
  no new public state or policy.'
- For startup/failure/shutdown, select only the matching compiled device phase simulation policy. Retain
  original safe-transition logical duration and batch/backend timeout, checked now+timeout arithmetic,
  actual terminal acknowledgement and unknown-on-failure ownership. Existing finite host watchdog applies
  only to an opted-in deterministic mock; unselected mock and all native paths keep the original wall
  deadline. Never claim safety from elapsed time or cancellation alone.
- After device submission/service lanes quiesce, each checked stop may perform one bounded poll per registered
  command backend before unregistering buffers. Collect actual native terminal completions still retaining
  buffer references; never treat canceled/timeout work as safe ACK or free unfinished native work. Keep
  bounded callbacks, existing completion buffers/capacities, no new waits/allocations/public state, and
  original failure retention when native completion is not yet ready. Subsequent checked stop must be
  able to progress. Prove an unchanged-baseline negative with controlled held completion visibility and
  real native XDMA registration; cover delayed pending/retry, default and explicit simulation, ordinary
  completion preservation and isolation. Preserve every prior timeout/assertion/native source.
- 'New public-API fixture/installed consumer must demonstrate the unchanged-baseline negative: bounded
  held actual native XDMA event with fixed injected logical clock exceeds8ms host duration, regular dispatch
  succeeds while lifecycle startup/stop fail; repaired opted-in lifecycle passes. Exercise startup/failure/stop,
  logical deadline expiry, finite host watchdog, missing ACK, default/unselected/native rejection, multiple
  owners, checked retry/resource conservation and zero allocation with positive control. Preserve every
  earlier fixture/assertion/deadline.'
- Run contract/quick/full, preserved focused device/rate/sampled/control/replay suites, new regressions,
  ASan/UBSan/leaks, TSan, relevant Clang static, actual relocated CPack full SDK/custom paths/spaces/removed
  original prefix/embedding/negative consumers, ABI and exact default artifact/MemoryPlan comparisons.
  Require all32 exact-final-head target checks with exact M26-03 names/multiplicity; no local/target exceptions.
  Retain failures and risk review.
- Refresh only necessary source-linked docs and reviewed ledgers; cuda_capabilities.json product_sources
  hashes only. Guard separate merge with clean exact head/base, no unresolved review threads, fetched
  tested-tree equality. Canonically reactivate feature279 and complete every original acceptance with
  fresh gates; repair alone does not close M26-04 or CAP-M26. M26-05/M26-06 and human/physical/RT/Unreal/performance/release
  remain separate.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - Focused new sampled simulation and preserved device/rate/sampled/control/replay suites; unchanged-baseline
    timing negative, exact default bytes/MemoryPlan, native/default controls and zero-allocation positive
    controls.
  - ASan/UBSan/leaks, TSan, Clang static, installed/relocated full SDK consumer, ABI/default-v1 and source-linked
    docs.
  - git diff --check
  focused_tests_to_add:
  - Explicit mock startup/failure/shutdown honors finite host watchdog while logical/backend8ms remains
    enforced.
  - Unselected/native/default behavior, logical expiry, host expiry, missing ACK and resource/checked
    retry controls.
  - Independent owner/allocation and public relocated SDK coverage with unchanged-baseline negative.
  - 'Controlled native terminal completion visibility after poll lane quiescence: actual unregister remains
    pending before readiness, later bounded checked stop collects and releases; original baseline fails.'
  required_ci:
  - All32 exact-head records successful with exact M26-03 names/multiplicity; no target exceptions.
  - New cases join existing compiler/FMA/sanitizer/package filters; workflows and earlier tests remain
    unchanged.
  manual:
  - No physical CUDA/XDMA/HIL/RT/human/Unreal/controlled-performance/release/signing/deployment claim.
risk:
  class: high
  hazards:
  - Wrong phase policy leaks simulation timing to native/default submissions.
  - Logical/backend deadlines or real terminal safe acknowledgement weaken.
  - Host watchdog is omitted, unbounded or uses an unrelated clock.
  - Prior repairs, artifacts, tests or mandatory gates are changed.
  stop_conditions:
  - Public ABI/layout/schema versioning, default capacity/timeout weakening or native backend changes
    become necessary.
  - Earlier tests/assertions/deadlines or mandatory gates would require weakening.
  - Unrelated product, physical/privileged/signing/release authority is needed.
rollback:
  strategy: Revert only private lifecycle timing propagation and new regression/docs/activation; preserve
    all prior repairs and feature evidence.
evidence:
  output:
  - docs/evidence/M26-04R4-<date>.md
  - Exact retained positive/negative/baseline, memory/identity/replay/ownership/allocation/sanitizer/package/ABI
    commands and source/head/tree/check/merge records.
  claim_boundary: Portable owned-simulator lifecycle timing only; no physical/HIL/RT/human or feature/milestone/release
    closure.
