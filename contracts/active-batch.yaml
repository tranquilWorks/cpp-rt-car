acceptance:
- Add an explicit additive C++ native-per-backend capacity policy and Runtime setter; default remains
  uniform with exact previous success/rejection behavior, identities, MemoryPlan and checkpoint/replay
  bytes. Preserve existing public layouts, RuntimeConfig schema7/layout, C ABIv8/70exports/fingerprint0xd0e7a5a14bf35f97,
  SONAME8, deviceABIv1, native backend sources/capabilities and artifact schemas.
- Opt-in must be configured before any backend registration and frozen after finalization. Reject malformed
  policy values and unsupported adapted-v1, core-only or extension mixtures before taking ownership. Resolve
  each native command backend outstanding bound as the minimum of global outstanding, core max_in_flight
  and command max_in_flight_batches; resolve polling count as the minimum of global completion batch and
  advertised command completion capacity. Capabilities must remain validated/copied. No unbounded or inflated
  storage.
- Use resolved actual counts consistently for command slot allocation, initialization requested_in_flight,
  submission/saturation, completion polling, retirement, stop/reset/retry, reconstruction and exact MemoryPlan/control
  accounting. Preserve global reservation bounds and all existing backend/phase admission checks and algorithm,
  deadlines, safe-ACK semantics, no-allocation and instance isolation. Existing slot metadata may carry
  resolved counts; no default storage-layout/accounting drift.
- Opt-in identities include a conditional marker and resolved backend counts; default graph/config/checkpoint/active
  replay bytes are unchanged. Reject policy/capacity-incompatible replay/checkpoint before effects. Preserve
  trusted originating-owner replay, compatible paired recovery, ownership on failed stop and bounded retry;
  no artifact rewrite.
- Add independent new tests and installed public SDK consumer, integrated into existing compiler/FMA/sanitizer/package
  filters without changing protected workflows or prior tests. Cover actual heterogeneous one/two-slot
  native command backends with global3, allocation and MemoryPlan deltas, aggregate/backend saturation,
  policy malformed/frozen/order rejection, unsupported mixtures, lifecycle/partial initialize/failure/retry/isolation,
  replay/recovery and default bytes. Old-order control must fail new acceptance against unchanged baseline.
  Positive-controlled zero steady/replay allocation includes native workers.
- Run focused new and preserved device/rate/sampled/replay tests, default-v1/ABI, ASan/UBSan/leaks, TSan,
  production Clang static, actual CPack/relocated full SDK and embedding/negative consumers, contract/quick/full
  and all32 exact-head hosted checks with exact predecessor names/multiplicity. Retain failed attempts,
  diagnostics and risk review. No target or local functional waiver.
- Update source-linked generated SDK docs and current reviewed release/source ledgers only as needed.
  docs/cuda_capabilities.json may refresh only product_sources hashes of changed Runtime files; preserve
  all capability rows, historical gates/evidence and claims. Preserve every previous fixture/assertion/deadline/source/evidence.
- Merge repair separately under clean/head/base/no-unresolved-thread and fetched-tested-tree guards. Then
  canonically reactivate M26-04, explicitly distinguishing aggregate reservation3 from frozen native CUDA1/XDMA2,
  reconcile draft279 and complete all feature acceptance with fresh gates. Do not inflate native queues,
  change prior CUDA event pools, weaken admission or deadlines, or declare repair as feature closure.
  M26-05/M26-06 remain inactive.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - Focused DeviceCapacity/CommandBatch/RateDispatch/MixedRateReplay and preserved sampled/device suites,
    old-order negative control, exact default identities/artifact bytes, lifecycle and zero allocations.
  - ASan/UBSan/leaks, TSan, Clang static, installed/relocated full SDK consumer, ABI/default-v1 and source-linked
    docs.
  - git diff --check
  focused_tests_to_add:
  - Heterogeneous native one/two-slot execution, actual allocation/MemoryPlan and global/backend saturation.
  - Malformed/order/frozen/unsupported policy, partial initialization/failed stop/retry/isolation.
  - Owner replay/paired recovery, incompatible artifacts before effects, unchanged default bytes and old-order
    failure.
  required_ci:
  - All32 exact-head records successful with exact M26-03 names/multiplicity; no target exceptions.
  - New cases join existing compiler/FMA/sanitizer/package filters; workflows and earlier tests remain
    unchanged.
  manual:
  - No physical CUDA/XDMA/HIL/RT/human/Unreal/controlled-performance/release/signing/deployment claim.
risk:
  class: high
  hazards:
  - Per-backend storage, init or poll bounds disagree with validated capabilities.
  - Default behavior/accounting/identity bytes drift.
  - Aggregate or per-backend admission is accidentally weakened.
  - Completion ownership or replay state escapes bounded per-backend lanes.
  - Failure/retry frees borrowed resources before terminal ownership.
  stop_conditions:
  - Public ABI/layout/schema versioning, default capacity/timeout weakening or native backend changes
    become necessary.
  - Earlier tests/assertions/deadlines or mandatory gates would require weakening.
  - Unrelated product, physical/privileged/signing/release authority is needed.
rollback:
  strategy: Revert only additive opt-in capacity policy/plumbing and its new tests/docs/activation; preserve
    merged storage repair, defaults, native backends and retained feature279.
evidence:
  output:
  - docs/evidence/M26-04R2-<date>.md
  - Exact retained positive/negative/baseline, memory/identity/replay/ownership/allocation/sanitizer/package/ABI
    commands and source/head/tree/check/merge records.
  claim_boundary: Portable opt-in native command capacity policy only; no M26-04/CAP-M26 closure or physical/HIL/RT/human/release
    promotion.
