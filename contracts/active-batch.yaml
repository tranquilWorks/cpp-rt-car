acceptance:
- Implement all eight frozen CPU phases over sample-owned fixed SoA state, deterministic M24 initialization
  and piecewise exact integer oracle. Exercise genuine Runtime nested parallel work, active five-domain
  rate execution and all five cross-rate channels; verify every field, inactive tail, resource/phase plan,
  release counts, selected producer identity/age, and aggregation. Preserve the M26-01 JSON/hash and checker
  unchanged. CPU channels use explicit canonical payloads and application stale/safe handling; do not
  register fake device sampled I/O or implement CUDA/XDMA variants.
- Provide standalone native-worker and independent headless host-job-adapter modes using only installed
  public Runtime targets/headers. Implement bounded sample-owned host jobs and memory/clock/telemetry
  ownership; derived copies of prior source patterns are permitted inside the new kit with provenance,
  while previous kits remain unchanged. Check full MemoryPlan accounting within the frozen budgets, no
  allocation on steady step/replay paths, accepted-job conservation, multiple concurrent owners, bounded
  failures and checked stop/lifetime retention.
- Apply real typed M22 scenario/controller/calibration/fault/clear controls at exact declared first-cycle
  rate and later host-frame targets, validating fixed bodies off lane. Check admission rejection/replacement,
  stale handles and immutable generations without retaining callback views. Export actual canonical registered
  application state and Runtime checkpoints, M21 active-replay and trusted M22 lossless-v2 artifacts.
  Verify active/trusted replay on its compatible originating Runtime, whose runtime_id is bound by the
  existing active artifact; separately restore a paired successful checkpoint and resume into a fresh
  compatible owner for recovery. Reject cross-owner active replay before mutation rather than rewriting
  artifact identities. Compare complete state, counts, control/admission and action outcomes, and reject
  malformed/mismatched/gapped artifacts before side effects. Recovery after a failed frame uses a successful
  paired checkpoint and a fresh owner; never claim application/backend rollback from Runtime generation
  rollback.
- Implement M26-02-owned overload, stale-input, rejected/replaced-control and missing-peer campaigns with
  exact deterministic injection, observable bounded outcome, recovery/cleanup and oracle checks. Use real
  Runtime deadline/control/channel semantics where applicable; distinguish application protocol validation
  from Runtime validation. Device loss/reset, sampled HAL under/overrun/stop faults and full benchmark/lever
  showcase remain future batches, explicitly unperformed.
- 'Implement optional separate-process external CIL on the existing declared 64-bit Linux/Windows platform
  family. Freeze and test an explicit sample-owned vector wire codec distinct from M25 scalar wire schema:
  fixed 256x3 LE arrays, generation/count/sequence/issue/expiry/correlation/checksum and zero reserved/tail
  bytes. Use bounded SPSC mapped slots, exclusive creator/single writer, no overwrite, one callback-boundary
  read with off-lane bounded peer supervision, zero effort on missing/expired input, acknowledged stop
  and fresh mapping/generation on reconnect. Exercise actual processes, malformed/stale/replayed/partial
  records, peer death/missing ack, old-peer isolation and simultaneous sessions; never route callbacks
  through filesystem/OS mapping/wait operations.'
- Ship a complete source kit and clear one-command build/run/validate path with machine-readable run/state/replay
  evidence, source/configuration/contract identity and portable-only claims. Bind compiled constants to
  the immutable contract using reproducible developer generation. Artifact validation and mutation negatives
  must reject false state/count/cleanup/replay/provenance claims. Build from tests-OFF public installed
  targets after actual CPack extraction, removed original prefix and custom include/data paths with spaces;
  run source embedding, complete prior SDK consumers and missing/source/private-path/artifact negative
  controls. Preserve default SDK header/export inventory and production ABI.
- Run focused numerical/rate/control/replay/fault/concurrency/process/allocation tests, ASan/UBSan/leak
  and TSan where supported, Clang static analysis, complete contract/quick/full profiles and all32 exact-head
  hosted gates with predecessor names/multiplicity. Add source-kit/test/installed/determinism coverage
  to existing jobs without dropping earlier gates or altering required check names. Retain failures/corrections,
  exact commands, acceptance mapping, canonical/head/tree/check/merge identities and honest limitations.
  Close only M26-02 after integration; remaining four M26 batches and M25 human/physical/RT/Unreal/performance/release
  remain separate.
validation:
  local:
  - python3 tools/check_golden_contract.py
  - python3 tools/generate_golden_config.py --check
  - python3 -m unittest discover -s tests/golden_system -p "test_*.py"
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - ctest --test-dir build/agent-quick -R golden --output-on-failure
  - python3 tests/golden_system/verify_package.py --work-directory build/m26-02-package
  - Focused golden ASan/UBSan/leak, TSan, allocation and Clang analysis commands recorded in evidence.
  - git diff --check
  focused_tests_to_add:
  - Every-field integer oracle, exact rates/channels/controls and future-variant boundaries.
  - Same-owner active/trusted replay, cross-owner active rejection, fresh-owner checkpoint recovery, rejected/replaced/stale
    controls and malformed/gapped artifacts.
  - Native/host nested execution, multiple owners, no allocation and job/memory/cleanup conservation.
  - Real external-process vector CIL codec/lifecycle/fault/reconnect and platform isolation.
  - Relocated CPack/source embedding/full SDK and artifact/source/package negative controls.
  required_ci:
  - All32 exact-head target records successful with predecessor names/multiplicity and no unresolved review
    thread.
  - Add golden tests, installed source/real-process/artifact checks and sanitizer/determinism coverage
    to existing named jobs without removing prior checks.
  manual:
  - M25 unfamiliar-consumer walkthrough remains UNPERFORMED.
  - No physical CUDA/XDMA/HIL, RT1/RT2, controlled performance, Unreal or release/deployment qualification.
risk:
  class: high
  hazards:
  - Sample copies or orchestration falsely imply actual Runtime active execution or replay.
  - Cross-rate feedback, control latches or checkpoint restore omit state and make variant equality unreliable.
  - Host jobs or external mapped peers outlive borrowed resources, race or introduce unbounded callback
    operations.
  - Installed kit accidentally depends on private headers/source paths or claims future device/benchmark
    completion.
  stop_conditions:
  - Frozen scenario semantics require a material amendment rather than an implementation correction.
  - A production/SDK/ABI repair or forbidden-path change is required.
  - A required gate or earlier assertion would need weakening.
rollback:
  strategy: Revert only the new golden implementation/installed source kit, tests, artifact/generation
    tooling and additive gate/install wiring; preserve immutable M26-01 contract, production/SDK/ABIs
    and all previous kits/evidence.
evidence:
  output:
  - docs/evidence/M26-02-<date>.md
  - Exact numerical/Runtime/control/replay/fault/process/package/sanitizer/allocation/full/hosted results
    and canonical/head/tree/merge identities.
  claim_boundary: Portable CPU/native/independent-host and software external CIL only. No device sampled
    I/O, CUDA/XDMA implementation, benchmark showcase or M26 final completion claim. M25 human and all
    physical/RT/Unreal/performance/release gates remain open.
