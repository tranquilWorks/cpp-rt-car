  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - git diff --check
  focused_tests_to_add:
  - 'Reproduce both original defects before repair: retain an unchanged-source direct loopback cancel/submit
    publication failure (including initialized TSan evidence) and an actual relocated full-SimCore consumer
    compile failure on the missing HAL header. Add deterministic scheduling controls without production
    test hooks and keep all existing tests/assertions/deadlines unchanged.'
  - Repair private loopback slot ownership/publication across submit, poll and cancel. Cover accepted
    and in-progress submissions, published timeout slots, competing consumers, repeated cancellation,
    capacity/reuse, stop/shutdown/reset/restart and isolated instances. Cancellation/poll must never access
    unpublished or exclusively owned completion storage. Retain bounded nonblocking callbacks, no allocation
    after construction and checked lifecycle ownership; no broad Runtime or benchmark rewrite.
  required_ci:
  - All32 original exact-head hosted names/multiplicity successful; full canonical control validation;
    only03 may add its explicitly scoped deterministic gate.
  manual:
  - None in these software batches; final actual owner-stage hardware/engine/human/performance/production
    acceptance remains deferred.
risk:
  class: high
  hazards:
  - Ownership repair introduces a publication/reuse race or weakens bounded execution.
  - A retry, limitation, test identity or software pass is misrepresented as global completion/qualification.
  stop_conditions:
  - A new public ABI/schema/default decision or forbidden path is necessary; narrow/amend canonical scope
    before that change.
  - Only external hardware, licensed engine, independent human or production authority can substantiate
    a claim; retain it as final-stage acceptance.
rollback:
  strategy: Revert only this batch changes and additive wiring; preserve all previous repairs, original
    assertions, failures and exact receipts.
