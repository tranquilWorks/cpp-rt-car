  - Fix only demonstrated causal defects; preserve safe8ms and all existing deadlines, checked cleanup/live0,
    terminal-error visibility, capacity and lifecycle semantics. Add deterministic scheduling/barrier
    negatives plus meaningful repeated integration checks; retain all original tests unchanged.
  - Cover timeout, underflow, cancellation, repeated checked stop, ownership conservation and independent
