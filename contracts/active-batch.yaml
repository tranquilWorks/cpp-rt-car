schema_version: 1
batch:
  id: M23-03R4
  title: Close device submission missed-wakeup window
  goal: Observe the wake sequence before scanning queued slots so an enqueue between an empty scan and parking cannot be lost; preserve bounded device ownership and all benchmark workloads.
