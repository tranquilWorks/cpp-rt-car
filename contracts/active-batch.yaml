  - Exact source-bound focused/local/full/hosted/package results, changed-file/ABI/package/risk review
    and guarded integration receipts.
  claim_boundary: Portable engine-independent integration using real Runtime/ABI/shared-library host operations
    only. No actual Unreal, physical hardware/RT/endurance/controlled performance/independent human/production
    authenticity/release/deployment acceptance. Cyber excluded_by_owner_unsatisfied; software_complete/CAP-M20_complete
    remain false.
