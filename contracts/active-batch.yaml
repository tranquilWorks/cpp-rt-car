acceptance:
- Reproduce the R4 invalid_state(-2) versus device_timeout(-18) startup finding and native one-shot poll-overflow
  unexpected success with controlled ordering and retained baseline evidence. Classify fixture versus
  production cause separately; no assumption that an idle-poll window is the proven cause.
- Fix only demonstrated causal defects; preserve safe8ms and all existing deadlines, checked cleanup/live0,
  terminal-error visibility, capacity and lifecycle semantics. Add deterministic scheduling/barrier negatives
  plus meaningful repeated integration checks; retain all original tests unchanged.
- Cover timeout, underflow, cancellation, repeated checked stop, ownership conservation and independent
  instances with no-allocation/sanitizer/package validation. An unreproduced finding remains open with
  exact evidence; a retry pass never erases it.
- 'Distinguish the original timeout from a checked-cleanup failure: never report successful release while
  native ownership remains pending, or suppress invalid_state required by existing held-completion cases.
  Controlled public backend callbacks may establish ordering without production test hooks. Preserve original
  fixtures unchanged; an expectation incompatible with the ownership contract is documented separately
  rather than weakened.'
- Preserve prior completed batches/evidence and protected ABI/default/support claims. Run complete repository
  contract/quick/full plus all32 exact final-head hosted records with exact baseline names/multiplicity;
  retain failed attempts and risk review. Guard clean/head/base/review/merge-tree equality before scoped
  integration and canonical closure.
- Refresh only existing product-source hashes in docs/cuda_capabilities.json for scoped private changes;
  preserve its source inventory, scenarios, statuses and support claims. Contract validation requires
  this binding update.
