acceptance:
- Reproduce concurrent HighResClock initialization and concurrent owner construction on their execution
  threads against the unchanged baseline; retain initialized TSan evidence and a deterministic causal
  control where feasible.
- Repair only the demonstrated clock publication/initialization defect. Preserve explicit injected-reader
  behavior, monotonicity, fallback, independent owner lifetime and caller-thread arena binding. No new
  global serialization on the clock read path, RT-lane allocation, or supported Runtime dependency on
  experimental SimCore.
- Run concurrent construction/read/destruction and repeated initialization tests, existing clock and 2/4/8-thread
  determinism tests, applicable no-allocation checks, full instrumentation and installed legacy/current
  target isolation. Preserve all existing tests and timing limits.
- Activate only M28-01 from exact target baseline389e3fc84cfc2a5946b6e555befdff0962f3989a, then bind this
  merged canonical revision/blob in the target active contract. All later M28 work remains inactive.
- Preserve release1.2.1, portable RT0, C ABI8/70 exports/fingerprint/SONAME8, device ABI1, public/default
  policies and supported tuples. Existing source tests/assertions/deadlines and all historical evidence
  stay unchanged; tests/CMakeLists.txt permits additive new-test wiring only.
- For each claimed repair retain a causal baseline failure and corrected outcome. Complete exact-head
  local full validation and all32 hosted checks with the original names and multiplicity, applicable sanitizer/static/no-allocation/default/ABI/actual
  installed package gates, risk review and guarded target/canonical closure. No functional gate is waived.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - git diff --check
  focused_tests_to_add:
  - Reproduce concurrent HighResClock initialization and concurrent owner construction on their execution
    threads against the unchanged baseline; retain initialized TSan evidence and a deterministic causal
    control where feasible.
  - Repair only the demonstrated clock publication/initialization defect. Preserve explicit injected-reader
    behavior, monotonicity, fallback, independent owner lifetime and caller-thread arena binding. No new
    global serialization on the clock read path, RT-lane allocation, or supported Runtime dependency on
    experimental SimCore.
  - Run concurrent construction/read/destruction and repeated initialization tests, existing clock and
    2/4/8-thread determinism tests, applicable no-allocation checks, full instrumentation and installed
    legacy/current target isolation. Preserve all existing tests and timing limits.
  required_ci:
  - All32 exact final-head target checks successful, preserving original baseline names and multiplicity;
    full canonical control validation on planning and closure.
  manual:
  - None inside this software batch. Final owner stage retains all bench, engine, independent human, controlled
    performance, production signing/release/deployment acceptance.
risk:
  class: high
  hazards:
  - An unproven cause, retry pass or instrumented timing result is mistaken for a repair or qualification.
  - A change weakens an old assertion, deadline, ABI/default or prior evidence.
  stop_conditions:
  - A new public API/ABI/schema/default-policy decision or path outside the activated cause-specific scope
    is needed.
  - Credible completion requires a bench, licensed engine, live endpoint, independent human judgement,
    production key or release/deployment action; retain that item for the final owner stage.
rollback:
  strategy: Revert only this batch changes and additive wiring; preserve predecessor implementations,
    immutable evidence and every final-stage obligation.
evidence:
  output:
  - docs/evidence/M28-01-<date>.md
  - Exact source/tree, commands, raw failures/results, source hashes, risk review, final-head CI and guarded
    merge/closure receipts.
  claim_boundary: Portable software only. Investigation can classify an unresolved result without claiming
    it passed. Global qualification, independent human acceptance and production release remain separate.
