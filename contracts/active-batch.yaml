  - docs/evidence/CI-QUEUE-01-2026-09-24.md
  - Exact retained hosted failure, canonical/source/tree mapping, bounded regression commands, sanitizer/full/CI results and residual limitations.
  claim_boundary: Experimental host-side queue reclamation correctness only; no supported Runtime feature, bounded real-time execution, hardware qualification or release claim.
