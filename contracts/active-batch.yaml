  title: Complete Unreal source integration before environment handover
  goal: Reconcile draft238 with current main and deliver the jobs/memory/clock adapters, world and extension lifecycle, engine sample, automation and build/package entry points without requiring owner equipment or credentials. Validate all available portable behavior; retain actual engine and hardware acceptance as unperformed.
