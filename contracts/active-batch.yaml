acceptance:
- Fixed-capacity per-instance registry owns Runtime objects in world slots and tracks borrowed host-world
  identities, module owners and committed extension bindings with process-local generation handles. Runtime
  construction/configuration/finalization may allocate only on the serialized control path; registry bookkeeping
  and run/close operations add no hidden allocation/thread/blocking wait. Reject duplicate owners, foreign/stale/exhausted
  handles and reentry while preserving outputs.
- Close admission before checked world shutdown. Call actual Runtime stop and detach, retaining every
  unresolved binding and module reference on failure. Independent world cleanup continues and first failure
  is preserved. Release a module only after every tracked Runtime binding is detached; never unload code
  or destroy a Runtime implicitly. Bounded generation exhaustion fails closed. Scope does not promise
  a global process/module lease against untracked callers. Unstarted configuring Runtime objects can be
  discarded before releasing their copied callable tables; finalized/started objects require actual checked
  stop and detach. A managed library wrapper enforces registry module release before operating-system
  unload; no unchecked public raw-unload operation.
- Provide checked integer tick-to-nanosecond and host-frame conversion with overflow, zero/unsupported
  frequency and signed-duration bounds, preserved output on errors and explicit clock domain/rounding.
  No periodic waiting, RT guarantees or change to Runtime clock semantics.
- Build and execute a complete installed/relocated standalone host example using the supported Runtime
  and extension ABI v1, a genuine C shared library and actual Linux/Windows host load/symbol/unload operations.
  Exercise two isolated worlds and shared module references, failed quiescence with retry, actual unload
  only after all detach readiness, repeated load/run/close/unload and stale handles. No experimental plugin
  loader, hardware or engine stubs count as qualification.
- Add meaningful real-Runtime tests for capacity/duplicates/stale/foreign handles, failed registration/output
  preservation, configuration/start/step failures, world cleanup partial failures, multiple instances,
  generation retirement and checked time boundaries. Existing focused host-adapter sanitizer jobs must
  build/run new relevant tests without altering original fixtures/deadlines/gates. Relocated package consumer
  confirms source kit is self-contained and uses only installed SDK.
- Preserve release1.2.1 portableRT0, C ABI8/70 exports/SONAME8/fingerprint, device/extension ABI1, default
  installed SDK targets/headers, compiled Runtime/experimental sources and all predecessor tests/workflows.
  Add only shared-data source kit installation/hash bindings; no release policy change. Full local and
  all32 original exact-head hosted names/multiplicity plus source/risk/compatibility review and guarded
  target/canonical integration required.
- Reconcile all remaining integration against existing original cards and identify exact owner/environment
  next steps. Original M19-02/03/04 remain open for actual Unreal bindings/engine builds/world/PIE/packaged
  evidence. Do not claim portable lifecycle kit completes those cards. Preserve frozen112/30/13 ledgers
  and unsatisfied cyber/global acceptance; no redundant already-delivered exporter or host-adapter reimplementation.
validation:
