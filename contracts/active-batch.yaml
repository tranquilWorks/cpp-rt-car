  title: Benchmark CPU graph, executor, and memory
  goal: Add correctness-bound CPU graph/executor/memory providers to the merged M23-01 runner using only
    installed Runtime APIs. Cover the complete M23-02 family matrix with explicit timing boundaries, deterministic
    structural verification, bounded representative scaling, machine-readable observations, package consumption,
    and checked cleanup. Preserve the framework schemas, Runtime implementation, ABI and qualification
    boundaries.
