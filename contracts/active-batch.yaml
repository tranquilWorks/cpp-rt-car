schema_version: 1
batch:
  id: M23-03
  title: Benchmark rates, controls, replay, and observability
  goal: Add correctness-bound public-API benchmark cases for active CPU/device rates, cross-rate selection,
    optional shedding, live-control admission/publication, checkpoint/replay, Runtime watchdog/degradation
    and telemetry emission/export. Cover subsystem-call and complete-frame scopes, representative scaling
    and explicit full configured capacities through the unchanged M23 runner. Preserve Runtime, ABI, schemas,
    default SDK and qualification boundaries.
