  product: products/cpp-rt-car/product.yaml
  requirements:
  - products/cpp-rt-car/acceptance.yaml#CAP-M23
  milestone: products/cpp-rt-car/milestones/M23.md#M23-03--multi-rate-controls-replay-and-observability-benchmarks
  baseline_commit: 8ba51b3effa6174eaeb5382aef3404eeb5c160d1
  control_plane_repository: tranquilWorks/portfolio-control
  control_plane_path: products/cpp-rt-car/batches/M23-03R4.yaml
  control_plane_revision: 19eaf9eb45434584c3b5aecb1976a97d4e626dd8
  canonical_revision: 5e447cd44bfd5935d5d0053d7872f85db7dceeb4
  canonical_blob_sha: 6c27fb52b2d16c81b3c6515c6b6091be8fdae11e
  reconciled_target_main: 8ba51b3effa6174eaeb5382aef3404eeb5c160d1
  owner_direction: Finish PR 254 under standing bounded software planning, development, publication and merge authorization; no cybersecurity, Daybreak or Unreal scope.
  prerequisite: Queue 257, lossless replay 256 and watchdog 258 are merged; preserve their sources and evidence.
  retained_failure: PR 254 checkpoint e28a926aa115dcb19b46451f69bf16d806e91ac8, tree fbb8d51547500c61a30d808245df61cf94274b27. All 87 in-process cases, 51 allocation checks, ASan/UBSan, TSan and package chain pass; the CLI artifact sweep times out after 600 seconds on original device-loopback-8-flight1-8.
  diagnosis: DeviceManager submission_loop scans queued slots, then loads wake_sequence and waits. A producer can publish and notify between the empty scan and this load, parking the worker with work queued. Source ordering establishes this window; attributing the original CLI stall to it remains an inference.
  reproducer: A controlled empty-scan then producer-notify then worker-observe/wait model blocks until rescued by a second notification; observing before scanning returns immediately. A separate 1024-invocation public loopback diagnostic passes and does not erase the timeout.
  integration_order: Integrate the validated canonical contract, activate the isolated repair from reconciled main, verify and merge it, then reconcile PR 254 and reactivate unchanged M23-03. Do not mix benchmark edits into this repair.
