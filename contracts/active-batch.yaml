schema_version: 1
batch:
  id: M23-05R
  title: Retire completed command batches before graph release
  goal: Close the completed-batch cancellation window by retiring ordinary batch ownership before graph
    completion can return control to the host; preserve bounded ownership and all existing test oracles.
sources:
  product: products/cpp-rt-car/product.yaml
  requirements:
  - products/cpp-rt-car/acceptance.yaml#CAP-M23
  milestone: products/cpp-rt-car/milestones/M23.md#M23-05--regression-analysis-and-extension-kit
  baseline_commit: 37c3b155894133789621d41b4233c8edde79d023
  control_plane_repository: tranquilWorks/portfolio-control
  control_plane_path: products/cpp-rt-car/batches/M23-05R.yaml
  control_plane_revision: 5b258a4dc302a2ccf2c92162fe550144c8c694dc
  owner_direction: Finish feature PR 261 under standing scoped development, publication and exact-head
    integration authorization. No cybersecurity, Daybreak or Unreal.
  prerequisite: M23-04 PR 260 is merged; retain all prior Runtime repairs and benchmark implementations.
  retained_failure: 'PR 261 head 4f780cf23096155da50ff61a1c5fe4970c004a88, tree 5612a378978a00c5afe06cab3db4c9ed87143236.
    Extra full optional CTest run failed RepeatedSubmissionLifecyclesKeepIndependentOwnersDrained at line
    1807: expected zero cancellations, observed one. Test completed in 84 ms with unchanged 60-second
    device timeout. A later 50-repeat pass does not erase the failure.'
  diagnosis: finish_batch_slot releases the executor graph before decrementing outstanding work and publishing
    Free. Host step may return and stop may cancel an Owned slot whose successful completion already released
    the graph. Source establishes this window; the original interleaving was not instrumented.
  reproducer: A deterministic regression must exercise the production retirement helper with host-stop
    observation and immediate slot reuse at the graph-publication boundary; the original release-before-retirement
    ordering must fail the same assertions.
  integration_order: Integrate this canonical contract, activate the isolated repair from target main,
    verify and merge, then reconcile PR 261 and separately reactivate M23-05. Preserve the original functional
    failure and all feature implementation.
  hosted_failure: 'Repair head bbeb05a5aecc6fdb2f185228c7319b904081d0ce, workflow 36092659651: Windows
    Debug job 107938159419 failed two existing MixedRateConformance tests at startup stage 4 with device_timeout
    and zero callbacks/actions. Ordinary CommandBatch tests passed. Windows RelWithDebInfo job 107938159362
    passed all 49 CTest entries then matrix fail-fast cancelled the artifact step. The rate-owned startup
    path is unchanged by this repair; its 80-ms fixture safe-transition timeout remains binding.'
  withdrawn_attempt: Head cc898379261a32168ccc4fda5dd912349d42740b Windows Debug job 107942676941 passes
    original conformance outputs but fails all new parked-worker assertions. NativeThreadPolicyProvider
    explicitly reports nondefault policy unsupported on non-Linux, so the attempted park change cannot
    solve the Windows setup-budget assumption and must be removed completely, not skipped or relabeled
    as supported.
  canonical_revision: 09ed06bebf21ece833ffa1626826eaf99e042521
  canonical_blob_sha: 95def2eaf6bb45783bbc698ac195474ef0fe995a
