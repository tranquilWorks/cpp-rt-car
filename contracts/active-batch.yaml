acceptance:
- 'Start from clean target main b52b42a6c64066553ce55fb08c874061d78e036e, the merged PR #251. Retain M23-01''s
  initial Clang failure and local full-profile dependency blockage as historical evidence. Its repaired
  head cb136d671088ed01bc75b5be0c67d991e7814cdf passed hosted CI run 34080242894 before merge. Merge and
  CI are observed facts; do not invent a separate human-review record. This contract must be validated
  and integrated in the control plane before target activation; target activation binds the actual canonical
  blob/revision without changing the contract''s audited planning baseline.'
- Add one explicit instance-local ProviderV1 with ID rtfw.cpu, implementation version 1, using only installed
  rt/runtime.hpp and its public dependencies plus rtfw/benchmark.hpp. Provider registration and list/describe
  are side-effect-free metadata operations. They do not create Runtime workers, acquire resident storage,
  change policies, or execute workloads. CLI retains the unchanged rtfw.self provider and exact list/describe/run
  selection, rejects invalid input and output destinations before fixture preparation, then prepares only
  the selected CPU case on the host control thread.
- Keep rtfw::benchmark itself free of Runtime and experimental dependencies. Only the CPU provider and
  CLI link rtfw::runtime explicitly. Preserve the existing benchmark library header/ProviderV1 API, all
  three schema versions, artifact validator, canonical encodings, atomic publication and default benchmark-OFF
  SDK inventory. Install the CPU provider as example source under share/rtfw/bench/examples, not as another
  public compiled ABI or package component. Installed consumers compile that source against explicitly
  requested benchmark and Runtime targets without private headers.
- Publish a checked finite case inventory in bench/fixtures/cpu_cases.json and match it exactly against
  provider enumeration. It covers all thirteen families below, at least two distinct declared workload
  points for each scalable family, positive bounded counts, canonical sorted IDs, operation units, correctness
  invariants, measurement scope, and counter availability. Bound the complete inventory to 64 cases, each
  with at most 16 parameters/counters, at most four workers, 64 graph phases, 4096 entities, and 256 nested
  tasks. Each descriptor uses two warm-ups and five measured repetitions. These are representative characterization
  sizes, not maximum-capacity certification.
- Graph compile/finalize cases cover narrow/deep and wide/shallow valid DAGs at 4 and 32 phases, and deterministic
  malformed dependency rejection. With unchanged ProviderV1 timing, construction/configuration/registration/finalization/inspection/checked
  cleanup within invoke are included and the descriptor configuration calls this lifecycle scope. Do not
  call the observed duration isolated graph-compiler or finalize-only time. Assert compiled count, dependencies/topological
  validity, and successful cleanup; invalid graphs must fail with the contracted status before callbacks
  or workers run.
- Steady-state graph cases include empty callbacks, width/depth at 4 and 32 phases, fixed work per phase,
  static_deterministic and bounded_throughput policies, worker counts 1/2/4, task grain points 1/16/64
  over fixed entity work, and entity counts 64/1024/4096. Prepare/configure/finalize/start before Runner::run,
  time only complete invoke work including Runtime::step and observation collection, and perform checked
  stop after run before publication. Declare included observation cost; no hidden timing subtraction or
  secondary undeclared clock is permitted.
- Nested parallel_for and deterministic parallel_reduce cases use two nesting depths, fixed preallocated
  per-index data and reduction partials, exact accepted range coverage without duplicates, and an independently
  computed integer oracle. Invoke must perform actual public TaskContext operations, not substitute a
  serial loop for the Runtime work. Callback state is thread-safe, bounded, and allocation-free; callback
  failures must propagate and fail the result.
- Queue-pressure cases use the actual Runtime host_adapter reservation plus a bounded caller-owned host
  queue with deterministic admission/rejection scheduling. Cover an accepted prefix and guaranteed queue_full
  without timing sleeps, unbounded spinning, or a mocked observation that bypasses Runtime. Reconcile
  attempted, accepted, completed and rejected operations; every accepted child must settle, no rejected
  child runs, and subsequent legal work succeeds. Native queue-pressure characterization may have schedule-dependent
  rejection counts and must not assert a portable exact number or speedup.
- Native-worker versus host-job-adapter cases execute the same correctness-bound workload with explicit
  policy and worker geometry. The included bounded host adapter is a declared fixture, not a claim about
  an external engine's scheduler. Host submit/help/context callbacks obey public capacity, generation,
  worker-index, no-inline-on-failure, and lifetime rules; all fixed queue/scratch storage is prepared
  before measurement. Host-owned resources remain separate from Runtime-owned MemoryPlan counters.
- Trace-off/on paired cases execute identical workloads at trace capacities 0 and 256, expose observed
  emitted/dropped/overwritten events where the public surface supplies them, and verify identical application
  results. Trace collection and event ordering must not be falsely deterministic across workers. These
  cases measure trace impact only; general exporters, rate/control telemetry, replay, and watchdog cases
  remain M23-03.
- Memory cases cover default allocation and an explicit host-owned bounded memory provider at two phase/task
  scratch sizes, actual acquire/apply/observe/rollback/release ownership, successful and injected-failure
  cleanup, zero-byte inactive regions, and the unchanged six-row MemoryPlan equation. The deterministic
  provider's policy/residency observations are declared simulated. Add an explicitly selected Linux base-page/prefault/residency
  case using the existing public process-local provider with no mlock, huge-page provisioning, affinity/NUMA/governor
  mutation, or privileged operation. Unsupported native observations produce NOT RUN before successful
  warm-up; unavailable residency is not reported as measured zero or qualified locking.
- Multiple-runtime cases exercise two simultaneously live independent Runtime objects with separate workload
  data, queues, providers and counters, including stopping one while the other continues. Run one deterministic
  same-owner alternating case; separate focused concurrency tests may use explicit bounded fixture-owned
  threads with independent owners and joined teardown. Lifecycle cases repeatedly construct/configure/finalize/start/step/checked-stop
  fresh instances at two bounded cycle counts. Follow actual Runtime lifecycle semantics; do not reinterpret
  stop as permitting an unsupported restart of a terminal object.
- Use only observed public executor/trace/provider/resource counters and application oracle counts. Do
  not substitute declared workload size for completed work. Distinguish per-invocation deltas, gauges
  and sums in the inventory; summed MemoryPlan gauges are not a peak, RSS, residency, or leak measurement.
  Counter totals must fit existing integer limits. Throughput is derivable from successful completed operations
  and nonzero real measured nanoseconds; fake-clock throughput is structural only. Existing p50/p95/p99/max
  remain runner-supplied. Comparison policy stays none and no threshold, noise filtering, baseline delta,
  confidence, or optimality claim is added.
- Warm-up is excluded from retained sample/counter totals and all stateful cases use exact ordinal/frame
  advancement without cross-run contamination. Every measured observation asserts independent output checksums,
  expected statuses, bounded resource ownership and operation reconciliation. Incorrect output, malformed
  provider state, runtime failure or incomplete cleanup yields an existing failure status and bounded
  nonsensitive diagnostic. Cleanup failure may never leave a success bundle; preserve borrowed ownership
  until checked teardown succeeds or explicitly fail and retain it for caller resolution.
- Fake runner clocks test exact invocation/warm-up/sample counts and structural outcomes. Deterministic
  byte-equality fixtures use constant declared identity and deterministic host-adapter/oracle observations;
  exclude inherently platform-dependent MemoryPlan sizes and scheduler-dependent counters from cross-platform
  byte-equality claims. Never overwrite a real observation with a fixed number to force equality. Real-clock
  smoke is portable_characterization with correctness gates only, not elapsed-time thresholds.
- Verify steady-state Runtime and workload callbacks allocate no heap and create no hidden thread; runner
  Observation vectors, metadata encoding and file output remain host-control operations outside the guarded
  Runtime callback lanes. Preparation and lifecycle cases may allocate and start their explicitly declared
  fixed worker team on the host. Independent providers/runners and multiple Runtime instances remain isolated
  under TSan; tests use bounded synchronization and cleanup rather than sleeps.
- Source-tree, independent add-subdirectory, installed non-default-prefix, archive-relocated and benchmark-unrequested
  consumers remain usable. Compile installed CPU provider source with public targets, run a deterministic
  CPU case, and validate artifacts using the unchanged offline validator. The optional install ledger
  accounts for every new example/fixture file and no Runtime/private header or project warning policy
  leaks to consumers.
- Preserve C ABI v8's exact 70 exports/fingerprint 0xd0e7a5a14bf35f97 and SONAME librtfw.so.8, device
  ABI v1, extension ABI v1, HAL tables, Runtime statuses and source implementation, profile schema 7/25
  keys, all checkpoint/action/replay/control/observability schemas, MemoryPlan equations, release 1.2.1,
  support matrices, Apache-2.0 and prior evidence.
- Update target current state, handoff, build/docs/roadmap, static source manifest, release digest ledger,
  CI and retained M23-02 evidence with exact passed/failed/blocked/unperformed results. Run focused and
  full local checks and mandatory hosted gates; do not waive or reclassify failures. M23/CAP-M23 remain
  incomplete pending M23-03 through M23-05; M24-M26, real device providers, controlled timing, physical/HIL/RT
  qualification, Unreal, signing, release and deployment remain outside this batch.
validation:
