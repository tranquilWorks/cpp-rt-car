  - cmake -S tests/benchmark_fixtures/cpu_consumer -B build/m23-cpu-consumer -DCMAKE_PREFIX_PATH="$PWD/build/m23-cpu-prefix"
  - cmake --build build/m23-cpu-consumer --parallel 2
  - ctest --test-dir build/m23-cpu-consumer --output-on-failure
  - ./scripts/agent-verify.sh full
  - python3 tools/check_c_abi.py --library build/m23-cpu/librtfw.so
  - readelf -d build/m23-cpu/librtfw.so | rg 'SONAME.*librtfw.so.8'
  - ./scripts/verify-portable-assurance.sh --build-dir build/portable-assurance --source-commit "$(git
    rev-parse HEAD)" all
  - git diff --check
  - git diff --name-only b52b42a6c64066553ce55fb08c874061d78e036e
  focused_tests_to_add:
  - Exact finite inventory and thirteen-family coverage, deterministic ordering, two-or-more scaling points,
    bounds, descriptor digests/counter units/timing-scope checks, metadata-only list/describe and unknown-input
    rejection before preparation.
  - Independent graph and integer-work oracles, non-overlapping parallel ranges, reduction-tree correctness,
    configured worker/grain/entity geometry, exact warm-up exclusion and state reset across reruns.
  - Actual Runtime accepted-prefix queue_full, completion drain and subsequent recovery; host queue/scratch/generation/lifetime
    rules; no sleeps or unbounded waits.
  - Trace-off/on application parity, truthful variable trace counters, MemoryPlan six-row accounting,
    provider acquire/rollback/release exact ownership and injected failures, native unavailable-before-warmup
    behavior.
  - Checked cleanup before artifact publication on success/failure; repeated legal lifecycle and two live
    independent Runtime objects, joined concurrent owners, no callback allocation and no hidden threads.
  - Canonical deterministic host-adapter artifacts with constant identity across compilers; unchanged
    M23-01 self/external provider and malformed-artifact/privacy/atomic-publication regressions.
  - Clean optional and default SDK inventory, installed/relocated/add-subdirectory CPU example consumer
    with no private header or leaked policy, unchanged ABI and Runtime source hashes.
  required_ci:
  - Existing Linux GCC11/Clang14 Debug/RelWithDebInfo ASan+UBSan matrices and Windows MSVC matrices, plus
    optional CPU provider build and every deterministic case.
  - Existing GCC ThreadSanitizer job including CPU provider isolation, host adapter queue, nested work,
    independent Runtime ownership and prior executor/memory/control tests.
  - GCC/Clang FMA determinism exchange plus MSVC deterministic fixed-identity host-adapter fixture; native
    scheduler observations and platform resource sizes excluded from byte equality without falsifying
    counters.
  - Default and optional installed/add-subdirectory/archive-relocated/non-default-prefix package checks,
    unchanged C ABI export/fingerprint/SONAME and release digests.
  - Documentation contract, Clang14 portable static/fuzz/artifact assurance, dependency review, scaling/autotune
    and all prior no-allocation and compatibility gates.
  manual:
  - Review timing boundaries, public API-only provider ownership, deterministic oracle/counter validity,
    queue rejection/cleanup, host-adapter fidelity, privacy, package compatibility and claim accuracy.
    Preserve applicable repository review gates; standing software publication authorization does not
    manufacture a review result.
  - Controlled-host performance threshold approval, actual physical/RT qualification and release promotion
    remain separate future gates; they are not prerequisites for correctly labeled portable structural
    implementation.
risk:
  class: high
  hazards:
  - Lifecycle/setup/inspection work misrepresented as isolated dispatch or finalize latency.
  - Noisy native scheduling or platform-dependent resource observations mislabeled deterministic or used
    as elapsed pass/fail gates.
  - Fixture computes declared counters without executing or validating actual Runtime work, masks rejection,
    leaks borrowed ownership, or publishes success before stop.
  - MemoryPlan logical bytes mislabeled resident/peak/process memory; simulated provider observations
    mislabeled OS readback.
  - Optional provider leaks Runtime or experimental dependencies into the standalone framework/default
    SDK, or changes Runtime/private headers to instrument timings.
  stop_conditions:
  - Audited target baseline or predecessor merge/CI no longer matches; reconcile/rebase contract before
    activation, never silently reuse stale scope.
  - Any required implementation changes Runtime source/header, frozen framework API/schema/validator,
    ABI/support/release boundary or another forbidden path.
  - An actual Runtime defect prevents the declared public-API case; retain a reproducer and request a
    separate repair batch rather than fake successful measurements.
  - Isolated timings require new runner lifecycle hooks or a second clock, or a missing counter requires
    Runtime instrumentation; retain the declared honest whole-invocation scope or stop for a separate
    API batch.
  - Verification requires weakening a gate, timing thresholds on uncontrolled hosts, privileged mutation,
    fabricated counters, uncontrolled worker counts, unsafe teardown or relabeled physical evidence.
rollback:
  strategy: Revert the CPU provider/example sources, CLI registration, focused tests and optional package/CI/docs/digest/governance
    updates as one bounded batch. The merged M23-01 standalone framework and self/external providers remain
    usable; Runtime and existing schemas require no migration.
  data_migration: none
  release_action: No release, signing, support promotion, threshold approval, deployment or repository-setting
    change.
evidence:
  output:
  - docs/evidence/M23-02-<date>.md
  - Exact control canonical blob/revision and target baseline/head/tree, acceptance map, changed paths,
    commands/exit codes, local logs, CI run/job IDs and actual review state.
  - Complete finite case inventory, structural/capacity family coverage, declared timing scopes, operation/counter
    formulas and observed independent-oracle values.
  - Raw/summary/descriptor bundles validated offline; fake structural and real portable characterization
    labeled separately, with sanitized source/build/host identity.
  - No-allocation, failure/recovery/checked cleanup, isolation/concurrency, package inventory/relocation,
    ABI/SONAME and preserved Runtime/prior-evidence hashes.
  - Verified recovery Git bundle, baseline-relative patch and exact source/PR IDs before session exit;
    source publication is not implementation verification.
  - Every failed, blocked or unperformed compiler/sanitizer/control-host/native-residency/hardware/RT/release
    gate and residual timing/fixture limitations.
  claim_boundary: Only CPU/graph/executor/memory provider implementation, deterministic structural correctness
    and portable characterization on executed toolchains. Simulated memory/host fixtures are labeled.
    No portable performance guarantee, optimality, comparison/threshold, maximum-capacity certification,
    physical/RT/HIL, Unreal, signing, release, deployment or M23/CAP-M23 completion.
