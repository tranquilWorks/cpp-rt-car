acceptance:
- Preserve the merged M24-01 entry points, model, seeded initial state, integer units and independent
  closed-form oracle. Add separately named portable and opt-in real pipeline entry points. Split the same
  global seeded particle sequence into at most two independent contiguous shards, with total count 1..4096
  and 1..1024 completed model steps. Count one uses one lane. Kernel and Graph paths compare every particle
  field after every completed step against the existing oracle, and against each other in finite parity
  tests. No general physics or floating-point claim.
- Use installed public Runtime, CudaDeviceBackend and HAL-v2 APIs exclusively. Each lane declares CPU
  preparation -> ordered H2D, D2D, kernel-or-Graph, D2H batch -> CPU validation/publication. Use disjoint
  named staging and work buffers, explicit access/dependency declarations, fixed copied kernel arguments
  and a separate same-backend timeline per lane. All primary dispatch/poll flows pass through Runtime;
  no backend-private or direct-submit substitute.
- Use one caller-owned context/module/function, at most two caller-owned streams and two concurrent batches,
  four named device allocations, and fixed preallocated host staging/work/original arrays per instance.
  Bind borrowed device addresses before backend initialization and register host spans through the public
  staged-memory domain. Pre-instantiate one kernel Graph per active lane against its exact work address/count
  and bind the named buffer to the backend Graph registry. Graph execution performs no runtime graph construction
  or argument mutation. Runtime memory budget remains at most 128 MiB, fixture storage at most 32 MiB
  and CPU workers at most two.
- Provide kernel/Graph dispatch and ordinary-frame/active-rate schedule selections with strict CLI parsing
  and deterministic summaries. The active selection must enable the existing rate-execution policy, bind
  CPU/device phases and complete admitted device-rate references, not merely attach reference metadata.
  Use one documented common validation period and per-lane maximum-in-flight one; distinguish the generous
  scheduling envelope from the unchanged 1/256-second physics model step. Confirm the compiled active
  device plan and exact release sequences, timelines, publications and final output. Do not imply cross-rate
  channel, heterogeneous periods, controlled timing or CUDA support qualification.
- The portable driver must move actual H2D/D2D/D2H bytes, implement an independent iterative kernel and
  a pre-registered Graph execution path over those bytes, and observe context/stream/argument/graph identities.
  Check exact byte and dispatch counts, stream use, buffer registration conservation and absence of backend
  allocations/frees for caller-owned buffers. Never use the CPU oracle to fabricate device output.
- 'Prove two-lane in-flight staging with bounded deterministic coordination: hold terminal events, observe
  both batches accepted on distinct streams before releasing either, and verify no premature CPU validation/publication.
  Reuse staging only after its previous terminal completion and dependent validation. Test independent
  per-lane timelines, odd/count-one boundaries, graph/kernel output parity, simultaneous maximum count/steps,
  one/two workers and independent instances. Do not claim measured hardware overlap or speedup.'
- Allocate and instantiate resources before Runtime start; all declared steady steps remain allocation-free.
  Checked Runtime stop must precede graph, allocation, module, stream and context destruction. Retryable
  unregister/shutdown or caller-resource cleanup failure retains every possibly-live resource. Include
  malformed/missing session/Graph/address rejection, Graph-launch rejection, corrupted D2D/output and
  failed-cleanup retry tests with no successful publication of failed work. Preserve actual fault evidence;
  full pressure/cancellation/device-loss coverage belongs to M24-03 and production defects need separately
  scoped repair.
- The optional real host allocates device buffers, creates both streams and Graph executables using the
  actual CUDA Driver API and executes the same pipeline and oracle as portable mode. Reuse the shipped
  kernel source and reproducible nvcc build. Missing device/driver reports NOT RUN with exit 3; malformed
  input exits 2; execution/oracle/cleanup errors exit 1; checked success exits 0. Portable builds must
  not require a toolkit or probe hardware. Compile/link the actual installed real pipeline and exercise
  help without device access in toolkit CI.
- Extend the installed-source data ledger with the exact pipeline inventory and document ownership, staging,
  active scheduling, capacity and mode commands. Build/run a separate find_package consumer after custom-prefix
  archive relocation/source isolation, plus add_subdirectory consumption. Preserve all previous nine-source
  entries, default SDK target/header/ABI surface, original benchmark/package assertions and all 207 benchmark
  cases.
- Add meaningful pipeline tests and actual CLI mode coverage to the existing GCC/Clang/FMA, MSVC, ASan/UBSan,
  TSan, static-analysis and package jobs without removing prior checks. Preserve M24-01 tests and the
  512 KiB actual CLI process-stack method; do not invent a Debug/TSan embedded-thread guarantee. Verify
  zero steady allocations, stable ABI v8/70 exports/fingerprint/SONAME 8, device ABI v1 and release 1.2.1.
  Refresh only exact added/modified source and document digests.
- Record acceptance mapping, commands and retained results, exact control/target identities, source diff,
  risks and rollback. Retain the M24-01 local timeout separately from its 32 passing hosted checks. M24-03/04,
  the 90-percent overall and 100-percent critical maturity denominator, physical CUDA, controlled performance,
  human review, RT1/RT2 and M25/M26 remain separate and unperformed unless named evidence exists.
validation:
  local:
  - git status --short --branch
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - cmake -S . -B build/m24-pipeline -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=OFF
    -DSIM_SANITIZERS= -DSIM_WERROR=ON
  - cmake --build build/m24-pipeline --parallel 2
  - ctest --test-dir build/m24-pipeline --output-on-failure
  - python3 tests/cuda_physics/verify_package.py --work-directory build/m24-pipeline-package
  - ./scripts/agent-verify.sh full
  - python3 tools/check_c_abi.py --library build/m24-pipeline/librtfw.so
  - git diff --check
  focused_tests_to_add:
  - Actual four-mode CLI and model parity, deterministic maximum/odd/count-one coverage, active compiled
    plan and release identities.
  - Observed two-stream in-flight staging, actual D2D transfer, fixed Graph bindings, no early publication
    and exact ownership/call counts.
  - Invalid session, corrupted transfer and Graph rejection, retryable cleanup; instrumented no-allocation/ASan/UBSan/TSan
    and actual 512 KiB CLI.
  - Archive-relocated and embedded installed pipeline sources, optional actual CUDA host/Graph/kernel
    compile and help.
  required_ci:
  - All prior 32 exact-head hosted checks, with additive portable sample/tests in existing compiler/FMA/MSVC,
    sanitizer, static and package jobs.
  - Optional CUDA toolkit compile/link and reproducible kernel compilation; no GPU required or physical
    evidence inferred.
  - Original ABI, release, no-allocation, package, benchmark and determinism-artifact gates remain unchanged.
  manual:
  - Independent ownership/arithmetic/graph/rate review remains unperformed unless actually obtained; agent
    self-review is labelled.
  - Physical CUDA requires an accessible named device tuple; absence remains NOT RUN and does not block
    portable software.
risk:
  class: high
  hazards:
  - Graph bindings point at different storage from declared Runtime buffers, creating a false parity result.
  - Buffer or stream reuse precedes terminal completion, corrupting an independent lane.
  - Active-rate metadata is mistaken for actual active dispatch, or scheduling envelope for physics timestep/real-time
    qualification.
  - Failed cleanup destroys caller-owned resources still reachable by Runtime/CUDA.
  stop_conditions:
  - Canonical planning contract is not integrated before activation, or target baseline moves without
    reconciliation.
  - Runtime/backend/public ABI/schema or another forbidden path needs a change; retain a reproducer and
    plan a separate repair.
  - Success requires weakened tests, invented resource observations, unbounded waits, unsafe cleanup or
    absent hardware evidence.
  - New physical/controlled/signing/release/deployment authority or a substantive product decision would
    be required.
rollback:
  strategy: Revert only the isolated pipeline entry points, added source-data inventory, tests and wiring
    as one batch. Preserve the merged M24-01 reference, Runtime/backends, all prior tests/evidence, ABI,
    support and benchmark inventories.
evidence:
  output:
  - docs/evidence/M24-02-<date>.md
  - Exact head/tree, control revision/blob, scoped diff, local and hosted outcomes with all failures retained.
  - Per-mode oracle/parity, active plan, observed staging, allocation/lifetime and installed-consumer
    evidence; physical results only when actually run.
  claim_boundary: Bounded validation-model and portable injected-driver software evidence. No general
    physics engine, CAP-M24 closure, real CUDA support/RT qualification, controlled performance, Unreal,
    cybersecurity, Daybreak, signing, release or deployment claim.
