acceptance:
- Ship a readable 30-60 physical-line raw public C++ hello graph with two dependent phases, explicit capacities
  and borrowed state ownership. Check configuration, registration, resource/dependency declarations, finalization,
  start, every step and stop. No callback allocation, I/O, exceptions, hidden helpers or new Runtime API;
  output only on the host after successful checked stop.
- Build the same source through installed find_package(rtfw CONFIG REQUIRED COMPONENTS runtime) and add_subdirectory
  using only rtfw::runtime. Install source, standalone consumer CMake, exact-output check and self-contained
  first-use guide under the configurable data directory. Preserve default exported target/header inventory
  and all existing samples and consumers.
- Make README first-use instructions consumer-first with exact commands and expected deterministic output,
  prerequisites, ownership/capacity/lifecycle explanation and concrete CMake/status troubleshooting. Ship
  the relevant first-use material so an archive consumer needs no private source setup. Keep developer
  build/test and legacy CLI documentation clearly separate and preserve their existing validation.
- Exercise clean tests-OFF installation, archive relocation with the original prefix removed, custom install
  paths and paths with spaces, installed-only source compilation and execution, and source embedding.
  Check no source/build/original-prefix include leakage and no repository-private headers. Validate exact
  output/exit status, source-line bounds, missing package/source and insufficient-capacity diagnostics
  with independent negative controls.
- Quarantine legacy examples by explicit directory and source notices and remove the broken generic manual
  compile recommendation; preserve legacy code/behavior and experimental-only build choices. samples/README
  points newcomers to hello and clearly identifies experimental SimCore samples.
- Extend existing package consumer, documentation and static gates additively, with hello in ordinary
  root CTest compiler/FMA/MSVC/ASan suites and explicit local TSan. Preserve every existing test, M23
  benchmark, M24 matrix/evidence digest and physical NOT RUN row. No production, ABI, schema, dependency,
  warning-policy or support claim changes.
- Record canonical revision/blob, baseline, acceptance mapping, exact commands/results, negative controls,
  self-review, rollback and residual/unperformed gates. Run full local verification, package/ABI/static/sanitizers
  and all32 exact-head hosted checks before scoped integration. Close M25-01 only; typed helpers/backend/CIL/host
  adapter/full docs and independent novice review remain separate.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - python3 tests/hello_runtime/verify_package.py --work-directory build/m25-01-package
  - ./scripts/agent-verify.sh full
  - python3 tests/cuda_physics/verify_package.py --work-directory build/m25-01-cuda-package
  - python3 tools/check_c_abi.py --library build/agent-quick/librtfw.so
  - Local ASan/UBSan with leak detection and TSan hello exact-output and failure checks; Clang14 static
    analysis.
  - git diff --check
  focused_tests_to_add:
  - Root and shipped hello exact output and nonzero failure status; two phases over three frames with
    checked stop.
  - Relocated archive and embedded source consumers; custom include/data directory and spaces; complete
    prior raw C/C++ consumers.
  - Line/installed inventory/transcript checks, missing package/source, insufficient callback capacity
    and output-oracle tamper negative controls.
  required_ci:
  - All32 existing exact-head target check records with unchanged name/multiplicity inventory, no failing
    gate or unresolved review thread.
  - Existing compiler/FMA/MSVC/ASan, static, package and documentation checks gain hello coverage without
    removing prior gates.
  manual:
  - Independent first-use walkthrough by an unfamiliar human remains UNPERFORMED.
  - No hardware, RT1/RT2, controlled performance, Unreal, signing/release/deployment qualification.
risk:
  class: moderate
  hazards:
  - A short example hides unchecked lifecycle errors or borrowed state lifetime.
  - An installed example accidentally relies on repository paths, test dependencies or default install
    layout.
  - Documentation presents experimental legacy code or portable smoke evidence as supported hardware/RT
    behavior.
  stop_conditions:
  - A production or forbidden path change is needed; retain reproducer and plan a separate repair.
  - A mandatory test would need weakening or canonical planning has not integrated.
rollback:
  strategy: Revert the additive hello source, package/test wiring and onboarding changes, restoring previous
    entry docs while preserving Runtime, SDK exports, M23/M24 evidence and legacy implementation.
evidence:
  output:
  - docs/evidence/M25-01-<date>.md
  - Exact canonical/head/tree/check identities, package transcripts and retained negative controls.
  claim_boundary: Portable consumer usability only. No M25 milestone closure, independent novice review,
    hardware/RT, controlled performance, Unreal, signing/release/deployment claim.
