acceptance:
- Preserve M24-01 model, original entry points/tests and all M24-02 tests. Keep integer exact equality
  (zero tolerance) across all nine fields, seeds, count-one/odd/maximum counts, steps, workers and four
  kernel/Graph/frame/active modes. No floating-point model is introduced; nonzero tolerance is inapplicable
  to this exact integer model. Retain maximum four-mode parity gates rather than substituting tolerant
  comparison.
- Add a separately named finite portable conformance executable and installed source consumer over the
  actual public Runtime/CudaDeviceBackend pipeline. Any additive scenario configuration hooks are configuring-only,
  copied, null by default and bounded. Distinguish real CUDA-driver fault injection from explicitly labeled
  HAL protocol-adapter injection; primary dispatch/poll must still run through Runtime and the actual
  CUDA backend, not a direct-submit substitute.
- Observe both accepted lanes at the configured in-flight limit, reject extra/undersized capacity or injected
  queue-full admission without unbounded retry, and preserve no-early-publication assertions. Reject malformed
  commands and stale or mismatched batch/timeline completion identities before successful CPU publication.
  Include a negative control showing each injected fault was actually reached.
- 'Exercise driver timeout after an observed accepted batch, cancellation/stop while work is pending,
  and late terminal readiness after timeout/stop. CUDA cancellation is unsupported: prove checked stop
  requests, suppression of publication and retained ownership rather than inventing device preemption.
  Use bounded synchronization and configurable synthetic driver time where possible; retain real Runtime
  limits and existing test deadlines. Ordinary stopped graphs report cancellation immediately; active
  noncancelable references may remain quarantined until their unchanged finite completion budget and report
  timeout. Assert the exact schedule-specific outcome, with no publication and checked cleanup in both
  cases.'
- 'Inject launch/query failure requiring quarantine and reset, failed reset synchronization followed by
  retry, and permanent context loss. Verify health, generation/reset accounting and no release of possibly-live
  borrowed storage. The CUDA backend rejects reset of a lost context: prove that rejection and checked
  teardown, then recover with a fresh caller session/Runtime. Do not imply in-place lost-context recovery.'
- Exercise failed host registration/startup rollback, failed unregister, event destruction and pending/quarantined
  synchronization cleanup with exact live-resource counters and retry. Check event create/destroy, host
  register/unregister, caller storage ownership, absence of backend alloc/free, no synchronizing vendor
  calls in normal steady steps, and zero steady new allocations. Real cleanup must precede caller close;
  leak evidence includes deterministic resource conservation and supported ASan leak scanning, with actual
  tool limitations retained.
- Repeat bounded lifecycle runs, verify supported stopped/configured transition behavior and fresh-instance
  recovery, and run independent Runtime instances concurrently with distinct seeds/modes and isolated
  injected faults. A failing instance cannot alter a healthy instance output, timeline or resource ledger.
  No destructor may silently discard unresolved ownership.
- Build/run the exact installed conformance sources after custom-prefix archive relocation/source isolation
  and add_subdirectory embedding. Preserve all previous nine reference and five pipeline inventory entries,
  default SDK targets/headers, release 1.2.1, C ABI v8/70 exports/fingerprint/SONAME8, device ABI v1 and
  all 207 benchmarks. Refresh only changed source/document hashes.
- Add the finite conformance gate to existing GCC/Clang/FMA/MSVC, ASan/UBSan, TSan, static-analysis and
  package jobs without removing prior gates. Preserve the actual 512 KiB CLI process-stack check and original
  timeouts. Run focused, strict portable, required full, ABI, relocated original SDK, root/installed real
  CUDA compile/help and exact-head hosted checks.
- Retain exact control/target identities, acceptance mapping, commands, all failures and corrections,
  agent self-review, rollback and unperformed evidence. M24-04 owns benchmark/profile/capability-matrix
  closure; M24/CAP-M24, physical CUDA, controlled performance, independent human review, RT1/RT2, M25/M26,
  signing/release/deployment remain separate. Production defects require separately scoped repair; no
  forbidden production changes or weakened assertions. Preserve merged M24-03R stopped-retirement/uncertain-registration
  repair source and regressions unchanged. Retain initial conformance expectation failures and both old-source
  negative controls. Preserve M24-03R2 private Runtime ownership synchronization and its independent actual
  Runtime/old-source TSan regression unchanged. Concurrent fixtures configure on the control thread, prove
  simultaneous accepted work, and inject isolated loss without relaxing the actual512KiB process limit.
validation:
  local:
  - git status --short --branch
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - cmake -S . -B build/m24-lifetime -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=OFF
    -DSIM_SANITIZERS= -DSIM_WERROR=ON
  - cmake --build build/m24-lifetime --parallel 2
  - ctest --test-dir build/m24-lifetime --output-on-failure
  - python3 tests/cuda_physics/verify_package.py --work-directory build/m24-lifetime-package
  - ./scripts/agent-verify.sh full
  - python3 tools/check_c_abi.py --library build/m24-lifetime/librtfw.so
  - git diff --check
  focused_tests_to_add:
  - Finite four-mode Runtime failure/lifetime conformance and source-consumer entry point.
  - Observed capacity, queue rejection, invalid descriptor, timeout, stop/cancel, stale completion, quarantine/reset
    and permanent loss with positive injection counters.
  - Retryable cleanup/resource conservation, repeated lifecycle, isolated concurrent fault, no-allocation
    and sanitizer/leak checks.
  - Preserved M24-01/02 parity/CLI/stack and original SDK/package/ABI/real CUDA compile/help gates.
  required_ci:
  - All prior 32 exact-head hosted checks, with additive portable sample/tests in existing compiler/FMA/MSVC,
    sanitizer, static and package jobs.
  - Optional CUDA toolkit compile/link and reproducible kernel compilation; no GPU required or physical
    evidence inferred.
  - Original ABI, release, no-allocation, package, benchmark and determinism-artifact gates remain unchanged.
  manual:
  - Independent ownership/arithmetic/graph/rate review remains unperformed unless actually obtained; agent
    self-review is labelled.
  - Physical CUDA requires an accessible named device tuple; absence remains NOT RUN and does not block
    portable software.
risk:
  class: high
  hazards:
  - Protocol injection mistaken for native CUDA behavior or portable evidence mistaken for hardware qualification.
  - Late completion publishes failed work or permits staging reuse before terminal retirement.
  - Cleanup failure loses resources or reset is incorrectly claimed to recover permanent context loss.
  - Fault coordination adds races, unbounded waits, hidden allocation or misleading timeout evidence.
  stop_conditions:
  - Canonical planning contract is not integrated before activation, or target baseline moves without
    reconciliation.
  - Runtime/backend/public ABI/schema or another forbidden path needs a change; retain a reproducer and
    plan a separate repair.
  - Success requires weakened tests, invented resource observations, unbounded waits, unsafe cleanup or
    absent hardware evidence.
  - New physical/controlled/signing/release/deployment authority or a substantive product decision would
    be required.
rollback:
  strategy: Revert only M24-03 conformance sources, configuring-only hooks, wiring and documentation as
    one scoped batch. Preserve original M24-01/02 tests and Runtime/backends/ABI/benchmarks and all retained
    evidence.
evidence:
  output:
  - docs/evidence/M24-03-<date>.md
  - Exact head/tree, canonical revision/blob, scoped diff and retained local/hosted results.
  - Fault reachability, retirement/publication, resource conservation and actual installed consumer evidence.
  claim_boundary: Bounded validation-model and portable injected-driver software evidence. No general
    physics engine, CAP-M24 closure, real CUDA support/RT qualification, controlled performance, Unreal,
    cybersecurity, Daybreak, signing, release or deployment claim.
