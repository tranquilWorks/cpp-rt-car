acceptance:
- Inventory existing tooling first. Preserve its unsigned candidate and signed external fixture distinctions.
  Existing artifact mode copies one archive to two directories, so it does not prove independent package
  rebuilds. Add a separate ordinary build/report command that validates clean expected source commit/tree
  and declared dependency policy, records actual tool paths/versions/hashes and complete invoked build
  parameters, and builds twice in new independent directories.
- Compare actual complete package archive hashes and member inventories, including file content, type/mode
  and symlink targets. Record both raw archive equality and member differences; refuse to report reproducibility
  on a mismatch or incomplete command. Bind every result to actual source/build/tool/dependency/archive
  inputs and retain commands, failed outputs and bounded execution logs. Never infer authentication or
  release eligibility from local matching bytes.
- Exercise the real CLI, ordinary mismatch/missing/output/source-state cases and two independently built
  current C++ packages with installed consumer validation. Keep normal repository contract/full156+161,
  exact32 hosted names/multiplicity, ABI/defaults/prior tests/evidence and guarded integration/closure.
  No original gate is waived.
- Document the narrowed scope and runbook. Signing-fixture expansion, production identity/key custody/signing
  approval, authenticated provenance and actual release remain unperformed/separate. M27-07 and08 remain
  planned/inactive; no CAP-M20 promotion.
