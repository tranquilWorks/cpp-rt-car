  - 'Inventory every retained non-external finding after01: historical benchmark predicate; mock/native8ms
    startup -2 versus -18; Windows2024ms startup; Windows negative GPU overlap; native-frame TSan500us
    limitation; partial-runtime instrumentation; offline diagnostic warning; broader replay transactionality;
    experimental global FMA policy; application model boundary. Preserve original raw failures, workload,
    deadlines, assertions and source identities.'
  - For actionable behavior reproduce the cause using bounded source-linked controls and actual supported
    OS/compiler evidence, then repair and validate it within cause-specific paths narrowed at selection.
    Investigate the original fixture scheduling and Windows observations; an unchanged retry never counts
    as a repair. Examine broader replay failure conservation and global-policy concurrency against the
    declared contracts. A provable product boundary must be made explicit and tested where applicable;
