  - cmake --build build/m23-cpu --parallel 2
  - ctest --test-dir build/m23-cpu --output-on-failure -R 'm23_benchmark|benchmark_package_consumer'
  - ./build/m23-cpu/tests/simcore_tests --gtest_filter='BenchmarkCpu.*:BenchmarkContract.*:BenchmarkRunner.*:BenchmarkArtifacts.*'
  - python3 tests/benchmark_fixtures/test_cpu_cases.py --cli build/m23-cpu/bench/rtfw-bench --inventory
    bench/fixtures/cpu_cases.json
