acceptance:
- Reproduce and retain the unchanged test_golden_xdma_native --frame observation with the injected driver,
  ordinary execution, ASan/UBSan and initialized TSan; classify pre-main sanitizer startup failures separately.
  No real XDMA node, GPU, FPGA, driver installation or bench access.
- Trace submission scheduling and ownership around the unchanged 500us deadline using offline diagnostic
  builds. Distinguish sanitizer-induced scheduling delay from an actual race/lifecycle defect. Do not
  infer a race from a timeout or dismiss a sanitizer report as overhead.
- If a private software defect is demonstrated, retain a failing baseline control and repair it within
  the narrowed activation scope. Otherwise record a causally supported instrumentation limitation and
  its still-unpassed full-frame result. Preserve all original full-frame/oracle/refusal assertions, mandatory
  preparation/protocol gates and deadline values; new observations cannot replace the failed result or
  claim hardware timing qualification.
- Activate M28-04 from exact target main 526c13065475650f6c86de0ea8fc760d699a07a3 and bind merged canonical
  revision/blob before implementation. Initial cause-specific scope is additive test-owned offline diagnostics,
  controlled scheduling/ownership observations and evidence; production remains unchanged. An offline
  tool may generate an explicitly marked diagnostic copy of private DeviceManager source with fixed-storage
  timestamp hooks, source hashes and exact patch retention, never linked into shipped Runtime. No changed
  deadline, assertion, capability or sanitizer suppression. A demonstrated production defect requires
  a bounded canonical amendment before production edits. An unresolved full-frame timing result may receive
  a truthful limitation disposition; retry success closes no finding.
- Preserve release1.2.1, portable RT0, C ABI8/70 exports/fingerprint/SONAME8, device ABI1, public/default
  policies and supported tuples. Existing source tests/assertions/deadlines and all historical evidence
  stay unchanged; tests/CMakeLists.txt permits additive new-test wiring only.
- For each claimed repair retain a causal baseline failure and corrected outcome. Complete exact-head
  local full validation and all32 hosted checks with the original names and multiplicity, applicable sanitizer/static/no-allocation/default/ABI/actual
  installed package gates, risk review and guarded target/canonical closure. No functional gate is waived.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - git diff --check
  focused_tests_to_add:
  - Reproduce and retain the unchanged test_golden_xdma_native --frame observation with the injected driver,
    ordinary execution, ASan/UBSan and initialized TSan; classify pre-main sanitizer startup failures
    separately. No real XDMA node, GPU, FPGA, driver installation or bench access.
  - Trace submission scheduling and ownership around the unchanged 500us deadline using offline diagnostic
    builds. Distinguish sanitizer-induced scheduling delay from an actual race/lifecycle defect. Do not
    infer a race from a timeout or dismiss a sanitizer report as overhead.
  - If a private software defect is demonstrated, retain a failing baseline control and repair it within
    the narrowed activation scope. Otherwise record a causally supported instrumentation limitation and
    its still-unpassed full-frame result. Preserve all original full-frame/oracle/refusal assertions,
    mandatory preparation/protocol gates and deadline values; new observations cannot replace the failed
    result or claim hardware timing qualification.
  required_ci:
  - All32 exact final-head target checks successful, preserving original baseline names and multiplicity;
    full canonical control validation on planning and closure.
  manual:
  - None inside this software batch. Final owner stage retains all bench, engine, independent human, controlled
    performance, production signing/release/deployment acceptance.
risk:
  class: high
  hazards:
  - An unproven cause, retry pass or instrumented timing result is mistaken for a repair or qualification.
  - A change weakens an old assertion, deadline, ABI/default or prior evidence.
  stop_conditions:
  - A new public API/ABI/schema/default-policy decision or path outside the activated cause-specific scope
    is needed.
  - Credible completion requires a bench, licensed engine, live endpoint, independent human judgement,
    production key or release/deployment action; retain that item for the final owner stage.
rollback:
  strategy: Revert only this batch changes and additive wiring; preserve predecessor implementations,
    immutable evidence and every final-stage obligation.
evidence:
  output:
  - docs/evidence/M28-04-<date>.md
  - Exact source/tree, commands, raw failures/results, source hashes, risk review, final-head CI and guarded
    merge/closure receipts.
  claim_boundary: Portable software only. Investigation can classify an unresolved result without claiming
    it passed. Global qualification, independent human acceptance and production release remain separate.
