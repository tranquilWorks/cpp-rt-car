acceptance:
- Validate and integrate this canonical contract before target implementation. Retain the benchmark draft and all original 74/78, intermediate 76/78, 77/78 and newly exposed validation failures. Reconcile exact target main before activation.
- Capture the actual degradation level immediately before the frame-owner watchdog transition and emit it as degradation_before. Below the cap, record current to current plus one; at the cap, record cap to cap. Preserve one watchdog event per expired frame, callback observation of the previously committed level, event order and existing saturation policy.
- Replay must consume all valid watchdog records at caps 1 and 3 for at least eight frames, including repeated saturated frames, and reproduce final registered application state, frame/input/callback counts, compared action count and full Runtime state. Cover disabled and below-budget controls and nested live-control v2 composition with accepted and rejected synthetic admissions.
- Add public-API regressions that fail on the original source and pass on the candidate, using bounded atomic injected logical clocks and independent transition/state oracles. No sleeps, elapsed-time pass thresholds, private test hooks or benchmark framework dependence.
- Preserve exact comparison and malformed-artifact rejection. Do not skip saturated watchdog records, alter expected transcripts, change hash comparisons or rewrite historical artifacts to hide the defect. Previously malformed saturated transcripts remain rejected; schema layouts and versions are unchanged.
- Preserve default live-control v1 bytes for unaffected fixtures, existing public C++ layouts, C ABI v8 with 70 exports and fingerprint 0xd0e7a5a14bf35f97, SONAME 8, device and extension ABIs, package inventory, memory accounting, allocation boundaries, release 1.2.1 and Apache-2.0.
- Run original-source reproducer, focused active/live-control replay and watchdog tests, address/undefined/thread sanitizer coverage where supported, official full profile, ABI/package/contract checks and all existing exact-head hosted gates. Retain every initial failure and unperformed check; never waive functional failures.
- Verify all 84 currently retained benchmark cases against the integrated repair without changing their original 78 workloads or assertions. Benchmark verification remains in PR 254 after separate repair integration; later feature additions must remain within its 96-row ceiling.
- Record canonical/source/tree/CI identities, the causal change and acceptance evidence. No physical hardware, RT qualification, support promotion, signing, release, deployment, settings or credential action.
validation:
  local:
  - git status --short --branch
  - ./scripts/agent-verify.sh contract
  - Compile and run the retained public-only watchdog reproducer against baseline and candidate; retain outputs and exit codes.
  - Focused existing and new MixedRateReplay, LiveControl and watchdog tests with exact commands retained in evidence.
  - Focused GCC ASan/UBSan and TSan replay/watchdog tests; preserve unsupported execution evidence.
  - ./scripts/agent-verify.sh full
  - python3 tools/check_c_abi.py
  - git diff --check
  focused_tests_to_add:
  - Eight deterministic expiry frames at caps 1 and 3 with exact prior/next action levels, repeated saturation and successful complete active replay.
  - Disabled and below-budget watchdog controls preserve action streams and final state.
  - Nested live-control v2 replay retains accepted/rejected admission history through saturated watchdog frames.
  required_ci:
  - Existing exact-head GCC/Clang sanitizer, Windows MSVC, GCC TSan, determinism, portable assurance, ABI/package and contract gates without removal or weakening.
  manual:
  - Implementation-agent review of transition order, full-state comparison, compatibility and exact changed paths; independent human review status remains explicit.
risk:
  class: high
  hazards:
  - Deriving the prior level from the post-transition level records a transition that never occurred at saturation.
  - Skipping mismatched replay records could conceal actual divergence.
  - A broad repair changes unrelated degradation policy, replay schemas or benchmark workload.
  stop_conditions:
  - The integrated canonical contract is absent or target main has moved without reconciliation.
  - Repair requires public layout/schema/ABI changes, different degradation policy, disabled comparison or any forbidden path.
  - Verification requires weakened assertions, a lucky rerun, unbounded resources, hardware or fabricated evidence.
rollback:
  strategy: Revert the isolated watchdog action correction and its activation as one bounded change, retaining the original failure and leaving benchmark integration blocked until a verified replacement exists.
evidence:
  output:
  - docs/evidence/M23-03R3-2026-09-24.md
  - Exact baseline/candidate public reproducer output, canonical/source/tree mapping, focused/sanitizer/full/hosted results and residual limits.
  claim_boundary: Portable Runtime watchdog action and replay correctness only; no new public interface, physical characterization, RT qualification or release.
