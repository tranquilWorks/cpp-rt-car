acceptance:
- Reproduce pending Runtime stop on the actual merged public CUDA pipeline and preserve a failing old-order
  negative control. Runtime cancels the step but CUDA unregister currently rejects still-owned slots before
  backend shutdown can drain them. No timeout or assertion relaxation.
- In the CUDA backend implementation only, permit a checked unregister after explicit native command stop
  to retire referenced pending/quarantined work through the existing host-side event/stream synchronization
  callbacks before freeing registrations. Preserve running unregister rejection, unsupported device cancellation,
  non-stopped behavior and normal poll-only execution. Do not add executor synchronization or steady allocation.
- Failed synchronization preserves the exact slot/outstanding/registration ownership for retry; no event,
  host registration or borrowed address may be released early. Account each successful retirement once.
  Make concurrency with poll fail safely through slot ownership or the existing serialized lifecycle contract.
  Preserve shutdown idempotence and failure semantics.
- Exercise ordinary and active Runtime stop with held accepted batches, successful checked cleanup, failed
  synchronization/retry and permanent context-loss quarantine cleanup where injected driver cleanup succeeds.
  Lost-context reset must still return lost. Native-driver/API tests also prove running unregister remains
  rejected, stop-gated cleanup and exact counters. Actual inaccessible/lost physical context cleanup is
  not invented.
- Preserve all existing CUDA tests and Runtime/pipeline/sample/ABI/package/benchmark behavior. No public
  layout/header, schema, support matrix, release version, ABI v8/70 exports/fingerprint/SONAME8 or device
  ABI v1 changes.
- Run focused CUDA/native command tests, all original M24-01/02 samples/CLI/parity, ASan/UBSan and TSan
  with resource conservation, required full/strict portable, original and source relocated packages, compiled
  ABI, and all 32 exact-head hosted checks. Keep all earlier evidence and clearly label unavailable physical/independent
  human review.
- Integrate this repair separately, then reconcile and reactivate M24-03 under a canonical amendment before
  resuming feature draft dede9ea. M24-03 and M24-04 remain open; no qualification or maturity closure.
validation:
  local:
  - git status --short --branch
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - python3 tests/cuda_physics/verify_package.py --work-directory build/m24-repair-package
  - python3 tools/check_c_abi.py --library build/m24-pipeline/librtfw.so
  - git diff --check
  focused_tests_to_add:
  - Actual Runtime stopped pending-batch cleanup and failed synchronization retry for frame/active schedules.
  - Native CUDA running rejection, stopped pending/quarantine retirement, permanent loss/reset boundary
    and exact resource conservation.
  - Old-order negative control plus sanitizer/no-allocation/original pipeline/ABI/package regressions.
  required_ci:
  - All prior 32 exact-head hosted checks, with additive portable sample/tests in existing compiler/FMA/MSVC,
    sanitizer, static and package jobs.
  - Optional CUDA toolkit compile/link and reproducible kernel compilation; no GPU required or physical
    evidence inferred.
  - Original ABI, release, no-allocation, package, benchmark and determinism-artifact gates remain unchanged.
  manual:
  - Independent ownership/arithmetic/graph/rate review remains unperformed unless actually obtained; agent
    self-review is labelled.
  - Physical CUDA requires an accessible named device tuple; absence remains NOT RUN and does not block
    portable software.
risk:
  class: high
  hazards:
  - Synchronization occurs before explicit stop or while executor work can still reuse memory.
  - Slot retirement decrements ownership twice or a failed sync loses the original pending/quarantine
    state.
  - A lost-context simulation is mistaken for physical recoverability.
  stop_conditions:
  - Canonical planning contract is not integrated before activation, or target baseline moves without
    reconciliation.
  - Runtime manager, public ABI/schema or another forbidden path needs a change beyond the allowed CUDA
    implementation; retain a reproducer and plan a separate repair.
  - Success requires weakened tests, invented resource observations, unbounded waits, unsafe cleanup or
    absent hardware evidence.
  - New physical/controlled/signing/release/deployment authority or a substantive product decision would
    be required.
rollback:
  strategy: Revert the isolated CUDA implementation/test repair and its activation/evidence. Preserve
    blocked M24-03 draft and baseline tests; do not call the original ownership cycle safe.
evidence:
  output:
  - docs/evidence/M24-03R-<date>.md
  - Exact canonical/source/tree, old-order negative control, full local and exact-head hosted results
    with failures retained.
  claim_boundary: Bounded validation-model and portable injected-driver software evidence. No general
    physics engine, CAP-M24 closure, real CUDA support/RT qualification, controlled performance, Unreal,
    cybersecurity, Daybreak, signing, release or deployment claim.
