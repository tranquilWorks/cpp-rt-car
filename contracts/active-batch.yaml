acceptance:
- Reconcile preserved feature279 with integrated sampled cleanup/checkpoint repair282. Preserve actual
  stop-time safe acknowledgement before retaining the private teardown stage; failed acknowledgements
  still execute on retry. Preserve exact produced sampled-device checkpoint provenance reconstructed from
  validated existing bytes. No further Runtime/native/layout/schema/identity changes are part of M26-04.
  Complete every original feature acceptance and fresh gates; prerequisite probes do not close the feature.
- Use integrated M26-04R2 explicit DeviceCapacityPolicy::native_per_backend only in the new combined CUDA/XDMA
  sample. Distinguish unchanged native CUDA1/XDMA2 storage from aggregate Runtime admission reservation3
  for the three same-nominal device phases. No native queue/event-pool inflation or weakened phase/backend/global
  admission. XDMA-only and all prior kits retain their defaults. Reconcile preserved draft279 with repaired
  main; preserve both repair implementations/tests/evidence and all original feature criteria. This amendment
  reactivates only M26-04; complete fresh feature gates before closure.
- Use integrated M26-04R actual four-slot sampled storage with the unchanged frozen ring_capacity4; no
  diagnostic two-slot downgrade. Reconcile preserved draft279 with repaired main before feature verification.
  Preserve the private storage plumbing and public comment-only extension, new storage regressions/consumer
  and all failed repair/feature evidence unchanged. This amendment closes the repair and resumes only
  the original M26-04 feature acceptance; all feature criteria and required gates remain binding.
- Preserve the immutable M26-01 contract/digest, fixed256-capacity integer SoA/initialization/model/controls/rate
  envelopes/channel identities and independent C++/Python oracles, all CPU/CUDA source kits/tests and
  repaired Runtime/native backends. New source files may derive documented copies with provenance and
  reuse installed sibling headers. Keep eight logical scenario phases; bounded CPU completion/codec callbacks
  may implement device-phase bookkeeping after successful terminal validation, but must be identified
  separately with exact physical graph/count/budget accounting. No new physical state, hidden direct submit,
  device/device channel, peer DMA or changed frozen logical workload.
- Provide native-worker and independent host-job execution for sim_xdma with CPU physics and sim_combined
  with both existing CUDA kernel and Graph physics, plus actual external CIL using the preserved vector
  controller. Stage CUDA output through the existing CPU plant stage before XDMA. Use actual XdmaDeviceBackend
  HAL-v2 batches, fixed caller-owned host buffers/card storage, explicit payload roles and host-visible
  references, ordered H2C/C2H and declared control/event operations. Keep CUDA and XDMA timelines/backend
  identities distinct, at most the frozen two XDMA in-flight slots, and immutable rate envelopes by partitioning
  budgets among actual phases.
- 'Register actual M21 sampled-I/O descriptors for the four channels with exactly one device endpoint;
  leave CPU-only plant_aggregate as ordinary cross-rate data. Preserve identities26001..26005, payload
  shape/LE encoding/scales/calibration/trigger/sequence/age and fixed120-byte sampled header. Explicitly
  adapt existing120-byte sample-private envelopes without changing them. Use direction-appropriate public
  policies: input stale substitution uses the declared initial frame, while missing CPU-to-device command
  substitutes zero safe effort and output safety is claimed only after terminal acknowledgement. Sample
  safe-transition timeout remains8ms; logical device completion budgets fit their rate envelope. Correlate
  the actual injected backend clock domain explicitly rather than comparing unrelated clocks.'
- Route startup, failure and shutdown safe frames through real Runtime safe-transition submissions and
  the actual XDMA backend/driver. Simulated sensor calibration and actuator/ECU loopback operate on transferred
  payloads; return validated device data to canonical host state before checkpoint capture, never publish
  failed completion data or calculate replacement device work behind the oracle. Verify every active/inactive
  state field, channel selection/sequence/age/generation/control and exact CPU/XDMA/combined parity over
  count1/odd/default/capacity256, bounded ticks through1024, workers1/2/3 and grains1/4/16/64. Record
  exact actual backend operations, safe acknowledgements, terminal outcomes and resource conservation.
- Native XDMA and CUDA deterministic_mock remain0 and native replay remains unsupported. Only an explicitly
  named complete forwarding sample adapter accepting the owned deterministic injected XDMA driver may
  declare mock semantics and select the integrated finite five-second simulator host watchdog, using the
  concurrent-safe injected Runtime clock; backend command deadlines stay finite and logical budgets unchanged.
  Every transfer, control/event and completion still executes through the actual native backend. Prove
  native replay-enabled registration rejects and no native-resource path can inherit simulator capabilities/timing.
- Preserve originating-owner lossless trusted replay for the declared simulated variants and compatible
  paired fresh-owner checkpoint recovery. Rebuild card-side state from freshly uploaded canonical host
  data, reconstruct output header/timeline sequence from public Runtime state, retain original owner/configuration
  identities and reject malformed/foreign/CPU/CUDA-only/cross-variant artifacts before side effects. Tests
  cover full replay and exact state/action/control/channel/safe-transition semantics without identity
  rewriting or omitted records. Detect telemetry gaps and refuse invalid replay.
- Implement frozen tick6 underflow, overrun and stop_failure through real missing command, duplicate sampled
  publication and missing safe acknowledgement. Underflow must yield zero effort and truthful acknowledged/unknown
  safety; overrun must reject without overwrite and fail the release; failed stop must retain borrowed
  resources and status until bounded retry. Include stale sequence/timestamp/payload/header corruption,
  delayed/not-ready and actual transfer timeout, short transfer, driver loss/reset failure, saturation,
  cancellation, partial initialize/shutdown failures, cleanup retry and multiple-owner isolation. Recover
  only at documented boundaries or via a fresh compatible owner and verify the independent oracle. Preserve
  earlier CUDA/CPU/external campaigns and failures.
- Prove steady execution and supported replay allocate no ordinary heap, including real native XDMA worker
  activity; fixed MemoryPlan/sample-owned budgets and positive allocation instrumentation controls remain
  explicit. Configure/finalize and off-lane lifecycle work may allocate. Borrowed buffers, driver state,
  host jobs and memory outlive Runtime through failed checked stop; accepted submissions and resources
  reconcile exactly after success/retry. Add sanitizer/leak/race/static coverage and meaningful concurrency
  and retention negatives.
- Ship a complete public-SDK golden_xdma source kit and one-command build/run/independent artifact validation
  with hashes of every reused sibling source. Artifacts label sim_xdma versus sim_combined, actual sampled-I/O
  metadata/safety/status/counts, original state/replay pairing and physical NOT_RUN. Test actual CPack
  extraction after removed original prefix, custom include/data paths with spaces, source embedding, all
  prior SDK consumers and missing/private-path/source/configuration/state/cleanup/fabricated-backend negatives.
  Prior package contracts may only add the new exact data inventory, never remove assertions. Guide links
  may be additive. Physical XDMA/combined execution stays under M18; no default hardware probe or invented
  real-host success.
- Run frozen contract/config and prior CPU Python tests, focused numerical/device/rate/sampled-I/O/control/replay/fault/allocation/concurrency/process
  tests, supported ASan/UBSan/leaks and TSan, Clang static analysis, explicit contract/quick/full, package
  gates and all32 exact-head hosted records with M26-03 names/multiplicity. Existing protected ci.yml
  is unchanged; new tests join existing targets/filters and allowed docs CI. Retain every failure/retry/correction,
  exact canonical/head/tree/check/merge evidence and agent risk review. Preserve the known M23 timeout
  benchmark finding as separate follow-up. Close only M26-04; M26-05/M26-06 remain inactive.
validation:
  local:
  - python3 tools/check_golden_contract.py
  - python3 tools/generate_golden_config.py --check
  - python3 -m unittest discover -s tests/golden_system -p "test_*.py"
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ctest --test-dir build/agent-quick -R golden --output-on-failure
  - python3 tests/golden_xdma/verify_package.py --work-directory build/m26-04-package
  - ./scripts/agent-verify.sh full
  - Focused XDMA/combined sampled-I/O sanitizer/leak/allocation/static/process commands retained in evidence.
  - git diff --check
  focused_tests_to_add:
  - Exact nominal CPU/XDMA/CUDA+XDMA kernel/Graph parity through real native backend operations and sampled-I/O.
  - Acknowledged safe startup/failure/shutdown, underrun/overrun/stale/timeout/loss/reset/retention and
    recovery.
  - Originating-owner replay, native rejection, fresh-owner checkpoint recovery, foreign/malformed rejection,
    actual no-allocation and isolation.
  - Native/host/external CLI, independent full artifacts, relocated CPack/full SDK/embedding and negative
    controls.
  required_ci:
  - All32 exact-head target records successful with exact M26-03 names/multiplicity; clean/head/base/no
    unresolved review guards and fetched merge-tree equality.
  - New portable coverage joins existing compiler/FMA/sanitizer/package targets and allowed docs CI without
    modifying protected ci.yml or weakening prior tests/timeouts.
  manual:
  - M25 human first-use and independent ownership review remain UNPERFORMED.
  - Physical XDMA/CUDA/combined/HIL requires a named owned tuple under M18; no hardware/RT1/RT2/Unreal/controlled-performance/release/deployment
    qualification.
risk:
  class: high
  hazards:
  - Adapter advertises simulator replay for native hardware or bypasses actual XDMA submission.
  - Malformed, failed or stale device data reaches canonical plant state before Runtime validation.
  - Safety is claimed without an actual terminal safe-output acknowledgement.
  - Card payload, clock correlation, timeline or sampled sequence differs after restore/replay.
  - Borrowed buffers/driver/jobs die while native worker or failed stop retains ownership.
  - Codec/bookkeeping changes frozen semantics or package inventory and hides physical callback counts.
  stop_conditions:
  - A Runtime/native backend/public ABI/schema or frozen logical workload change requires a separately
    bounded canonical amendment/repair.
  - Protected prior sources/assertions, native policy, mandatory gate or timeout would need weakening.
  - A new material product decision, physical/privileged access, signing or release action is required.
rollback:
  strategy: Revert only the new XDMA golden source kit/tests/docs and additive install/validation wiring;
    preserve all CPU/CUDA kits, frozen contract/oracles, Runtime/native backends/ABIs, earlier evidence
    and support claims.
evidence:
  output:
  - docs/evidence/M26-04-<date>.md
  - Exact acceptance mapping, commands/status/counts/source and canonical identities, full failed/retried
    logs, agent review, local/hosted and guarded merge evidence.
  claim_boundary: Portable Runtime sampled-I/O and actual native XDMA/CUDA backend execution through owned
    simulated drivers only. No physical safe-state, timing, hardware/RT, controlled performance, Unreal,
    CAP-M26 closure or release/deployment claim.
