acceptance:
- Integrate and validate this canonical repair scope before target implementation. Use an isolated branch from the exact reconciled target main; preserve replay PR 256 and benchmark PR 254 unchanged until their own reactivation.
- Every queue node dereference must use a validated hazard-protected pointer. Protect enqueue tail, dequeue head and successor for their actual access lifetimes; validate the owning queue cursor before successor access. Preserve Michael-Scott FIFO behavior, helping, empty semantics and concurrent producer/consumer support.
- Simultaneous live HazardGuards must own independent hazard records, including guards in one thread; clearing or destroying one must not clear another. Prevent accidental copying of an owning guard and permit safe record reuse only after its pointer is cleared. Preserve the sequentially consistent publication/removal/scan protocol and existing protect return value.
- Do not mask reclamation by disabling scans, deferring all nodes to queue destruction, leaking every retired node, adding a global blocking queue lock, or removing concurrent tests. Preserve the existing experimental allocation and reclamation boundary; do not promote this utility to a bounded Runtime or RT lane.
- Add deterministic nested-guard and reclamation-lifetime regressions, exact FIFO/empty checks, and fixed-work concurrent enqueue/dequeue ownership tests with independent exact-once value accounting. Use bounded iteration counts and joined thread lifetimes; no timing sleeps or retry-until-green validation.
- Preserve all existing queue/stack and full repository tests. Run focused GCC and Clang ASan/UBSan and TSan where supported, the official full profile, exact scope review and existing ABI/package/contracts. Retain the initial ASan failure and all unperformed checks; a hosted functional failure cannot be waived.
- Preserve stable C ABI v8, SONAME 8, 70 exports/fingerprint, supported C++ Runtime/device/extension interfaces, package inventory, release version, schemas, benchmark sources and every support claim. These experimental header repairs must not introduce a supported Runtime dependency.
- Record exact canonical/source/tree/CI identities, implementation reasoning, verification and residual limitations in evidence/current-state/handoff. Reconcile the separate replay PR only after integration. No Unreal, hardware, RT, signing, release, deployment, secret or settings action.
validation:
  local:
  - git status --short --branch
  - git rev-parse HEAD
  - ./scripts/agent-verify.sh contract
  - Focused existing and new HazardPointer/LockFreeQueue tests under GCC/Clang ASan+UBSan and GCC TSan, with the exact commands and fixed workloads retained in evidence.
  - ./scripts/agent-verify.sh full
  - python3 tools/check_c_abi.py
  - git diff --check
  focused_tests_to_add:
  - Independent simultaneous guard ownership and exact reclamation only after each protecting guard clears.
  - Queue FIFO and empty behavior with repeated bounded reuse; joined simultaneous producers/consumers with exact-once independent integer accounting.
  - Existing stack and queue regressions under address/undefined/thread sanitizers; no node access after reclaim.
  required_ci:
  - Existing exact-head GCC/Clang Debug/RelWithDebInfo sanitizer, MSVC, TSan, determinism, portable assurance, package/ABI and contract jobs without removal or weakening.
  - The standing unavailable-hosted-CI exception applies only to jobs that cannot execute. Preserve actual functional failures as blockers and use available hosted validation.
  manual:
  - Implementation-agent ownership and memory-order review; independent human review status remains explicit and is never manufactured.
risk:
  class: high
  hazards:
  - An independently loaded queue pointer differs from the protected pointer and is reclaimed before dereference.
  - A second guard silently overwrites the first guard's protection or prematurely reuses its record.
  - A successor is reclaimed after the head changes while the old head remains protected.
  - A superficial fix hides the ASan report without preserving concurrent queue semantics or reclamation.
  stop_conditions:
  - The integrated canonical repair scope is absent or target main has moved without reconciliation.
  - Repair requires supported Runtime/ABI/package changes, a different queue algorithm, a global blocking lock, disabling reclamation or weakening mandatory tests.
  - Credible sanitizer/ownership validation cannot be obtained; retain the blocker and do not merge based on repeated lucky passes.
rollback:
  strategy: Revert this queue/hazard ownership repair as one scoped change, preserving all original failure evidence and leaving replay integration blocked until a validated replacement exists.
  data_migration: None.
evidence:
