acceptance:
- 'Use existing release/package tooling on the exact final source: clean default and applicable optional
  CPack artifacts, source/contract hashes, relocated installed public consumers, modern/legacy migration
  and supported OS/compiler evidence. Keep optional native validation compile/injected-driver/absent-device
  only.'
- Repeat the existing bounded fixed portable soak and unsigned independent rebuild comparison with complete
  commands, hashes, measured duration, resource and terminal journals. Reuse delivered tools and tests;
  do not create a new campaign, schedule, workflow, signing fixture or release version.
- Bind the final package and evidence to exact tested source/tree and review all remaining ledger items
  after the last change. Preserve full local gates, all32 hosted names/multiplicity, failures and exact
  fetched merge-tree guards. Rerun affected verification if a final change invalidates evidence.
- Produce the final artifact/evidence index, rollback reference and ordered owner test handoff. Mark only
  the scoped software delivery complete if its exit criteria actually pass. Otherwise report the specific
  remaining software blocker. M18/M19/CAP-M20/manual acceptance stays open as applicable; no keys, signing,
  tag, release publication, deployment or human approval occurs in this batch.
- Activate only M28-06 from exact target main232df8fe2b56ffbdf174fc2bcf24a99995062d09 and bind merged
  canonical revision/blob before implementation. Reuse existing package, migration, bounded4096-cycle
  modern/legacy soak and actual two-build unsigned comparison tooling. Add bounded final artifact/evidence
  index, rollback and ordered owner handoff; update living/generated documents and release digest coverage
  only. No production/tool behavior repair, new tests/workflow/campaign/qualification card, signature
  fixture, signing or release activity. Preserve all M28-05 ledger identities and unresolved dispositions.
- Preserve release1.2.1 portable RT0, C ABI8/70 exports/fingerprint/SONAME8, device ABI1, public/default
  policies, supported tuples, existing tests/assertions/deadlines and historical evidence. No test wiring
  or runtime changes are authorized in this final documentation/verification batch.
- For each claimed repair retain a causal baseline failure and corrected outcome. Complete exact-head
  local full validation and all32 hosted checks with the original names and multiplicity, applicable sanitizer/static/no-allocation/default/ABI/actual
  installed package gates, risk review and guarded target/canonical closure. No functional gate is waived.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - git diff --check
  focused_tests_to_add:
  - Reuse existing migration, package, portable soak and unsigned rebuild checks; add no redundant test
    suite.
  required_ci:
  - All32 exact final-head target checks successful, preserving original baseline names and multiplicity;
    full canonical control validation on planning and closure.
  manual:
  - None inside this software batch. Final owner stage retains all bench, engine, independent human, controlled
    performance, production signing/release/deployment acceptance.
risk:
  class: moderate
  hazards:
  - An unproven cause, retry pass or instrumented timing result is mistaken for a repair or qualification.
  - A change weakens an old assertion, deadline, ABI/default or prior evidence.
  stop_conditions:
  - A new public API/ABI/schema/default-policy decision or path outside the activated cause-specific scope
    is needed.
  - Credible completion requires a bench, licensed engine, live endpoint, independent human judgement,
    production key or release/deployment action; retain that item for the final owner stage.
rollback:
  strategy: Revert only this batch changes and additive wiring; preserve predecessor implementations,
    immutable evidence and every final-stage obligation.
evidence:
  output:
  - docs/evidence/M28-06-<date>.md
  - Exact source/tree, commands, raw failures/results, source hashes, risk review, final-head CI and guarded
    merge/closure receipts.
  claim_boundary: Portable software only. Investigation can classify an unresolved result without claiming
    it passed. Global qualification, independent human acceptance and production release remain separate.
